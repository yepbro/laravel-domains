# Linux kernel tuning for the production Domain Crawler server (spec §10.2).
#
# One external IP (spec §3.1), the planned load from the config (spec §5.10):
#   dns.concurrency = 2000 (a UDP socket pool of the same size),
#   dns.max_qps = 10000 to the local unbound;
#   http.concurrency = 2000 (also the global connection cap),
#   http.max_rps = 1000, keep-alive disabled (spec §5.5) — a connection per
#   request, i.e. up to ~1000 new outbound TCPs per second.
#
# The full calculation of every parameter — docs/os-tuning.md. Installation:
# deploy/sysctl/README.md (cp to /etc/sysctl.d + sysctl --system).

## Outbound connections from a single IP (spec §10.2 item 1).

# Ephemeral ports: 55,296 of them. The kernel default 32768-60999 (28,232) is
# tight against the peak: 2000 concurrent connections + up to ~60,000 4-tuples
# in TIME_WAIT (churn ~1000/s × a 60 s timeout). The unique thing is the 4-tuple
# (port+destination address), so the range is wider than the hard requirement;
# the lower bound 10240 keeps all local listeners (sshd 22, unbound 53,
# postgres 5432, redis 6379, metrics 9090+, DevTools 9222) out of the conflict
# zone with outbound traffic.
net.ipv4.ip_local_port_range = 10240 65535

# Reuse of TIME_WAIT ports for outbound: on kernels >= 4.12 the default 2 =
# "loopback only", while the HTTP worker goes to remote sites — it needs 1.
# Requires tcp_timestamps=1 (see below). tcp_tw_recycle was removed from the
# kernel and is not used.
net.ipv4.tcp_tw_reuse = 1

# TCP timestamps: the condition for tcp_tw_reuse to work (PAWS distinguishes
# old segments). The default is on — pinned explicitly, the config is self-documenting.
net.ipv4.tcp_timestamps = 1

# The TIME_WAIT socket cap: the expected peak ~60,000 (the calculation in
# docs/os-tuning.md) ×4 headroom; overflow kills TIME_WAITs with noise
# in the logs ("time wait bucket table overflow"). The memory per entry is small.
net.ipv4.tcp_max_tw_buckets = 262144

## Accept queues (local listeners: unbound TCP 53 takes the TCP fallback of
## the DNS worker — up to ~2000 concurrent; metrics, postgres).

# The accept queue of listening sockets (the listen(backlog) cap). The default
# is 128 on some distributions; 4096 covers the TC=1 burst with headroom, the
# memory cost is tiny.
net.core.somaxconn = 4096

# The SYN queue of the same listeners: half the connections at establishment
# time. In sync with somaxconn.
net.ipv4.tcp_max_syn_backlog = 4096

# The packet queue between soft IRQ and the protocol: RX peaks when bodies are
# downloaded (up to 1000 RPS × up to 2 MiB each). The default 1000 drops on
# gigabit bursts (visible in /proc/net/softnet_stat, column 2).
net.core.netdev_max_backlog = 4096

## File descriptors (spec §10.2 item 1: "nofile limits").

# The system-wide cap of open files across all processes. The project peak
# is ~12,000 (the per-service table in docs/os-tuning.md: a UDP pool of 2000 +
# the TCP fallback of dns-worker and unbound, GlobalConns 2000 at http-worker,
# Chromium, DB pools); on new kernels the default is "no limit" (LONG_MAX),
# on older LTS it depends on RAM. The final value 2,097,152 — two orders of
# magnitude above the peak: not a "budget" (memory is allocated only for a
# really open file) but a guard against descriptor leaks — a finite
# system cap arrives before the leak eats the memory. Lowering it to
# ~the peak is not allowed: file-max is the system-wide kill-switch (ENFILE
# takes down sshd and postgres together with the crawler).
fs.file-max = 2097152

# The per-process limit (LimitNOFILE of the systemd units, T-085; in Docker —
# compose ulimits, already 65535) is not set here: this is not a sysctl. The
# calculation and the value 65535 — docs/os-tuning.md; fs.nr_open (the nofile
# ceiling, the default 1048576) is higher and is left alone.

## Conntrack (spec §10.2 item 2: "grow the table or exclude the traffic").

# The tracked-flows table: a churn of ~1000 TCP/s, an entry lives ~120 s after
# close (the conntrack TIME_WAIT timeout) → ~120,000 in steady
# state + active + UDP flows. The default at 8 GB RAM is ~262,144 — without
# headroom; overflow drops packets of ALL the server's connections
# ("nf_conntrack: table full, dropping packet"). 1,048,576 — ×8 headroom;
# memory is lazy (~320 B per live entry).
net.netfilter.nf_conntrack_max = 1048576

# The hash table = max/4 (chains of >8 entries degrade the lookup). The key
# is writable since kernel 5.15; on older ones it is read-only — systemd-sysctl
# will only warn, the size is set by the module's hashsize parameter (README).
# The net.netfilter.* keys appear only with the nf_conntrack module loaded:
# without it systemd-sysctl skips these lines; the module is added to
# autoload (/etc/modules-load.d) before systemd-sysctl runs —
# the instructions are in the README, otherwise the values are lost on reboot.
net.netfilter.nf_conntrack_buckets = 262144

## DNS UDP buffers (spec §10.2 item 3; spec §5.4: a pool of 2000 UDP sockets,
## TCP fallback on truncation).

# The setsockopt(SO_RCVBUF/SO_SNDBUF) ceiling without CAP_NET_ADMIN. Raised
# primarily for unbound (its so-rcvbuf at high QPS runs into
# rmem_max, silently clipped) and for the crawler pool's future SetReadBuffer.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# The per-socket default — NOT set (the lines below are commented out): the
# default values are already sufficient — exactly one request per pool socket
# in flight (the UDPPool contract), datagrams <= 512 B (a client without EDNS0),
# the 212,992-byte default per socket — ×400 headroom. Explicitly pinning the
# kernel default would override the distribution/admin's tuning (sysctl.d is
# applied in lexicographic order) with no functional benefit.
# TCP (the 64 KiB fallback, 2 MiB HTTP bodies) lives on tcp_rmem/tcp_wmem
# (autotuning, the default max of 4-6 MiB is enough) — not touched.
#net.core.rmem_default = 212992
#net.core.wmem_default = 212992
