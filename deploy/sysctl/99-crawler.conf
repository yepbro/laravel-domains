# Тюнинг ядра Linux для боевого сервера Domain Crawler (ТЗ §10.2).
#
# Один внешний IP (ТЗ §3.1), плановая нагрузка из конфига (ТЗ §5.10):
#   dns.concurrency = 2000 (пул UDP-сокетов того же размера),
#   dns.max_qps = 10000 к локальному unbound;
#   http.concurrency = 2000 (он же глобальный потолок соединений),
#   http.max_rps = 1000, keep-alive отключён (ТЗ §5.5) — соединение на
#   каждый запрос, т.е. до ~1000 новых исходящих TCP в секунду.
#
# Полный расчёт каждого параметра — docs/os-tuning.md. Установка:
# deploy/sysctl/README.md (cp в /etc/sysctl.d + sysctl --system).

## Исходящие соединения с одного IP (ТЗ §10.2 п. 1).

# Эфемерные порты: 55 296 шт. Дефолт ядра 32768-60999 (28 232) впритык к
# пику: 2000 одновременных соединений + до ~60 000 четвёрок в TIME_WAIT
# (churn ~1000/с × таймаут 60 с). Уникальна 4-тупля (порт+адрес назначения),
# поэтому диапазон шире жёсткой потребности; нижняя граница 10240 держит
# все локальные слушатели (sshd 22, unbound 53, postgres 5432, redis 6379,
# метрики 9090+, DevTools 9222) вне зоны конфликта с исходящими.
net.ipv4.ip_local_port_range = 10240 65535

# Переиспользование портов из TIME_WAIT для исходящих: на ядрах >= 4.12
# дефолт 2 = «только loopback», а HTTP-воркер ходит к удалённым сайтам —
# нужно 1. Требует tcp_timestamps=1 (см. ниже). tcp_tw_recycle удалён из
# ядра и не используется.
net.ipv4.tcp_tw_reuse = 1

# TCP-таймстампы: условие работы tcp_tw_reuse (PAWS отличает старые
# сегменты). Дефолт включён — фиксируется явно, конфиг самодокументирован.
net.ipv4.tcp_timestamps = 1

# Потолок TIME_WAIT-сокетов: ожидаемый пик ~60 000 (расчёт в
# docs/os-tuning.md) ×4 запас; переполнение прибивает TIME_WAIT с шумом
# в логах ("time wait bucket table overflow"). Память на запись мала.
net.ipv4.tcp_max_tw_buckets = 262144

## Приёмные очереди (локальные слушатели: unbound TCP 53 принимает
## TCP-fallback DNS-воркера — до ~2000 одновременных; метрики, postgres).

# accept-очередь слушающих сокетов (cap listen(backlog)). Дефолт 128 у
# части дистрибутивов; 4096 покрывает всплеск TC=1 с запасом, память
# копеечная.
net.core.somaxconn = 4096

# SYN-очередь тех же слушателей: половина соединений в момент
# установления. Синхронно с somaxconn.
net.ipv4.tcp_max_syn_backlog = 4096

# Очередь пакетов между мягким IRQ и протоколом: RX-пики при скачивании
# тел (до 1000 RPS × до 2 МиБ). Дефолт 1000 даёт дропы на гигабитных
# всплесках (видно в /proc/net/softnet_stat, колонка 2).
net.core.netdev_max_backlog = 4096

## Дескрипторы файлов (ТЗ §10.2 п. 1: «лимиты nofile»).

# Системный потолок открытых файлов всех процессов. Пик проекта
# ~12 000 (таблица по сервисам в docs/os-tuning.md: пул UDP 2000 +
# TCP-fallback у dns-worker и unbound, GlobalConns 2000 у http-worker,
# Chromium, пулы БД); на новых ядрах дефолт «нет лимита» (LONG_MAX),
# на старых LTS зависит от RAM. Конечное значение 2 097 152 — на два
# порядка выше пика: не «бюджет» (память выделяется только под реально
# открытый файл), а страховка от утечки дескрипторов — конечный
# системный потолок раньше, чем утечка съест память. Занижать до
# ~пика нельзя: file-max — общесистемный kill-switch (ENFILE валит
# sshd и postgres вместе с краулером).
fs.file-max = 2097152

# Лимит на процесс (LimitNOFILE systemd-юнитов, T-085; в Docker — ulimits
# compose, уже 65535) здесь не задаётся: это не sysctl. Расчёт и значение
# 65535 — docs/os-tuning.md; fs.nr_open (потолок nofile, дефолт 1048576)
# выше и не трогается.

## Conntrack (ТЗ §10.2 п. 2: «увеличить таблицу или исключить трафик»).

# Таблица отслеживаемых потоков: churn ~1000 TCP/с, запись живёт ~120 с
# после закрытия (timeout TIME_WAIT у conntrack) → ~120 000 в steady
# state + активные + UDP-потоки. Дефолт на 8 ГБ RAM ~262 144 — без
# запаса; переполнение роняет пакеты ВСЕХ соединений сервера
# ("nf_conntrack: table full, dropping packet"). 1 048 576 — запас ×8;
# память ленивая (~320 Б на живую запись).
net.netfilter.nf_conntrack_max = 1048576

# Хэш-таблица = max/4 (цепочки >8 записей деградируют lookup). Запись
# действует с ядра 5.15; на старых ключ read-only — systemd-sysctl лишь
# предупредит, размер задаётся hashsize-параметром модуля (README).
# Ключи net.netfilter.* появляются только с загруженным модулем
# nf_conntrack: без него systemd-sysctl пропускает эти строки; модуль
# включается в автозагрузку (/etc/modules-load.d) до systemd-sysctl —
# инструкция в README, иначе на перезагрузке значения потеряются.
net.netfilter.nf_conntrack_buckets = 262144

## UDP-буферы DNS (ТЗ §10.2 п. 3; ТЗ §5.4: пул 2000 UDP-сокетов,
## TCP-fallback при усечении).

# Потолок setsockopt(SO_RCVBUF/SO_SNDBUF) без CAP_NET_ADMIN. Поднимается
# прежде всего для unbound (его so-rcvbuf при высоком QPS упирается в
# rmem_max, молча обрезаясь) и для будущего SetReadBuffer пула краулера.
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216

# Дефолт на сокет — НЕ задаётся (строки ниже закомментированы): значения
# по умолчанию уже достаточны — на каждом сокете пула ровно один запрос
# в полёте (контракт UDPPool), датаграммы <= 512 B (клиент без EDNS0),
# 212 992 байта дефолта на сокет — запас ×400. Явная фиксация дефолта
# ядра перебила бы тюнинг дистрибутива/админа (sysctl.d применяется в
# лексикографическом порядке) без функциональной пользы.
# TCP (fallback 64 КиБ, HTTP-тела 2 МиБ) живёт на tcp_rmem/tcp_wmem
# (автотюнинг, дефолтный max 4-6 МиБ достаточен) — не трогаем.
#net.core.rmem_default = 212992
#net.core.wmem_default = 212992
