# PostgreSQL 16 — боевая конфигурация (T-086).
#
# Цель: PostgreSQL из пакетов ОС (ТЗ §10.1 — systemd-хост, не контейнер) на
# сервере 8 ГБ RAM / NVMe (ТЗ §3.1). Ресурсный потолок — systemd-юнит с
# MemoryMax 3 ГБ (T-085, deploy/systemd/) — страховка над бюджетом §3.2
# «shared_buffers ≈ 2 ГБ + бэкенды» ≈ 2,5 ГБ (пики обслуживания — docs/db.md,
# раздел «Память»). Подключение: config_file= к кластеру пакетного PG
# (или include из /etc/postgresql/<версия>/<кластер>/postgresql.conf).
#
# Dev-стек Docker использует отдельный deploy/docker/postgres/postgresql.dev.conf
# (объёмы памяти/соединений — dev-масштаб, семантика планировщика/WAL/autovacuum
# совпадает); compose.yaml не менялся. Формат файла и ключевые значения ТЗ §6.3
# охраняются юнит-тестом postgresql_conf_test.go (make test). Обоснования всех
# параметров и размены — docs/db.md, раздел «Тюнинг боевого PostgreSQL».

# --------------------------------------------------------------- соединения
# Все сервисы на этом же сервере (ТЗ §3.1): PostgreSQL слушает только
# localhost (+ unix-сокет), наружу не экспонируется (ТЗ §9).
listen_addresses = 'localhost'
# ТЗ §6.3: пулы pgx всех сервисов суммарно ≤ 20–50 соединений. 8 сервисов × 5
# (7 конвейерных + web) + dashboard (2 — задаёт его юнит; глобальная
# переменная crawler.env его переопределит, безопасный глобальный
# максимум — 4) + crawlerctl (pool_size 2) + админ ≈ 44–46; 3 из 50
# резервирует superuser_reserved_connections. Больше поднимать нельзя —
# каждый бэкенд ест бюджет памяти §3.2 (см. docs/db.md, бюджет соединений).
max_connections = 50

# --------------------------------------------------------------- память (ТЗ §3.2)
# ≈ 25 % RAM — как предписывает бюджет «shared_buffers ≈ 2 ГБ» на 8-гигабайтном
# сервере; остальное кэширует ОС (effective_cache_size ниже — подсказка об этом).
shared_buffers = 2GB
# Память одного узла плана (сорт/хэш) одного запроса. Тяжёлые запросы —
# единовременно в нескольких воркерах (пулы ленивые, боевые запросы — точечные
# по индексам): worst case ~30 активных узлов × 16 МБ ≈ 0,5 ГБ — бюджет
# бэкендов §3.2. Массовая работа идёт COPY/unnest-пачками и work_mem не ест.
work_mem = 16MB
# CREATE INDEX / миграции на партициях 30–50 млн строк (§6): разовые операции
# администрирования, 256 МБ заметно ускоряет построение индексов, память
# кратковременная.
maintenance_work_mem = 256MB
# Отдельный потолок autovacuum-воркеров (дефолт −1 = maintenance_work_mem):
# 4 воркера × 128 МБ не конкурируют с миграциями за maintenance_work_mem и
# вписываются в бюджет вместе с ним (одновременно не бывает и того и другого
# в полном объёме). 128 МБ TID-массива ≈ 20 млн мёртвых строк — с триггером
# вакуума 0.02 реальный массив на порядок меньше; при переполнении вакуум
# честно деградирует постраничным проходом, память не растёт.
autovacuum_work_mem = 128MB
# Подсказка планировщику: 2 ГБ shared_buffers + ожидаемый page cache ОС
# (остаток бюджета §3.2). Память не выделяется, влияет только на выбор
# индексных планов.
effective_cache_size = 4GB

# --------------------------------------------------------------- планировщик / NVMe (ТЗ §6.3)
# Случайное чтение с NVMe почти не дороже последовательного: дефолтные 4.0
# неоправданно штрафуют index scan, а нагрузка — точечные чтения по PK/индексам
# и bitmap-сканы по партициям.
random_page_cost = 1.1
# ТЗ: ≥ 200. Глубина очереди NVMe переваривает упреждающие чтения bitmap heap
# scan по партициям domains/subdomain_results без ожидания.
effective_io_concurrency = 200
# То же для обслуживания: prefetch VACUUM и построения индексов на партициях
# 30–50 млн строк — вакуум не становится узким местом на тысячах партиций.
maintenance_io_concurrency = 200
default_statistics_target = 100

# --------------------------------------------------------------- WAL / надёжность
# ТЗ §6: «synchronous_commit = off для данных краулера». Размен (§3.4): при
# потере сервера теряются коммиты последних ~3×wal_writer_delay ≈ 0,3 с;
# все записи идемпотентны (at-least-once), домен перепроверится планировщиком,
# потеря результата = лишняя проверка, а не потеря данных. Бэкапы не требуются
# (§6.3: данные восстановимы повторной проверкой). Взамен пакетные COMMIT
# (пачки COPY/unnest) не ждут fsync на каждую транзакцию. Миграции: версия
# и DDL идут одним коммитом — потерянный коммит откатывает и пометку, и схему,
# повтор накатит заново, рассинхрона нет.
synchronous_commit = off
# 100 мс вместо дефолтных 200: окно потери асинхронных коммитов ≤ ~0,3 с
# (3 интервала — задел на пропуск флаша), фоновых fsync 10/с — ничто для NVMe.
wal_writer_delay = 100ms
# Сжатие full-page images: режет объём записи на чекпойнтах ценой копейки CPU.
wal_compression = on
# Чекпойнты реже — меньше full-page writes, меньше износ NVMe (ТЗ §10.3) и
# фоновая пачка грязных страниц плавнее (completion 0.9). Свободного места
# много (§3.1): 8 ГБ WAL между чекпойнтами. Crash recovery реплеит ≤ 8 ГБ —
# минуты на NVMe, приемлемо для восстанавливаемых данных.
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 8GB
min_wal_size = 2GB

# --------------------------------------------------------------- autovacuum (ТЗ §6.3)
# Рабочая нагрузка: партиции domains/subdomain_results по 30–50 млн строк
# (§6), частые UPDATE check_state/last_checked_at (HOT при fillfactor 85 —
# миграции 000001/000003), первичный ingest 350 млн строк через COPY и
# переводы done→pending суточной перепроверки. Значения — на уровне конфига:
# per-table ALTER не используется (партиции плодятся миграцией 000003 по
# зонам/хэшу, настройки пришлось бы дублировать в каждой; конфиг покрывает
# все существующие и будущие партиции разом). Решение зафиксировано в docs/db.md.
autovacuum = on
# Тысячи листовых партиций: обход базы воркерами каждые 30 с (дефолт 60 с)
# — иначе дальние партиции ждут своей очереди циклами.
autovacuum_naptime = 30s
# 4 воркера (дефолт 3): партиций много, очередь работ не должна копиться;
# память воркеров ограничена autovacuum_work_mem.
autovacuum_max_workers = 4
# Триггер вакуума: 0.02 × (30–50 млн) = 0,6–1 млн мёртвых строк на партицию
# (дефолт 0.2 = 6–10 млн — горы мусора и затяжные вакуумы). Bloat зажат
# ~2 %, каждый вакуум короткий — очередь из 4 воркеров успевает. С fillfactor 85
# (запас 15 % страницы под HOT-версии) страницы возвращаются в оборот быстро.
autovacuum_vacuum_scale_factor = 0.02
# Вставочный триггер (PG13+): первичный ingest через COPY мёртвых строк не
# создаёт, но без вакуума не выставляется visibility map — деградируют
# index-only scan'ы частичного индекса domains (check_state = 0) и не
# происходит заморозка. 0.02 = вакуум/анализ на каждые ~2 % прироста.
autovacuum_vacuum_insert_scale_factor = 0.02
# Статистика: распределение check_state постоянно течёт (pending→queued→done),
# а от него зависит выбор планов частичного индекса планировщика (§5.3).
# ANALYZE дёшев (выборка ~30 тыс. строк), 0.01 держит статистику свежей
# в потоке массовых переводов.
autovacuum_analyze_scale_factor = 0.01
# Дефолтные 200 кредитов душат вакуум на тысячи партиций (лимит делится на
# воркеров, тик 2 мс) — вакуумы не успевают за темпом обновлений и копится
# bloat. 2000: 500 кредитов/воркера за тик ≈ 125 тыс. страниц/с на воркер —
# NVMe переваривает без напряга, CPU-стоимость околонулевая.
autovacuum_vacuum_cost_limit = 2000

# --------------------------------------------------------------- мониторинг (ТЗ §5.9)
# pg_stat_statements — мониторинг запросов сервисом monitor; track_io_timing
# — ввод-вывод для оценки эффективности NVMe-тюнинга; track_functions=pl —
# статистика по SQL-функции domain_info (T-082).
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
track_functions = pl

# --------------------------------------------------------------- логи
log_min_messages = warning
# Лог медленных запросов (T-177): каждый оператор дольше 3 с пишется в
# журнал сервера строкой «duration: … ms» с полным текстом и параметрами.
# Боевые запросы конвейера — точечные по индексам (миллисекунды): 3 с —
# патология (потерянный индекс, блокировка, деградация плана), не шум.
# Длительность PostgreSQL измеряет всегда — расходы только на запись
# превысивших порог (единицы в сутки на этой нагрузке), рестарт не
# нужен (reload). Дублёр порога — цикл monitor (Telegram-извещение,
# internal/monitor/slowqueries.go: pg_stat_activity,
# monitor.slow_query_min_duration): журнал — полный посмертный след,
# Telegram — оперативный сигнал; одна граница «патология» в обоих.
log_min_duration_statement = 3000
# Ожидания блокировок дольше deadlock_timeout (T-192): каждая сессия,
# ждущая лок дольше 1 с, пишет в журнал строку
# «process N still waiting for ShareLock on transaction X …» — по ней
# следующий конвой называет держателя по имени (pid, транзакция).
# Инцидент 25.10: держатель строчных локов domains ~37 мин не восстановим
# задним числом — журнал молчал (off). Цена — несколько строк только
# в минуты реального конкурентного ожидания; reload-параметр.
log_lock_waits = on
log_timezone = 'UTC'
timezone = 'UTC'
