# PostgreSQL 16 — production configuration (T-086).
#
# Goal: PostgreSQL from OS packages (spec §10.1 — a systemd host, not a
# container) on an 8 GB RAM / NVMe server (spec §3.1). The resource cap — a
# systemd unit with MemoryMax 3 GB (T-085, deploy/systemd/) — a guard above
# the §3.2 budget of "shared_buffers ≈ 2 GB + backends" ≈ 2.5 GB (maintenance
# peaks — docs/db.md, the "Memory" section). Hookup: config_file= to the
# packaged PG cluster (or an include from
# /etc/postgresql/<version>/<cluster>/postgresql.conf).
#
# The Docker dev stack uses a separate deploy/docker/postgres/postgresql.dev.conf
# (memory/connection volumes — dev scale, the planner/WAL/autovacuum semantics
# are the same); compose.yaml was not changed. The file format and the key values
# of spec §6.3 are guarded by the postgresql_conf_test.go unit test (make test).
# Rationale for every parameter and the trade-offs — docs/db.md, the "Tuning
# production PostgreSQL" section.

# --------------------------------------------------------------- connections
# All services are on the same server (spec §3.1): PostgreSQL listens only
# on localhost (+ a unix socket), is not exposed outward (spec §9).
listen_addresses = 'localhost'
# Spec §6.3: the pgx pools of all services combined are ≤ 20–50 connections.
# 8 services × 5 (7 pipeline + web) + dashboard (2 — its unit sets it; the
# global crawler.env variable would override it, a safe global maximum — 4)
# + crawlerctl (pool_size 2) + admin ≈ 44–46; 3 of 50 are reserved by
# superuser_reserved_connections. Raising it further is not allowed —
# every backend eats the §3.2 memory budget (see docs/db.md, connection budget).
max_connections = 50

# --------------------------------------------------------------- memory (spec §3.2)
# ≈ 25% of RAM — as the "shared_buffers ≈ 2 GB" budget prescribes on an
# 8-GB server; the rest is cached by the OS (effective_cache_size below hints at it).
shared_buffers = 2GB
# Memory of a single plan node (sort/hash) of a single query. Heavy queries —
# several workers at once (pools are lazy, production queries are point reads
# by indexes): worst case ~30 active nodes × 16 MB ≈ 0.5 GB — the §3.2 backend
# budget. Bulk work goes in COPY/unnest chunks and does not eat work_mem.
work_mem = 16MB
# CREATE INDEX / migrations on partitions of 30–50 M rows (§6): one-off
# administration operations; 256 MB speeds up index builds noticeably, the
# memory is short-lived.
maintenance_work_mem = 256MB
# A separate cap for autovacuum workers (the default −1 = maintenance_work_mem):
# 4 workers × 128 MB do not compete with migrations for maintenance_work_mem and
# fit into the budget alongside it (both at full volume never happen at the same
# time). A 128 MB TID array ≈ 20 M dead rows — with a vacuum trigger of 0.02 the
# real array is an order of magnitude smaller; on overflow vacuum degrades
# honestly to a page-by-page pass, memory does not grow.
autovacuum_work_mem = 128MB
# A planner hint: 2 GB shared_buffers + the expected OS page cache
# (the rest of the §3.2 budget). No memory is allocated; it only affects the
# choice of index plans.
effective_cache_size = 4GB

# --------------------------------------------------------------- planner / NVMe (spec §6.3)
# Random reads from NVMe are almost no more expensive than sequential ones: the
# default 4.0 unjustifiably penalizes index scans, while the load is point reads
# by PK/indexes and bitmap scans over partitions.
random_page_cost = 1.1
# Spec: ≥ 200. The NVMe queue depth digests the prefetching bitmap heap scan
# reads over the domains/subdomain_results partitions without waiting.
effective_io_concurrency = 200
# The same for maintenance: VACUUM prefetch and index builds on partitions of
# 30–50 M rows — vacuum does not become the bottleneck on thousands of partitions.
maintenance_io_concurrency = 200
default_statistics_target = 100

# --------------------------------------------------------------- WAL / reliability
# Spec §6: "synchronous_commit = off for crawler data". The trade-off (§3.4):
# on server loss the commits of the last ~3×wal_writer_delay ≈ 0.3 s are lost;
# all writes are idempotent (at-least-once), the scheduler rechecks the domain,
# a lost result = an extra check, not data loss. Backups are not required
# (§6.3: the data is recoverable by rechecking). In exchange the batched COMMITs
# (COPY/unnest chunks) do not wait for fsync on every transaction. Migrations:
# the version and DDL go in one commit — a lost commit rolls back both the mark
# and the schema; a re-apply starts anew, no desync.
synchronous_commit = off
# 100 ms instead of the default 200: the async commit loss window is ≤ ~0.3 s
# (3 intervals — headroom for a skipped flush), 10 background fsyncs/s — nothing for NVMe.
wal_writer_delay = 100ms
# Full-page image compression: cuts the write volume at checkpoints for a tiny CPU cost.
wal_compression = on
# Rarer checkpoints — fewer full-page writes, less NVMe wear (spec §10.3) and a
# smoother background flush of dirty pages (completion 0.9). Free space is
# plentiful (§3.1): 8 GB of WAL between checkpoints. Crash recovery replays
# ≤ 8 GB — minutes on NVMe, acceptable for recoverable data.
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 8GB
min_wal_size = 2GB

# --------------------------------------------------------------- autovacuum (spec §6.3)
# The workload: domains/subdomain_results partitions of 30–50 M rows each
# (§6), frequent UPDATEs of check_state/last_checked_at (HOT at fillfactor 85 —
# migrations 000001/000003), the primary ingest of 350 M rows via COPY and
# the done→pending transitions of the daily recheck. The values live at the
# config level: no per-table ALTER is used (migration 000003 breeds partitions
# by zone/hash, the settings would have to be duplicated in each; the config
# covers all existing and future partitions at once). The decision is recorded
# in docs/db.md.
autovacuum = on
# Thousands of leaf partitions: the workers walk the database every 30 s
# (the default 60 s) — otherwise the far partitions wait their turn for rounds.
autovacuum_naptime = 30s
# 4 workers (the default 3): there are many partitions, the work queue must not
# pile up; worker memory is capped by autovacuum_work_mem.
autovacuum_max_workers = 4
# The vacuum trigger: 0.02 × (30–50 M) = 0.6–1 M dead rows per partition
# (the default 0.2 = 6–10 M — mountains of junk and drawn-out vacuums). Bloat
# is held at ~2%, each vacuum is short — the queue of 4 workers keeps up. With
# fillfactor 85 (15% of the page reserved for HOT versions) pages return to
# circulation quickly.
autovacuum_vacuum_scale_factor = 0.02
# The insert trigger (PG13+): the primary ingest via COPY creates no dead rows,
# but without a vacuum the visibility map is not set — the index-only scans of
# the partial domains index (check_state = 0) degrade and freezing does not
# happen. 0.02 = vacuum/analyze for every ~2% of growth.
autovacuum_vacuum_insert_scale_factor = 0.02
# Statistics: the check_state distribution drifts constantly (pending→queued→done),
# and the planner's choice of partial-index plans depends on it (§5.3).
# ANALYZE is cheap (a sample of ~30 k rows); 0.01 keeps the statistics fresh
# amid the stream of mass transitions.
autovacuum_analyze_scale_factor = 0.01
# The default 200 credits suffocate vacuum on thousands of partitions (the limit
# is split among workers, a 2 ms tick) — vacuums fall behind the update pace and
# bloat piles up. 2000: 500 credits/worker per tick ≈ 125 k pages/s per worker —
# NVMe digests it without strain, the CPU cost is near zero.
autovacuum_vacuum_cost_limit = 2000

# --------------------------------------------------------------- monitoring (spec §5.9)
# pg_stat_statements — query monitoring by the monitor service; track_io_timing
# — I/O to assess the effectiveness of NVMe tuning; track_functions=pl —
# statistics for the domain_info SQL function (T-082).
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
track_functions = pl

# --------------------------------------------------------------- logs
log_min_messages = warning
# The slow-query log (T-177): every statement longer than 3 s is written to the
# server log with a "duration: … ms" line carrying the full text and parameters.
# Production pipeline queries are point reads by indexes (milliseconds): 3 s is
# a pathology (a lost index, a lock, plan degradation), not noise. PostgreSQL
# always measures the duration — the cost is only logging the ones above the
# threshold (a few per day on this load); no restart is needed (reload). The
# threshold's twin is the monitor loop (a Telegram notification,
# internal/monitor/slowqueries.go: pg_stat_activity,
# monitor.slow_query_min_duration): the log is the full post-mortem trail,
# Telegram is the prompt signal; one "pathology" boundary in both.
log_min_duration_statement = 3000
# Lock waits longer than deadlock_timeout (T-192): every session waiting for a
# lock longer than 1 s writes a "process N still waiting for ShareLock on
# transaction X …" line to the log — the next convoy names the holder by name
# (pid, transaction) from it. Incident of Oct 25: the holder of domains row
# locks for ~37 min is not reconstructible after the fact — the log was silent
# (off). The cost — a few lines only during minutes of real concurrent waiting;
# a reload parameter.
log_lock_waits = on
log_timezone = 'UTC'
timezone = 'UTC'
