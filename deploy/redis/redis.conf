# Redis 7 — production configuration (T-087; spec 3.2, 3.4, 10.1).
#
# Production Redis — an OS package on the single server (spec 10.1), under a
# systemd unit (deploy/systemd/, T-085). Installation: /etc/redis/redis.conf.
# Redis's role — task transport only (Redis Streams, spec 4.2): the source of
# truth is PostgreSQL, Redis loss is not fatal (spec 3.4) — memory and
# persistence were chosen from this. Trade-offs and rationale: docs/redis.md.
# Dev configuration (docker): deploy/docker/redis/redis.dev.conf.

# --- Network (a single server, spec 10.1) -----------------------------------------

# Listen on loopback only: all Go services live on the same server and use
# redis.addr 127.0.0.1:6379 (docs/configuration.md, the redis section). No
# password in the service configuration, Redis is not exposed outward; the
# only external IP is saved for crawling (spec 3.1). "-::1" — an optional
# IPv6 loopback: the config does not break on a host without IPv6.
bind 127.0.0.1 -::1
protected-mode yes
port 6379

# The listening queue cap 511 — the standard: connections are few (7 of the 9
# services talk to Redis — scheduler, four workers, monitor, dashboard;
# ingest and web — PostgreSQL only; go-redis pools are lazy, workers hold one
# XREADGROUP-blocking
# connection each), there are no connection bursts. Consistent with the host's
# net.core.somaxconn (stage 9, T-088).
tcp-backlog 511
# timeout 0: worker connections are long-lived — XREADGROUP BLOCK 2 s
# (internal/queue); an "idle" connection is busy with a blocking read,
# tearing it down is pointless. Dead clients are caught by keepalive.
timeout 0
tcp-keepalive 300

# --- Memory (spec 3.2: Redis ≤ 0.5 GB) ---------------------------------------

# The spec 3.2 budget — exactly 0.5 GB for data. Real occupancy in a healthy
# system is several times lower: the backpressure gate (T-026) stops publishing
# at half the stream MAXLEN (after the T-141 recount: q:dns 125 chunks
# ≈ 8 MiB, the per-item 75,000 entries ≈ 52 MiB), and the confirmed prefix is
# released by the scheduler XTRIM MINID loop (T-141, redis.trim_interval);
# the sum of the emergency MAXLEN caps ≈ 327 MiB < 512 MiB (docs/redis.md §3.1).
# The systemd unit (T-085) needs a MemoryMax with headroom over maxmemory:
# maxmemory counts data only, on top of it — client buffers and the process's
# service memory (the recommendation — docs/redis.md §7).
maxmemory 512mb

# noeviction — a deliberate choice, not an "as is" default (spec 3.4, 3.2):
#
#  1) the keyspace holds only the q:* streams and their consumer groups — no
#     keys with TTL, volatile-ttl degenerates into the same noeviction while
#     creating a false sense of protection; allkeys-lru silently deletes keys
#     whole: the stream vanishes together with all contents, groups and PEL
#     (verified on redis:7.4: 30,000 XADDs at maxmemory 2mb — all accepted
#     without errors, but the key was deleted whole: the first ~17,000 entries
#     and the group created before the stream vanished, the next XADDs
#     recreated the stream without the group), tasks are lost without a trace
#     in the logs;
#  2) at noeviction memory exhaustion is a loud write rejection (OOM command
#     not allowed): workers and the scheduler log and continue (spec 3.4 —
#     a component failure does not block the others), publishing is stopped by
#     the gate long before the cap, streams are bounded by MAXLEN ~ (T-025);
#  3) truncation or loss of any entries is restored from PostgreSQL:
#     the lease pass returns domains to pending, the dispatcher re-publishes
#     tasks (T-029/T-027/T-028) — a loud rejection is preferable to silent corruption.
maxmemory-policy noeviction

# --- Persistence: disabled (spec 3.4) ------------------------------------

# The source of truth is PostgreSQL: Redis loss is a normal, tested scenario
# (T-032, TestResilience_RedisLossSchedulerRecovery): the lease refund
# (T-029) returns domains stuck in queued to pending, the dispatcher (T-027)
# re-selects and re-publishes (T-028), workers recreate groups after NOGROUP
# (internal/queue). RDB/AOF would not speed up recovery, while costing an fsync
# per XADD (NVMe wear — spec 10.3) and disk space for data that does not exist.
save ""
appendonly no

# --- Misc ------------------------------------------------------------------

# 16 DBs, as in dev: the services work in db 0, the dedicated db 15 — the
# contract of the resilience integration tests (docs/dev-environment.md, §7).
databases 16

# io-threads 1 (disabled): the load is hundreds of commands/s (XADD/XREADGROUP/
# XACK; the pace is set by the DNS/HTTP stages, not Redis), which a
# single-threaded core handles; the I/O threads' benefit starts at tens of
# thousands of ops/s or large bodies. Enable it — only per the spec 11.3 measurements.
io-threads 1

# systemd (T-085): a foreground process (supervised auto — systemd/upstart
# detection, outside them — unsupervised), logs to stdout → journald.
supervised auto
daemonize no
loglevel notice
logfile ""

# The data-files directory is unused (no persistence), but manual
# SAVE/BGSAVE/CONFIG REWRITE during diagnostics need it; the OS package creates
# it with the redis owner.
dir /var/lib/redis
