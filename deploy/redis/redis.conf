# Redis 7 — боевая конфигурация (T-087; ТЗ 3.2, 3.4, 10.1).
#
# Боевой Redis — пакет ОС на едином сервере (ТЗ 10.1), под systemd-юнитом
# (deploy/systemd/, T-085). Установка: /etc/redis/redis.conf.
# Роль Redis — только транспорт задач (Redis Streams, ТЗ 4.2): источник
# истины — PostgreSQL, потеря Redis не фатальна (ТЗ 3.4) — из этого выбраны
# память и персистентность. Размены и обоснования: docs/redis.md.
# Dev-конфигурация (docker): deploy/docker/redis/redis.dev.conf.

# --- Сеть (единый сервер, ТЗ 10.1) -----------------------------------------

# Слушаем только loopback: все Go-сервисы — на этом же сервере и ходят на
# redis.addr 127.0.0.1:6379 (docs/configuration.md, раздел redis). Пароля в
# конфигурации сервисов нет, наружу Redis не торчит; единственный внешний
# IP бережём для краулинга (ТЗ 3.1). «-::1» — необязательный IPv6-loopback:
# хост без IPv6 конфиг не ломает.
bind 127.0.0.1 -::1
protected-mode yes
port 6379

# Потолок слушающей очереди 511 — стандарт: соединений немного (в Redis
# ходят 7 из 9 сервисов — scheduler, четыре воркера, monitor, dashboard;
# ingest и web — только PostgreSQL; пулы go-redis ленивые, воркеры держат
# по одному блокирующемуся в XREADGROUP
# соединению), всплесков подключений нет. Согласуется с net.core.somaxconn
# хоста (этап 9, T-088).
tcp-backlog 511
# timeout 0: соединения воркеров долгоживущие — XREADGROUP BLOCK 2 с
# (internal/queue); «простаивающее» соединение занято блокированным чтением,
# разрывать его бессмысленно. Мёртвых клиентов выявляет keepalive.
timeout 0
tcp-keepalive 300

# --- Память (ТЗ 3.2: Redis ≤ 0,5 ГБ) ---------------------------------------

# Бюджет ТЗ 3.2 — ровно 0,5 ГБ на данные. Реальная занятость в здоровой
# системе кратно ниже: гейт backpressure (T-026) останавливает публикацию
# на queue_high_watermark = 100 000 записей (≈ 15–20 МБ на штучный стрим),
# 512 МБ — аварийный потолок. systemd-юниту (T-085) нужен MemoryMax с
# запасом над maxmemory: maxmemory считает только данные, поверх — буферы
# клиентов и служебная память процесса (рекомендация — docs/redis.md §7).
maxmemory 512mb

# noeviction — осознанный выбор, а не дефолт «как есть» (ТЗ 3.4, 3.2):
#
#  1) в keyspace только стримы q:* и их consumer groups — ключей с TTL нет,
#     volatile-ttl вырождается в тот же noeviction, создавая ложное чувство
#     защиты; allkeys-lru молча удаляет ключи целиком: стрим исчезает вместе
#     со всем содержимым, группами и PEL (проверено на redis:7.4: 30 000 XADD
#     при maxmemory 2mb — все приняты без ошибок, но ключ удалялся целиком:
#     первые ~17 000 записей и созданная до потока группа исчезли, следующие
#     XADD пересоздали стрим без группы), задачи теряются без следа в логах;
#  2) при noeviction исчерпание памяти — видимый отказ записи (OOM command
#     not allowed): воркеры и планировщик логируют и продолжают (ТЗ 3.4 —
#     падение компонента не блокирует остальных), публикация останавливается
#     гейтом задолго до потолка, стримы ограничены MAXLEN ~ (T-025);
#  3) усечение или потеря любых записей восстанавливается из PostgreSQL:
#     lease-проход возвращает домены в pending, диспетчер переиздаёт задачи
#     (T-029/T-027/T-028) — громкий отказ предпочтительнее тихой порчи.
maxmemory-policy noeviction

# --- Персистентность: отключена (ТЗ 3.4) ------------------------------------

# Источник истины — PostgreSQL: потеря Redis — штатный, оттестированный
# сценарий (T-032, TestResilience_RedisLossSchedulerRecovery): lease-возврат
# (T-029) возвращает зависшие в queued домены в pending, диспетчер (T-027)
# перевыбирает и переиздаёт (T-028), воркеры пересоздают группы после NOGROUP
# (internal/queue). RDB/AOF не ускоряли бы восстановление, а стоили бы fsync
# на каждое XADD (износ NVMe — ТЗ 10.3) и диск под данные, которых нет.
save ""
appendonly no

# --- Прочее ------------------------------------------------------------------

# 16 БД, как в dev: сервисы работают в db 0, выделенная БД 15 — контракт
# интеграционных тестов устойчивости (docs/dev-environment.md, §7).
databases 16

# io-threads 1 (выключено): нагрузка — сотни команд/с (XADD/XREADGROUP/
# XACK; темп задают DNS/HTTP-этапы, а не Redis), для которых хватает
# однопоточного ядра; выгода потоков I/O начинается с десятков тысяч
# операций/с или крупных тел. Включать — только по замерам ТЗ 11.3.
io-threads 1

# systemd (T-085): процесс на переднем плане (supervised auto — детект
# systemd/upstart, вне их — без надзора), логи в stdout → journald.
supervised auto
daemonize no
loglevel notice
logfile ""

# Каталог файлов данных не используется (персистентности нет), но нужен
# ручным SAVE/BGSAVE/CONFIG REWRITE при диагностике; пакет ОС создаёт его
# с владельцем redis.
dir /var/lib/redis
