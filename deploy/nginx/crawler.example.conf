# Образец публичной точки входа Domain Crawler (T-124): nginx терминирует
# TLS и проксирует лендинг (cmd/web) на web.listen — loopback, дефолт
# 127.0.0.1:8080. До этого этапа публичного входа в репозитории не было —
# файл фиксирует первый образец; подставьте свой server_name и пути
# сертификатов (например, Let's Encrypt: certbot --nginx). Метрики и пробы
# (127.0.0.1:9107) наружу не публикуются (ТЗ §9) — только location /.
#
# Установка: cp crawler.example.conf /etc/nginx/sites-available/crawler.conf
# && ln -s /etc/nginx/sites-available/crawler.conf /etc/nginx/sites-enabled/
# && nginx -t && systemctl reload nginx.

# HTTP → HTTPS (плюс ACME-проверки certbot).
server {
    listen 80;
    listen [::]:80;
    server_name crawler.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 параметром listen: работает от nginx 1.18 (пакет Ubuntu LTS
    # 22.04/24.04) до актуальных; отдельная директива `http2 on;` есть
    # только с 1.25.1 и валидируется на LTS-пакете с ошибкой.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crawler.example.com;

    ssl_certificate     /etc/letsencrypt/live/crawler.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crawler.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Заголовки безопасности публичной страницы (§9): HSTS с момента,
    # как сертификат и домен устоялись; nosniff — всем.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Лендинг за прокси видит http: схему и хост для sitemap.xml и
    # редиректов передаём явно (см. internal/web handleSitemap).
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;

    # Живая проверка формы идёт до web.timeout (дефолт 60 с) — окно
    # ответа прокси с запасом; при увеличении web.timeout в конфиге
    # поднимите и его.
    proxy_read_timeout 75s;

    # Рейт-лимит формы держит сам сервис (web.rate_limit, токен-бакет
    # на IP, T-123): X-Real-IP обязателен — сервису адрес посетителя
    # нужен для бакета и журнала web_checks (доверяет заголовку от
    # loopback-пира, nginx его перезаписывает $remote_addr); лимиты
    # nginx не дублируют (одна точка учёта).
    location / {
        proxy_pass http://127.0.0.1:8080;
        # Вариант unix-сокета (по месту деплоя): CRAWLER_WEB_LISTEN=
        # /run/crawler-web/web.sock в /etc/crawler/crawler.env и
        #   proxy_pass http://unix:/run/crawler-web/web.sock;
    }
}
