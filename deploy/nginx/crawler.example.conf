# A sample public entry point of Domain Crawler (T-124; reworked in L-08):
# nginx terminates TLS and proxies the public API of cmd/web
# (/api/check-domain, /api/v1/landing/stats, /healthz) to web.listen —
# loopback, the default 127.0.0.1:8080. The landing pages are static now
# (the separate ld-landing repo, sites.* on their own servers) and are NOT
# served here: everything outside /api/ and /healthz is a 404 on this
# vhost. The operator dashboard is published by the same scheme in a
# separate server block (docs/deploy.md §6, dashboard spec §9.1).
# Substitute your own server_name and certificate paths (for example,
# Let's Encrypt: certbot --nginx). Metrics and probes (127.0.0.1:9107)
# are not published outward (spec §9).
#
# Install: cp crawler.example.conf /etc/nginx/sites-available/crawler.conf
# && ln -s /etc/nginx/sites-available/crawler.conf /etc/nginx/sites-enabled/
# && nginx -t && systemctl reload nginx.

# HTTP → HTTPS (plus the certbot ACME checks).
server {
    listen 80;
    listen [::]:80;
    server_name crawler.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 as a listen parameter: works from nginx 1.18 (the Ubuntu LTS
    # 22.04/24.04 package) through current; the separate `http2 on;` directive
    # exists only since 1.25.1 and fails validation on the LTS package.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crawler.example.com;

    ssl_certificate     /etc/letsencrypt/live/crawler.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crawler.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Security headers of the public surface (§9): HSTS from the moment the
    # certificate and domain have settled; nosniff for everyone.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The API surface sees the visitor's address: the form rate limit and
    # the web_checks log need it (the service trusts the headers from a
    # loopback peer and a unix-socket peer only; nginx rewrites X-Real-IP
    # with $remote_addr, the fallback X-Forwarded-For takes the last
    # position — the start of the list came from the client).
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;

    # The live form check runs up to web.timeout (the default 60 s) — the
    # proxy response window with headroom; if you raise web.timeout in the
    # config, raise this too.
    proxy_read_timeout 75s;

    # Only the API goes to the service (the sample of the production
    # api9 vhost): /api/* and the exact /healthz; everything else — a
    # plain 404 (no landing, no statics on this host).
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
    }
    location / {
        return 404;
    }
}
