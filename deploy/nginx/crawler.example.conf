# A sample public entry point of Domain Crawler (T-124): nginx terminates
# TLS and proxies the landing (cmd/web) to web.listen — loopback, the default
# 127.0.0.1:8080. Before this stage the repository had no public entry —
# the file records the first sample; substitute your own server_name and
# certificate paths (for example, Let's Encrypt: certbot --nginx). Metrics and
# probes (127.0.0.1:9107) are not published outward (spec §9) — only location /.
#
# Install: cp crawler.example.conf /etc/nginx/sites-available/crawler.conf
# && ln -s /etc/nginx/sites-available/crawler.conf /etc/nginx/sites-enabled/
# && nginx -t && systemctl reload nginx.

# HTTP → HTTPS (plus the certbot ACME checks).
server {
    listen 80;
    listen [::]:80;
    server_name crawler.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 as a listen parameter: works from nginx 1.18 (the Ubuntu LTS
    # 22.04/24.04 package) through current; the separate `http2 on;` directive
    # exists only since 1.25.1 and fails validation on the LTS package.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crawler.example.com;

    ssl_certificate     /etc/letsencrypt/live/crawler.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crawler.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Security headers of the public page (§9): HSTS from the moment the
    # certificate and domain have settled; nosniff for everyone.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The landing behind the proxy sees http: the scheme for sitemap.xml is
    # passed explicitly (see internal/web handleSitemap: X-Forwarded-Proto is
    # read only from a loopback/unix peer; the <loc> host — the canonical
    # web.public_host, the request Host — the fallback).
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;

    # The live form check runs up to web.timeout (the default 60 s) — the
    # proxy response window with headroom; if you raise web.timeout in the
    # config, raise this too.
    proxy_read_timeout 75s;

    # The form rate limit is kept by the service itself (web.rate_limit, a
    # token bucket per IP, T-123): X-Real-IP is mandatory — the service needs
    # the visitor's address for the bucket and the web_checks log (it trusts
    # the header from a loopback peer and a unix-socket peer, nginx rewrites
    # it with $remote_addr; the fallback X-Forwarded-For takes the last
    # position — the start of the list came from the client); nginx limits do
    # not duplicate it (a single accounting point).
    location / {
        proxy_pass http://127.0.0.1:8080;
        # The unix-socket variant (depending on the deploy site): CRAWLER_WEB_LISTEN=
        # /run/crawler-web/web.sock in /etc/crawler/crawler.env and
        #   proxy_pass http://unix:/run/crawler-web/web.sock;
    }
}
