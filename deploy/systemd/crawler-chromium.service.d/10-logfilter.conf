# T-135 ops: консоли рендеримых страниц (headless-shell INFO:CONSOLE …) —
# ~50 тыс. строк/10 мин, весь вывод юнита приходит в journald с PRIORITY=6.
# Диагностику рендера ведёт render-worker; сообщения systemd о юните
# (старты/краши/OOM) фильтр не затрагивают. Для отладки Chromium — убрать
# drop-in и перезапустить юнит.
[Service]
LogLevelMax=notice
