# T-135 ops: consoles of rendered pages (headless-shell INFO:CONSOLE …) —
# ~50k lines/10 min, the entire unit output reaches journald with
# PRIORITY=6. Render diagnostics are handled by render-worker; the filter
# does not touch systemd messages about the unit (starts/crashes/OOM). To
# debug Chromium — remove the drop-in and restart the unit.
[Service]
LogLevelMax=notice
