# Drop-in for the unbound.service package unit. Installation: cp -r
# deploy/systemd/unbound.service.d /etc/systemd/system/ &&
# systemctl daemon-reload (docs/deploy.md).
#
# Spec 3.2: Unbound (cache) ≈ 0.7 GB — a budget line; the cap was raised
# 700M → 800M per the §12 measurement (T-160): on ≈47M names the cache grew
# from 452 MiB (§6) to 733.9/734.0 MiB and pressed against the old limit —
# 1.19M reclaim events; +100M from the MemAvailable headroom of 2.6 GiB
# (the criterion: MemoryCurrent < MemoryMax with ≥ 50 MiB of headroom,
# oom=0). The recursion config —
# deploy/docker/unbound/unbound.internet.conf (the msg+rrset+neg caches
# ≈ 532 MB in use — the same file for the native installation, the
# interface edit → 127.0.0.1; see docs/deploy.md).
# LimitNOFILE raised: the recursor's outgoing sockets at dns.concurrency
# 2000 (parity with the service units).

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
MemoryMax=800M
LimitNOFILE=65535
Restart=on-failure
RestartSec=5s
