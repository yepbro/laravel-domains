# Drop-in к юниту пакета unbound.service. Установка: cp -r
# deploy/systemd/unbound.service.d /etc/systemd/system/ &&
# systemctl daemon-reload (docs/deploy.md).
#
# ТЗ 3.2: Unbound (кэш) ≈ 0,7 ГБ — строка бюджета; потолок поднят
# 700M → 800M по замеру §12 (T-160): на ≈47 млн имён кэш дорос с 452
# MiB (§6) до 733.9/734.0 MiB и держал старый лимит — 1.19 млн
# reclaim-событий; +100M из запаса MemAvailable 2.6 GiB (критерий:
# MemoryCurrent < MemoryMax с запасом ≥ 50 MiB, oom=0). Конфиг
# рекурсии — deploy/docker/unbound/unbound.internet.conf (кэши
# msg+rrset+neg ≈ 532 МБ при деле — тот же файл для нативной
# установки, правки interface → 127.0.0.1; см. docs/deploy.md).
# LimitNOFILE поднят: исходящие сокеты рекурсора при
# dns.concurrency 2000 (паритет с юнитами сервисов).

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
MemoryMax=800M
LimitNOFILE=65535
Restart=on-failure
RestartSec=5s
