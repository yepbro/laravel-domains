# Drop-in к юниту пакета unbound.service. Установка: cp -r
# deploy/systemd/unbound.service.d /etc/systemd/system/ &&
# systemctl daemon-reload (docs/deploy.md).
#
# ТЗ 3.2: Unbound (кэш) ≈ 0,7 ГБ — потолок cgroup. Конфиг рекурсии —
# deploy/docker/unbound/unbound.internet.conf (кэши msg+rrset+neg ≈ 532 МБ
# при деле — тот же файл для нативной установки, правки interface →
# 127.0.0.1; см. docs/deploy.md). LimitNOFILE поднят: исходящие сокеты
# рекурсора при dns.concurrency 2000 (паритет с юнитами сервисов).

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
MemoryMax=700M
LimitNOFILE=65535
Restart=on-failure
RestartSec=5s
