# Drop-in к юнитам пакета postgresql-common (шаблон postgresql@.service —
# применяется ко всем кластерам, например postgresql@17-main).
# Установка: cp -r deploy/systemd/postgresql@.service.d /etc/systemd/system/
# + systemctl daemon-reload (docs/deploy.md).
#
# ТЗ 3.2: PostgreSQL (shared_buffers ≈ 2 ГБ + бэкенды) ≈ 2,5 ГБ — плановый
# бюджет. Тюнинг самого сервера (shared_buffers, autovacuum, io_concurrency)
# — T-086 (docs/db.md): MemoryMax обязан быть выше его аллокаций, чтобы
# OOM-killer не приходил в бэкенды под нагрузкой записи (ТЗ 11.4 п. 7).
#
# 3G — потолок-страховка над плановым бюджетом, как у Redis (maxmemory
# 512mb под потолком 640M, docs/redis.md §7): в окно обслуживания поверх
# shared_buffers 2 ГБ легитимно складываются пиковые work_mem (~0,5 ГБ),
# maintenance_work_mem (256 МБ, CREATE INDEX/миграции) и autovacuum-воркеры
# (4 × 128 МБ) — до ~3 ГБ; потолок, равный бюджету, убивал бы бэкенд
# cgroup-OOM вместо защищаемого режима. Потолок — не резервация: штатно
# инстанс живёт в ≈ 2,5 ГБ (docs/db.md, «Память»).

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
MemoryMax=3G
# Пакетный юнит Ubuntu уже Restart=on-failure; дублируем явно — поведение
# не зависит от версии пакета (ТЗ 10.1).
Restart=on-failure
RestartSec=5s
