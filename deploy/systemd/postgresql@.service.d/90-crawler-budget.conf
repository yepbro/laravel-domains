# Drop-in к юнитам пакета postgresql-common (шаблон postgresql@.service —
# применяется ко всем кластерам, например postgresql@17-main).
# Установка: cp -r deploy/systemd/postgresql@.service.d /etc/systemd/system/
# + systemctl daemon-reload (docs/deploy.md).
#
# ТЗ 3.2: PostgreSQL (shared_buffers ≈ 2 ГБ + бэкенды) ≈ 2,5 ГБ — потолок
# cgroup. Тюнинг самого сервера (shared_buffers, autovacuum, io_concurrency)
# — T-086 (docs/db.md): MemoryMax обязан быть выше его аллокаций, чтобы
# OOM-killer не приходил в бэкенды под нагрузкой записи (ТЗ 11.4 п. 7).

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
MemoryMax=2560M
# Пакетный юнит Ubuntu уже Restart=on-failure; дублируем явно — поведение
# не зависит от версии пакета (ТЗ 10.1).
Restart=on-failure
RestartSec=5s
