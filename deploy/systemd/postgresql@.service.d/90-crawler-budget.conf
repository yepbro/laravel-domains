# Drop-in for the postgresql-common package units (the postgresql@.service
# template — applies to all clusters, e.g. postgresql@17-main).
# Installation: cp -r deploy/systemd/postgresql@.service.d /etc/systemd/system/
# + systemctl daemon-reload (docs/deploy.md).
#
# Spec 3.2: PostgreSQL (shared_buffers ≈ 2 GB + backends) ≈ 2.5 GB — the
# planned budget. Tuning of the server itself (shared_buffers, autovacuum,
# io_concurrency) — T-086 (docs/db.md): MemoryMax must be above its
# allocations so that the OOM killer does not reach the backends under
# write load (spec 11.4 item 7).
#
# 3G — a guard cap above the planned budget, like Redis (maxmemory 512mb
# under the 640M cap, docs/redis.md §7): in a maintenance window, on top of
# the 2 GB shared_buffers, peak work_mem (~0.5 GB), maintenance_work_mem
# (256 MB, CREATE INDEX/migrations) and autovacuum workers (4 × 128 MB)
# legitimately add up to ~3 GB; a cap equal to the budget would kill a
# backend with a cgroup OOM instead of protecting the intended mode. The
# cap is not a reservation: in steady operation the instance lives within
# ≈ 2.5 GB (docs/db.md, "Memory").

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
MemoryMax=3G
# The Ubuntu package unit is already Restart=on-failure; we duplicate it
# explicitly so that the behavior does not depend on the package version
# (spec 10.1).
Restart=on-failure
RestartSec=5s
