# Drop-in к юниту пакета redis-server.service (Ubuntu: redis-server,
# алиас redis). Установка: cp -r deploy/systemd/redis-server.service.d
# /etc/systemd/system/ && systemctl daemon-reload (docs/deploy.md).
#
# ТЗ 3.2: Redis ≤ 0,5 ГБ — потолок cgroup. Внутренний maxmemory и политика
# eviction — T-087 (конфиг redis): MemoryMax — страховочный потолок над
# maxmemory (процесс + буферы), а не замена ему — eviction должен
# срабатывать раньше OOM (ТЗ 3.4: потеря Redis восстанавливается
# планировщиком, но незапланированный рестарт — простой конвейера).

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
MemoryMax=512M
Restart=on-failure
RestartSec=5s
