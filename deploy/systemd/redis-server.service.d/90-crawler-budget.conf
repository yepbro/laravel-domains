# Drop-in for the redis-server.service package unit (Ubuntu: redis-server,
# the redis alias). Installation: cp -r deploy/systemd/redis-server.service.d
# /etc/systemd/system/ && systemctl daemon-reload (docs/deploy.md).
#
# Spec 3.2: Redis ≤ 0.5 GB — the cgroup cap. The internal maxmemory and the
# eviction policy — T-087 (the redis config): MemoryMax is a safety-net cap
# above maxmemory (process + buffers), not a replacement for it — eviction
# must trigger before the OOM (spec 3.4: losing Redis is recovered by the
# scheduler, but an unplanned restart is pipeline downtime).
# 640M = maxmemory 512mb + ~128 MB of service overhead (client buffers,
# allocator fragmentation, copy-on-write of background operations) —
# docs/redis.md §7: a cap equal to maxmemory inverts the failure order —
# a cgroup OOM kills the process before noeviction honestly refuses a
# write.

[Unit]
StartLimitIntervalSec=300
StartLimitBurst=10

[Service]
MemoryMax=640M
Restart=on-failure
RestartSec=5s
