# Redis 7 — dev-конфигурация (ТЗ 4.1).
# Источник истины — PostgreSQL, потеря Redis допустима (ТЗ 3.4 основного ТЗ),
# поэтому персистентность отключена. Очереди Streams — noeviction обязателен.
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Память: чуть ниже лимита контейнера, чтобы не словить OOM внутри Redis
maxmemory 224mb
maxmemory-policy noeviction

# Dev: персистентность не нужна
save ""
appendonly no

databases 16
loglevel notice
logfile ""
