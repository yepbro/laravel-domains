# Redis 7 — dev configuration (spec 4.1).
# The source of truth is PostgreSQL, Redis loss is acceptable (spec 3.4 of the
# main spec), so persistence is disabled. Streams queues — noeviction is required.
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory: slightly below the container limit, to avoid an OOM inside Redis
maxmemory 224mb
maxmemory-policy noeviction

# Dev: persistence is not needed
save ""
appendonly no

databases 16
loglevel notice
logfile ""
