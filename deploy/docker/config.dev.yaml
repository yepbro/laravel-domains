# Dev configuration of the Domain Crawler services (spec 5.10 of the main
# spec). Mounted into the containers as /etc/crawler/config.yaml.
# The address values match the static IPs of the crawler_net network in
# compose.yaml; as the services evolve, environment variable values take
# priority.

postgres:
  # The full DSN is assembled from APP_PG_DSN (env); here — the default form.
  dsn: "postgres://crawler:crawler@172.28.100.2:5432/crawler?sslmode=disable"
  # 20 — the dev scale: max_connections=130 (postgresql.dev.conf — the
  # service stack + parallel test runs). The production budget
  # (max_connections=50) — 5 per service: config.example.yaml, docs/db.md
  # "Connection budget".
  pool_size: 20

redis:
  addr: "172.28.100.3:6379"

ingest:
  dir: "/data/incoming"
  batch_size: 50000
  stable_seconds: 10
  scan_interval: "5s"               # dev: the guard walk runs more often
  # Multi-level testbed test zones (the tld-only-zones spec §5.1/§6.1):
  # the ingest working directories are TLD-only (incoming/<tld>/add|delete/),
  # the bench scenario zones (deploy/docker/testbed/scenarios.yaml —
  # served by coredns) must be "path zones", so they are listed in the
  # allowlist; otherwise make seed puts files into directories that ingest
  # will send to failed/. Names — lowercase punycode (as zones.name;
  # проверка.test → xn--80adjurfhd.test). Production — empty
  # (config.example.yaml).
  allowed_zone_paths:
    - crawl.test            # the base scenario zone (e2e ingest→check)
    - crawl2.test
    - co.test               # a composite test zone (a former co.uk analog)
    - xn--80adjurfhd.test   # проверка.test — the IDN scenario zone

scheduler:
  recheck_interval: "4380h"          # ~6 months
  batch_size: 1000                   # ≈64 KiB per q:dns entry — the Redis budget (T-141)
  queue_high_watermark: 100000
  lease: "30m"
  temp_error_retry_after: "24h"

dns:
  resolvers: ["172.28.100.10:53"]      # unbound
  fallback_resolvers: []             # in dev we do not go outward
  concurrency: 2000
  max_qps: 10000
  ipv6: false                        # no IPv6 in the docker network

http:
  concurrency: 2000
  per_ip_limit: 4
  connect_timeout: "5s"
  header_timeout: "10s"
  total_timeout: "20s"
  max_redirects: 8
  max_body_bytes: 2097152
  user_agent: "DomainCrawler/dev (+dev-environment; contact: dev@example.invalid)"

render:
  # dev: an external chromium container (the compose service chromium,
  # ws://172.28.100.14:9222)
  remote_url: "ws://172.28.100.14:9222"
  # Alternative render engines (stage 35, FR-16): the engine container is
  # brought up by the render-engines profile, here engine and one address
  # are changed (the commented specimens), then dc restart render-worker —
  # air does not reload the config. The restart threshold below is already
  # 0 — changing the engine specimen reduces to engine + remote_url (for
  # moli/lightpanda validation requires 0). Details: docs/render.md and
  # docs/dev-environment.md, "Render engines".
  #   lightpanda (dc --profile render-engines up -d lightpanda):
  # engine: "lightpanda"
  # remote_url: "ws://172.28.100.16:9222"
  #   moli (dc --profile render-engines up -d moli):
  # engine: "moli"
  # remote_url: "ws://172.28.100.17:9222"
  # Deliberately below the production default of 4 (T-142): dev-chromium is
  # shared by the render unit and live tests, a conservative parallelism
  # keeps the container memory (MEM_CHROMIUM 2048m) predictable under smoke
  # runs.
  contexts: 3
  timeout: "25s"
  restart_every_pages: 500
  # 0 is required for moli/lightpanda (validation: the foreign process's
  # RSS is unavailable), and in dev the threshold would not work anyway —
  # the browser is always an external container, not a worker process.
  # Without the key the profile would inherit the production default
  # 1536MiB and reject switching the engine.
  restart_memory_bytes: 0

content:
  dir: "/data/content"
  pack_size: "512MB"
  max_store_bytes: 2097152
  zstd_dictionary: "/data/content/dict.zst"

analyzer:
  rules_dir: "/etc/crawler/rules"
  laravel_min_score: 0.6

subdomains:                          # the initial fill of the subdomains table
  - ""
  - "www"
  - "admin"
  - "crm"
  - "api"
  - "app"

monitor:
  listen: ":9100"
  # Dev keeps the top of the spec 5.9 range (30–60 s): the dev bench corpus
  # is small, counter freshness suits live acceptance; the production
  # default since T-199 — 30 min (reconciliation — the only full domains
  # pass, the slow-window measurement after 3bffc62).
  zone_stats_interval: "60s"
  # Alerts in dev — the same 60 s (as before T-206): live acceptance wins
  # from the instant window reaction; the production default — 5 min (the
  # previous frequency).
  alerts_interval: "60s"
  # The junk content_hash alert probe (T-099): the /metrics of the ingest
  # service by the service name in the docker network (the same as
  # Prometheus scrapes).
  ingest_metrics_url: "http://ingest:9101/metrics"
  # The render fallback share budget alert probe (T-246): the render
  # worker's /metrics by the service name in the docker network.
  render_metrics_url: "http://render-worker:9105/metrics"

web:
  # dev: the public API listens on all the container's interfaces (:8080 —
  # inside the docker network), the compose service web publishes the port
  # outward on the host's 127.0.0.1 (WEB_PORT); the config default —
  # loopback behind a reverse-proxy (the systemd deploy, deploy/nginx/).
  listen: ":8080"

dashboard:
  # dev: the dashboard listens on all the container's interfaces (:8090 —
  # inside the docker network), the compose service dashboard publishes the
  # port outward on the host's 127.0.0.1 (DASHBOARD_PORT); the config
  # default — loopback behind a reverse-proxy with TLS (the systemd deploy,
  # docs/deploy.md §6).
  listen: ":8090"
  # Dev operator credentials: admin/admin — the dev environment ONLY
  # (docs/dev-environment.md, "Dashboard"). Hash regeneration:
  #   printf 'admin' | docker compose --project-directory . \
  #     -f deploy/docker/compose.yaml --env-file .env \
  #     run --rm -T tools go run ./cmd/crawlerctl dashboard-secret
  username: admin
  password_hash: "pbkdf2-sha256$600000$U4QVNdJGZODPI4hlFGHoNw==$lwv+2vxJN7K3ZQIuEueR0KDOfBrNkQIXccDg3EAWEdo="
  # Pipeline service liveness probes for the health section (dashboard
  # spec §5.8): the compose service names and their METRICS_PORT in the
  # docker network (METRICS_ADDR=:91xx in compose — the same address
  # Prometheus scrapes).
  probes:
    ingest: "http://ingest:9101"
    scheduler: "http://scheduler:9102"
    dns-worker: "http://dns-worker:9103"
    http-worker: "http://http-worker:9104"
    render-worker: "http://render-worker:9105"
    analyzer: "http://analyzer:9106"
    monitor: "http://monitor:9100"
  # The render engines panel (T-246): the main render-worker build's
  # exposition (the stage engine — the engine labels). The fallback worker
  # B — the render-fallback service of the runtime profile (in the docker
  # network — the binary's same :9105 default, i.e.
  # http://render-fallback:9105/metrics; the address is added for bench
  # fallback runs, docs/render.md); on the standard dev stack B is not
  # brought up — without it the panel shows only the stage engine,
  # consumption/depth — zeros.
  render_metrics_urls:
    - "http://render-worker:9105/metrics"
    # worker B (uncomment for bench fallback runs):
    # - "http://render-fallback:9105/metrics"

log:
  level: "info"                    # dev: info, debug for debugging the workers
