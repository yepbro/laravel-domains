# Dev-конфигурация сервисов Domain Crawler (ТЗ 5.10 основного ТЗ).
# Подставляется в контейнеры как /etc/crawler/config.yaml.
# Значения-адреса соответствуют статическим IP сети crawler_net в compose.yaml;
# при развитии сервисов значения из переменных окружения имеют приоритет.

postgres:
  # Полный DSN собирается из APP_PG_DSN (env), здесь — форма по умолчанию.
  dsn: "postgres://crawler:crawler@172.28.100.2:5432/crawler?sslmode=disable"
  # 20 — dev-масштаб: max_connections=130 (postgresql.dev.conf — стек сервисов
  # + параллельные прогоны тестов). Боевой бюджет (max_connections=50) —
  # 5 на сервис: config.example.yaml, docs/db.md «Бюджет соединений».
  pool_size: 20

redis:
  addr: "172.28.100.3:6379"

ingest:
  dir: "/data/incoming"
  batch_size: 50000
  stable_seconds: 10
  scan_interval: "5s"               # dev: страховочный обход чаще

scheduler:
  recheck_interval: "4380h"          # ~6 месяцев
  batch_size: 1000                   # ≈64 КиБ запись q:dns — бюджет Redis (T-141)
  queue_high_watermark: 100000
  lease: "30m"
  temp_error_retry_after: "24h"

dns:
  resolvers: ["172.28.100.10:53"]      # unbound
  fallback_resolvers: []             # в dev наружу не ходим
  concurrency: 2000
  max_qps: 10000
  ipv6: false                        # в docker-сети IPv6 нет

http:
  concurrency: 2000
  per_ip_limit: 4
  connect_timeout: "5s"
  header_timeout: "10s"
  total_timeout: "20s"
  max_redirects: 8
  max_body_bytes: 2097152
  user_agent: "DomainCrawler/dev (+dev-environment; contact: dev@example.invalid)"

render:
  # dev: внешний chromium-контейнер (compose-сервис chromium, ws://172.28.100.14:9222)
  remote_url: "ws://172.28.100.14:9222"
  # Осознанно ниже боевого дефолта 4 (T-142): dev-chromium делят юнит- и
  # live-тесты рендера, консервативный параллелизм держит память
  # контейнера (MEM_CHROMIUM 2048m) предсказуемой под смоук-прогонами.
  contexts: 3
  timeout: "25s"
  restart_every_pages: 500

content:
  dir: "/data/content"
  pack_size: "512MB"
  max_store_bytes: 2097152
  zstd_dictionary: "/data/content/dict.zst"

analyzer:
  rules_dir: "/etc/crawler/rules"
  laravel_min_score: 0.6

subdomains:                          # начальное наполнение таблицы subdomains
  - ""
  - "www"
  - "admin"
  - "crm"
  - "api"
  - "app"

monitor:
  listen: ":9100"
  # Dev держит верх коридора ТЗ 5.9 (30–60 с): корпус дев-стенда мал,
  # свежесть счётчиков удобна живой приёмке; боевой дефолт с T-161 —
  # 5 мин (замер §12: UPDATE-агрегат на 47 млн строк дорог).
  zone_stats_interval: "60s"
  # Зонд алерта мусорных content_hash (T-099): /metrics сервиса ingest
  # по имени сервиса в docker-сети (то же, что скрейпит Prometheus).
  ingest_metrics_url: "http://ingest:9101/metrics"

web:
  # dev: лендинг слушает все интерфейсы контейнера (:8080 — внутри
  # docker-сети), наружу порт публикует compose-сервис web на 127.0.0.1
  # хоста (WEB_PORT); дефолт конфига — loopback под reverse-proxy
  # (systemd-деплой, deploy/nginx/).
  listen: ":8080"

dashboard:
  # dev: дашборд слушает все интерфейсы контейнера (:8090 — внутри
  # docker-сети), наружу порт публикует compose-сервис dashboard на
  # 127.0.0.1 хоста (DASHBOARD_PORT); дефолт конфига — loopback под
  # reverse-proxy с TLS (systemd-деплой, docs/deploy.md §6).
  listen: ":8090"
  # Dev-креды оператора: admin/admin — ТОЛЬКО dev-окружение
  # (docs/dev-environment.md, «Дашборд»). Перегенерация хэша:
  #   printf 'admin' | docker compose --project-directory . \
  #     -f deploy/docker/compose.yaml --env-file .env \
  #     run --rm -T tools go run ./cmd/crawlerctl dashboard-secret
  username: admin
  password_hash: "pbkdf2-sha256$600000$U4QVNdJGZODPI4hlFGHoNw==$lwv+2vxJN7K3ZQIuEueR0KDOfBrNkQIXccDg3EAWEdo="
  # Пробы живости сервисов конвейера для секции здоровья (ТЗД §5.8):
  # имена compose-сервисов и их METRICS_PORT в docker-сети
  # (METRICS_ADDR=:91xx в compose — тот же адрес, что скрейпит Prometheus).
  probes:
    ingest: "http://ingest:9101"
    scheduler: "http://scheduler:9102"
    dns-worker: "http://dns-worker:9103"
    http-worker: "http://http-worker:9104"
    render-worker: "http://render-worker:9105"
    analyzer: "http://analyzer:9106"
    monitor: "http://monitor:9100"

log:
  level: "info"                    # dev: info, для отладки воркеров — debug
