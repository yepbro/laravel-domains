# The production render container configuration — the compose runtime
# profile, the render service (deploy/docker/compose.yaml). The difference
# from the dev config config.dev.yaml: remote_url is empty — render-worker
# starts its own headless-shell process (production mode, Dockerfile.render)
# instead of connecting to the external compose service chromium. The other
# sections take the default values (internal/config, spec 5.10); the
# DB/queue addresses come via environment variables (APP_PG_DSN,
# CRAWLER_REDIS_ADDR — see compose.yaml).

postgres:
  dsn: "" # set by APP_PG_DSN from compose.yaml

render:
  remote_url: "" # production mode: its own headless-shell process
  contexts: 8 # the T-169 default (demand ≈1.2 pages/s vs the capacity of 4 ≈0.8 — the drain caught up with the inflow; here the browser is the worker's own process, the T-065 RSS control works: the 1536 MiB threshold trips before the container's 2 GiB total limit, where the ~128 MB Go part also lives; at sustained RSS residency near the threshold — split into systemd units with separate cgroups, deploy.md §2.2)
  timeout: "25s"
  restart_every_pages: 500
  # The RSS restart threshold (T-065): 1.5 GiB at a container limit of
  # 2 GiB (the Chromium budget ≈ 2 GB, spec 3.2) — a restart before
  # cgroup-OOM; the rationale — docs/render.md, the "Browser restart"
  # section.
  restart_memory_bytes: "1536MiB"
