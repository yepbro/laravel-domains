# BuildKit layer cache for CI (GitHub Actions, type=gha).
# Applied ONLY in CI via the explicit -f flag; the file is not used locally:
#   docker compose -f compose.yaml -f compose.ci.yaml build
services:
  ingest: &build-cache
    build:
      cache_from:
        - type=gha,scope=crawler
      cache_to:
        - type=gha,scope=crawler,mode=max
  scheduler: *build-cache
  dns-worker: *build-cache
  http-worker: *build-cache
  render-worker: *build-cache
  analyzer: *build-cache
  monitor: *build-cache
  tools: *build-cache
  mockserver: *build-cache
  # moli (render-engines) gets into make build via --profile '*': without
  # the cache scopes every CI run would download a 45 MB tarball and install
  # apt packages.
  moli: *build-cache
