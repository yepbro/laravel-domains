# Domain Crawler — dev-окружение.
# Запуск через Makefile из корня репозитория (make up / make up-infra / ...),
# либо вручную: docker compose --project-directory . -f deploy/docker/compose.yaml ...
#
# Профили:
#   (по умолчанию) postgres, redis, unbound
#   testbed        coredns, testweb, mockserver — изолированный «мини-интернет»
#   app            Go-сервисы проекта + chromium
#   monitoring     prometheus
#   runtime        render — боевой render-контейнер (Dockerfile.render)
#   tools          adminer, redis-insight, tools (запускаются по требованию)
#
# Сеть crawler_net (172.28.100.0/24) — детерминированные адреса (T-180):
# ipv4_address задан всем долгоживущим сервисам. Динамический аллокатор
# Docker не резервирует адреса остановленных контейнеров, и стартующий
# динамический сервис занимал чужой адрес — владелец падал «Address
# already in use» (инциденты 2026-10-23/24 — tasks/tasks.md, этап 28).
# План адресов по классам (таблица с профилями — docs/docker.md §8):
#   инфраструктура: postgres 172.28.100.2, redis 172.28.100.3, unbound 172.28.100.10
#   testbed:        coredns 172.28.100.11, testweb 172.28.100.12, mockserver 172.28.100.13
#   app:            chromium 172.28.100.14; monitor 172.28.100.20, ingest 172.28.100.21,
#                   scheduler 172.28.100.22, dns-worker 172.28.100.23, http-worker 172.28.100.24,
#                   render-worker 172.28.100.25, analyzer 172.28.100.26, web 172.28.100.27,
#                   dashboard 172.28.100.28 — адрес .2k = порт метрик 910k; .29 — резерв
#   runtime:        render 172.28.100.15
#   monitoring:     prometheus 172.28.100.30
#   tools:          adminer 172.28.100.31, redis-insight 172.28.100.32 (далее свободно)
#   172.28.100.250 — «чёрная дыра» (адрес без слушателя для сценариев
#   закрытых портов) — не занимается ни одним сервисом.
# Адреса инфраструктуры/testbed/chromium/render неизменны исторически и
# менять их нельзя — они зафиксированы у потребителей: testbedgen печёт
# .12 в DNS-зоны (cmd/testbedgen/main.go Network.TestwebIP), live-тесты
# рендера ходят на ws://172.28.100.14:9222, DSN .2 — config.dev.yaml
# и тесты миграций.
# Исключение — run-контейнер tools: адрес НЕ задаётся (см. комментарий
# у сервиса tools). Остаточный риск: живой одноразовый run-контейнер
# (make test/lint/debug, docker compose run) может динамически занять
# адрес остановленного статического сервиса — аллокатор выдаёт свободные
# адреса с младших — и владелец не стартанёт «Address already in use»
# до завершения run-контейнера; окно ограничено его временем жизни и
# самозалечивается (--rm).
# Приложениям адреса инфраструктуры выдаются через переменные окружения,
# а DNS всех сервисов приложения указывает на unbound (см. 7.2 ТЗ).

name: crawler

x-go-build: &go-build
  context: .
  dockerfile: deploy/docker/Dockerfile.go
  target: dev
  args:
    GO_VERSION: ${GO_VERSION:?GO_VERSION must be set (см. .env.example)}
    ALPINE_VERSION: ${ALPINE_VERSION:-3.24.2}
    AIR_VERSION: ${AIR_VERSION:-v1.67.4}
    DELVE_VERSION: ${DELVE_VERSION:-v1.27.2}
    GOLANGCI_LINT_VERSION: ${GOLANGCI_LINT_VERSION:-v2.14.0}
    MIGRATE_VERSION: ${MIGRATE_VERSION:-v4.20.1}
    GO_MUTESTING_VERSION: ${GO_MUTESTING_VERSION:-v0.0.0-20251226130216-48d0401f00fb}

x-go-common: &go-common
  image: crawler/go-dev:local
  working_dir: /src
  user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
  environment: &go-common-env
    HOME: /tmp
    # GOPATH — во временный каталог внутри контейнера: каталог /go из образа
    # принадлежит root, а сюда Go кладёт кэш sumdb (make mod-download/go get
    # после make clean). Модули — в общем томе GOMODCACHE, он тут ни при чём.
    GOPATH: /tmp/gopath
    GOMODCACHE: /gomod
    GOCACHE: /gocache
    GOFLAGS: -mod=readonly
    # Значения подставляются из .env; DSN — статический IP сети crawler_net.
    # CRAWLER_CONFIG — путь к единому YAML (internal/config, ТЗ 5.10);
    # переменные CRAWLER_* переопределяют значения из него (docs/configuration.md).
    # Только переменные, которые код действительно читает: адреса Redis и
    # резолвера, пути каталогов сервисы берут из config.dev.yaml, а не из
    # окружения (таблица envSpecs в internal/config).
    APP_PG_DSN: postgres://${APP_DB_USER:-crawler}:${APP_DB_PASSWORD:-dev-only-crawler}@172.28.100.2:5432/${POSTGRES_DB:-crawler}?sslmode=disable
    CRAWLER_CONFIG: /etc/crawler/config.yaml
    CRAWLER_HTTP_USER_AGENT: "${CRAWLER_USER_AGENT:-DomainCrawler/dev (+dev-environment; contact: dev@example.invalid)}"
  volumes:
    - .:/src                      # исходный код (bind, hot reload)
    - gomodcache:/gomod           # кэш Go-модулей (общий, именованный том)
    - gocache:/gocache            # кэш сборки (общий, именованный том)
    - ./deploy/docker/config.dev.yaml:/etc/crawler/config.yaml:ro
    - ./rules:/etc/crawler/rules:ro
    - ./var/content:/data/content
  dns_opt:
    - "ndots:1"
  networks:
    - crawler_net
  restart: unless-stopped
  stop_grace_period: 15s
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  sysctls:
    net.ipv4.ip_local_port_range: "1024 65535"
  # Healthcheck контейнеров приложения — liveness-проба /livez (T-110):
  # контейнер здоров, пока процесс жив и отвечает HTTP. Readiness /healthz
  # (пинг пула PostgreSQL, 503 при сбое) в healthcheck сознательно не
  # используется: задачи воркеры тянут из Redis-очередей сами —
  # маршрутизатора «впускать трафик» нет, а при недоступной БД стена
  # unhealthy-воркеров лишь дублировала бы статус самого postgres
  # (у него свой healthcheck); /healthz остаётся оператору и мониторингу.
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${METRICS_PORT:-9090}/livez || exit 1"]
    interval: 15s
    timeout: 3s
    retries: 20
    start_period: 120s

# Сервисы приложения используют unbound как единственный внешний резолвер
# (ТЗ 7.2): Docker пересылает на указанный адрес всё, что не является именем
# сервисов compose. У tools DNS оставлен стандартным (нужен proxy.golang.org).
x-app-dns: &app-dns
  dns:
    - 172.28.100.10

services:
  # ==========================================================================
  # Инфраструктура (профиль по умолчанию)
  # ==========================================================================

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.15-alpine3.24}
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-admin}
      POSTGRES_DB: ${POSTGRES_DB:-crawler}
      APP_DB_USER: ${APP_DB_USER:-crawler}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-dev-only-crawler}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.dev.conf
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/docker/postgres/postgresql.dev.conf:/etc/postgresql/postgresql.dev.conf:ro
      - ./deploy/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    networks:
      crawler_net:
        ipv4_address: 172.28.100.2
    mem_limit: ${MEM_POSTGRES:-1536m}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-admin} -d ${POSTGRES_DB:-crawler}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.11-alpine3.21}
    command: ["redis-server", "/usr/local/etc/redis/redis.dev.conf"]
    volumes:
      - ./deploy/docker/redis/redis.dev.conf:/usr/local/etc/redis/redis.dev.conf:ro
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      crawler_net:
        ipv4_address: 172.28.100.3
    mem_limit: ${MEM_REDIS:-256m}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  unbound:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.unbound
      args:
        ALPINE_VERSION: ${ALPINE_VERSION:-3.24.2}
    image: crawler/unbound:local
    environment:
      # testbed: всё форвардится в coredns, остальное REFUSED.
      # Режим internet включается только make up-internet (ALLOW_INTERNET=1):
      # рекурсия с корневых серверов, prefetch, кэш ≈ 542 МБ (ТЗ 5.4/3.2).
      # Публичные fallback-резолверы unbound НЕ получает — семантика forward-zone
      # делает форвардеры первичными; fallback — на клиенте dns-worker
      # (dns.fallback_resolvers, см. docs/docker.md, раздел «Unbound»).
      UNBOUND_MODE: ${UNBOUND_MODE:-testbed}
    command: ["/bin/sh", "-c", "exec unbound -d -c /etc/unbound/unbound.$${UNBOUND_MODE:-testbed}.conf"]
    networks:
      crawler_net:
        ipv4_address: 172.28.100.10
    # ТЗ 3.2: бюджет Unbound ≈ 0,7 ГБ (mem_limit — docker-аналог MemoryMax из
    # ТЗ 10.1). Режим internet дорастает до кэшей суммарно ≈ 542 МБ (таблицы
    # растут лениво по заполнении, стартовый RSS ~20 МБ) — запас ~160 МБ на
    # процесс и буферы потоков; режим testbed занимает ~150 МБ, лимит-потолок
    # память не резервирует. Для слабых машин в testbed можно вернуть 256m
    # (.env: MEM_UNBOUND).
    mem_limit: ${MEM_UNBOUND:-700m}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nslookup $${UNBOUND_HEALTH_NAME:-same-site.crawl.test} 127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ==========================================================================
  # Тестовый стенд (profile: testbed)
  # ==========================================================================

  coredns:
    image: ${COREDNS_IMAGE:-coredns/coredns:1.14.7}
    command: ["-conf", "/Corefile"]
    volumes:
      - ./deploy/docker/testbed/coredns/Corefile:/Corefile:ro
      - ./deploy/docker/testbed/coredns/zones.conf:/etc/coredns/zones.conf:ro
      - ./deploy/docker/testbed/coredns/zones:/zones:ro
    networks:
      crawler_net:
        ipv4_address: 172.28.100.11
    mem_limit: 128m
    restart: unless-stopped
    profiles: ["testbed"]

  testweb:
    # Caddy с виртуальными хостами по сценариям из deploy/docker/testbed/web/Caddyfile
    image: ${CADDY_IMAGE:-caddy:2.11.7-alpine}
    volumes:
      - ./deploy/docker/testbed/web/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/docker/testbed/web/sites:/srv/sites:ro
      - ./testdata/laravel-samples:/srv/samples:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "127.0.0.1:${TESTWEB_HTTP_PORT:-8088}:80"
      - "127.0.0.1:${TESTWEB_HTTPS_PORT:-8443}:443"
    networks:
      crawler_net:
        ipv4_address: 172.28.100.12
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s
    profiles: ["testbed"]

  mockserver:
    # «Злые» сценарии, которые нельзя описать статикой: тарпит, огромные тела,
    # zip-бомба, обрыв соединения, бесконечные редиректы, плохие TLS-сертификаты.
    # Исходник: cmd/mockserver
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.go
      target: mockserver
      args:
        GO_VERSION: ${GO_VERSION:?GO_VERSION must be set}
        ALPINE_VERSION: ${ALPINE_VERSION:-3.24.2}
    image: crawler/mockserver:local
    networks:
      crawler_net:
        ipv4_address: 172.28.100.13
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s
    profiles: ["testbed"]

  # ==========================================================================
  # Приложения проекта (profile: app)
  # Статические адреса .20–.28: адрес .2k = порт метрик 910k (план — шапка
  # файла, docs/docker.md §8); .29 — резерв под новый сервис app.
  # ==========================================================================

  ingest:
    <<: [*go-common, *app-dns]
    build: *go-build
    command: ["./deploy/docker/scripts/air-entrypoint.sh"]
    environment:
      <<: *go-common-env
      SERVICE: ingest
      METRICS_PORT: "9101"
    volumes:
      - .:/src
      - gomodcache:/gomod
      - gocache:/gocache
      - ./deploy/docker/config.dev.yaml:/etc/crawler/config.yaml:ro
      - ./rules:/etc/crawler/rules:ro
      # наблюдаемая папка и соседние каталоги — bind с хоста (ТЗ 4.2)
      - ./var/incoming:/data/incoming
      - ./var/content:/data/content
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      crawler_net:
        ipv4_address: 172.28.100.21
    profiles: ["app"]

  scheduler:
    <<: [*go-common, *app-dns]
    build: *go-build
    command: ["./deploy/docker/scripts/air-entrypoint.sh"]
    environment:
      <<: *go-common-env
      SERVICE: scheduler
      METRICS_PORT: "9102"
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      crawler_net:
        ipv4_address: 172.28.100.22
    profiles: ["app"]

  dns-worker:
    <<: [*go-common, *app-dns]
    build: *go-build
    command: ["./deploy/docker/scripts/air-entrypoint.sh"]
    environment:
      <<: *go-common-env
      SERVICE: dns-worker
      METRICS_PORT: "9103"
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      crawler_net:
        ipv4_address: 172.28.100.23
    profiles: ["app"]

  http-worker:
    <<: [*go-common, *app-dns]
    build: *go-build
    command: ["./deploy/docker/scripts/air-entrypoint.sh"]
    environment:
      <<: *go-common-env
      SERVICE: http-worker
      METRICS_PORT: "9104"
    # Самый тяжёлый Go-сервис: слоты задач q:http (http.task_concurrency,
    # дефолт 192, T-157 — config.dev.yaml задачный параллелизм не
    # понижает) удерживают тела страниц до 2 МиБ до конца задачи домена
    # (дедупликация алиасов): замер ≈3.34 MiB anon/слот → avg ≈855 MiB
    # на 256 слотах (docs/load-measurements.md §11, T-143) — сутки
    # на 256 дали два фатала юнита (§12, T-157), дефолт понижен до 192
    # (устойчиво по пропитке этапа 22: 860–893 MiB, oom=0, NRestarts=0).
    # Прежние 384m вмещали лишь 128 слотов (anon ≈380 из 384 MiB) — на
    # 256 OOM контейнера. Паритет с MemoryMax=900M боевого
    # юнита (deploy/systemd/crawler-http-worker.service); снижать только
    # вместе с http.task_concurrency.
    mem_limit: 900m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      crawler_net:
        ipv4_address: 172.28.100.24
    profiles: ["app"]

  render-worker:
    <<: [*go-common, *app-dns]
    build: *go-build
    command: ["./deploy/docker/scripts/air-entrypoint.sh"]
    environment:
      <<: *go-common-env
      SERVICE: render-worker
      METRICS_PORT: "9105"
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      crawler_net:
        ipv4_address: 172.28.100.25
    profiles: ["app"]

  analyzer:
    <<: [*go-common, *app-dns]
    build: *go-build
    command: ["./deploy/docker/scripts/air-entrypoint.sh"]
    environment:
      <<: *go-common-env
      SERVICE: analyzer
      METRICS_PORT: "9106"
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      crawler_net:
        ipv4_address: 172.28.100.26
    profiles: ["app"]

  monitor:
    <<: [*go-common, *app-dns]
    build: *go-build
    command: ["./deploy/docker/scripts/air-entrypoint.sh"]
    environment:
      <<: *go-common-env
      SERVICE: monitor
      METRICS_PORT: "9100"
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      crawler_net:
        ipv4_address: 172.28.100.20
    profiles: ["app"]

  web:
    # Публичный лендинг (этап 13, T-124): в dev публикуется на loopback
    # хоста (127.0.0.1:WEB_PORT, web.listen в config.dev.yaml слушает
    # 8080 в контейнере) — как и операторский дашборд (сервис
    # dashboard ниже, DASHBOARD_PORT); боевой вход — reverse-proxy
    # с TLS (deploy/nginx/, docs/deploy.md).
    # METRICS_ADDR разворачивает метрики на интерфейсы docker-сети для
    # Prometheus (наружу порт не публикуется — ТЗ §9); дефолт кода/юнита —
    # loopback 127.0.0.1:9107.
    <<: [*go-common, *app-dns]
    build: *go-build
    command: ["./deploy/docker/scripts/air-entrypoint.sh"]
    environment:
      <<: *go-common-env
      SERVICE: web
      METRICS_PORT: "9107"
      METRICS_ADDR: ":9107"
      # Форма лендинга (T-123): живая проверка реальных доменов в dev.
      # Testbed-unbound герметичен — на всё вне тестовых зон отвечает
      # SERVFAIL, чекер эскалирует на публичные dns.fallback_resolvers
      # (internal/checker/resolve.go). Массовый конвейер (dns-worker)
      # этого env не получает — герметичность краула не меняется.
      CRAWLER_DNS_FALLBACK_RESOLVERS: "1.1.1.1:53,9.9.9.9:53"
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:8080"
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      crawler_net:
        ipv4_address: 172.28.100.27
    profiles: ["app"]

  dashboard:
    # Операторский дашборд конвейера (этап 15, ТЗД; T-128…T-131): единая
    # страница состояния с доступом по паролю (HTTP Basic, креды — секция
    # dashboard в config.dev.yaml), строго read-only. В dev публикуется
    # на loopback хоста (127.0.0.1:DASHBOARD_PORT, dashboard.listen в
    # config.dev.yaml слушает 8090 в контейнере); боевой вход — loopback
    # за reverse-proxy с TLS (схема web/T-124, docs/deploy.md §6).
    # METRICS_ADDR разворачивает метрики на интерфейсы docker-сети для
    # Prometheus (наружу порт не публикуется — ТЗ §9); дефолт кода/юнита —
    # loopback 127.0.0.1:9108 (следующий за web:9107).
    <<: [*go-common, *app-dns]
    build: *go-build
    command: ["./deploy/docker/scripts/air-entrypoint.sh"]
    environment:
      <<: *go-common-env
      SERVICE: dashboard
      METRICS_PORT: "9108"
      METRICS_ADDR: ":9108"
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8090}:8090"
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      crawler_net:
        ipv4_address: 172.28.100.28
    profiles: ["app"]

  chromium:
    # Headless Chromium для render-worker (CDP на :9222).
    # shm_size вместо --disable-dev-shm-usage; init — уборка zombie (ТЗ 4.3).
    # mem_limit — бюджет Chromium ТЗ 3.2 (≈2 ГБ, docker-аналог cgroup
    # MemoryMax из ТЗ 10.1). Перезапуск по страницам/памяти (T-065) здесь
    # ограничен порогом страниц: воркер в remote-режиме не видит RSS чужого
    # контейнера — жёсткий потолок и рестарт держит этот лимит + restart.
    image: ${CHROMEDP_HEADLESS_IMAGE:-chromedp/headless-shell:156.0.8078.17}
    shm_size: "1gb"
    init: true
    dns:
      - 172.28.100.10
    networks:
      crawler_net:
        ipv4_address: 172.28.100.14
    mem_limit: ${MEM_CHROMIUM:-2048m}
    restart: unless-stopped
    profiles: ["app"]

  # ==========================================================================
  # Боевой render-контейнер (profile: runtime)
  # ==========================================================================

  render:
    # Боевой режим рендера целиком в одном контейнере: render-worker запускает
    # собственный Chromium (deploy/docker/Dockerfile.render). Ресурсные
    # требования фиксируются здесь (T-065): mem_limit — бюджет Chromium ≈2 ГБ
    # (ТЗ 3.2, docker-аналог cgroup MemoryMax из ТЗ 10.1 — OOM не заденет
    # остальные сервисы); shm_size/init — как dev-сервису chromium (ТЗ 4.3);
    # cap_drop/no-new-privileges — непривилегированный запуск (§9). Перезапуск
    # Chromium каждые N страниц и по порогу RSS — изнутри воркера
    # (render.restart_every_pages / render.restart_memory_bytes, T-065,
    # docs/render.md); systemd-юниты с MemoryMax — этап 9 (ТЗ 10.1).
    # Рабочий цикл очередей подключается T-067; сейчас сервис стартует и
    # отвечает healthz.
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.render
      target: render
      args:
        GO_VERSION: ${GO_VERSION:?GO_VERSION must be set (см. .env.example)}
        CHROMEDP_HEADLESS_IMAGE: ${CHROMEDP_HEADLESS_IMAGE:-chromedp/headless-shell:156.0.8078.17}
    image: crawler/render:local
    # Воркер пишет пак-файлы контента в host-bind ./var/content, каталог
    # принадлежит DEV_UID на хосте — а образ завершается USER nobody (65534),
    # у которого на bind прав нет: запись падала permission denied (профиль
    # app маскирует проблему — там сервисы работают от DEV_UID). Как остальные
    # сервисы, render запускается от DEV_UID/DEV_GID: непривилегированный
    # не-root (ТЗ §9/§10.1; nobody остаётся в образе для запусков без
    # host-bind) + cap_drop/no-new-privileges ниже.
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    environment:
      APP_PG_DSN: postgres://${APP_DB_USER:-crawler}:${APP_DB_PASSWORD:-dev-only-crawler}@172.28.100.2:5432/${POSTGRES_DB:-crawler}?sslmode=disable
      CRAWLER_REDIS_ADDR: 172.28.100.3:6379
      CRAWLER_CONFIG: /etc/crawler/config.render.yaml
      CRAWLER_HTTP_USER_AGENT: "${CRAWLER_USER_AGENT:-DomainCrawler/dev (+dev-environment; contact: dev@example.invalid)}"
    volumes:
      - ./deploy/docker/config.render.yaml:/etc/crawler/config.render.yaml:ro
      - ./var/content:/data/content
    # DNS — unbound: и воркеру (очереди по именам не нужны, адреса статические),
    # и Chromium — он резолвит имена страниц контейнера (ТЗ 5.4 через unbound).
    dns:
      - 172.28.100.10
    dns_opt:
      - "ndots:1"
    networks:
      crawler_net:
        ipv4_address: 172.28.100.15
    mem_limit: ${MEM_RENDER:-2048m}
    shm_size: "1gb"
    init: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["runtime"]

  # ==========================================================================
  # Мониторинг (profile: monitoring)
  # ==========================================================================

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.4}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      crawler_net:
        ipv4_address: 172.28.100.30
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    profiles: ["monitoring"]

  # ==========================================================================
  # Сервисные инструменты (profile: tools)
  # ==========================================================================

  adminer:
    image: ${ADMINER_IMAGE:-adminer:5.5.1-standalone}
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    networks:
      crawler_net:
        ipv4_address: 172.28.100.31
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  redis-insight:
    image: ${REDIS_INSIGHT_IMAGE:-redis/redisinsight:3.2.0}
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
    ports:
      - "127.0.0.1:${REDIS_INSIGHT_PORT:-5540}:5540"
    networks:
      crawler_net:
        ipv4_address: 172.28.100.32
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["tools"]

  tools:
    # Контейнер с Go-тулчейном, crawlerctl, migrate, lint.
    # У него НЕ переопределён DNS (нужен proxy.golang.org для новых модулей),
    # поэтому новые зависимости качаются отсюда: make mod-download.
    #
    # Статический адрес НЕ задаётся — единственное исключение плана адресов
    # (T-180): прогоны make test / lint / debug и docker compose run — это
    # ОДНОРАЗОВЫЕ run-контейнеры, запускаемые параллельно из основного
    # дерева и worktree'ов с COMPOSE_PROJECT_NAME=crawler, т.е. в ту же сеть
    # crawler_net; общий статический адрес конфликтовал бы между ними
    # («Address already in use»). Остаточный риск: живой run-контейнер может
    # динамически занять адрес остановленного статического сервиса (аллокатор
    # выдаёт свободные адреса с младших) — владелец не стартанёт до его
    # завершения; окно ограничено временем жизни run-контейнера и
    # самозалечивается (--rm). Аналогично make debug SERVICE=<app-сервис>:
    # перед запуском остановите штатный контейнер сервиса (dc stop <svc>),
    # иначе run-контейнер не получит его статический адрес.
    <<: *go-common
    build: *go-build
    command: ["sleep", "infinity"]
    # Явное networks (переопределяет плоский список якоря go-common) ради
    # DNS-алиасов трекер-доменов live-теста block_tracker_domains (T-214,
    # block_live_test.go): run-контейнер сам отдаёт зонды трекер-доменов —
    # герметичный unbound эти имена не резолвит, а без резолва «заблокировано»
    # в тесте неотличимо от DNS-отказа. Хосты — не Google-аналитика:
    # google-домены в HSTS-preload Chromium (http-зонд принудительно
    # апгрейдится на https и падает на TLS с HTTP-сервером теста).
    # Алиасы применяются только с флагом `docker compose run --use-aliases`
    # (без него run-контейнеры алиасы служб не получают), живут, пока жив
    # run-контейнер (make test/lint — секунды-минуты) и действуют только в
    # dev-стеке; параллельные run-контейнеры разделяют имена (round-robin
    # Docker DNS) — окно гонки того же класса, что и динамические адреса
    # T-180.
    networks:
      crawler_net:
        aliases:
          - c.clarity.ms
          - mc.yandex.ru
    environment:
      # Поверх общих переменных — адрес CDP dev-chromium для live-тестов
      # рендера (internal/render/*_live_test.go) и приёмочных тестов
      # (accChromiumWS); тесты запускаются именно в tools (make test /
      # make test-integration). Сервисам приложения не нужен: воркер берёт
      # адрес из render.remote_url в config.dev.yaml.
      <<: *go-common-env
      CHROMIUM_WS_URL: ws://172.28.100.14:9222
    volumes:
      - .:/src
      - gomodcache:/gomod
      - gocache:/gocache
      - ./deploy/docker/config.dev.yaml:/etc/crawler/config.yaml:ro
      - ./migrations:/migrations
      - ./testdata:/testdata:ro
      - ./rules:/rules:ro
      - ./var/incoming:/data/incoming
      - ./var/content:/data/content
    restart: "no"
    # Healthcheck общего якоря здесь вечно красный: tools — sleep infinity,
    # HTTP-сервера метрик в контейнере нет. Отключаем — иначе шум в dc ps
    # и подвисший up --wait, если поднять профиль tools целиком (T-110).
    healthcheck:
      disable: true
    # Лимит выше, чем у сервисов: go vet/lint/test компилируют все пакеты
    # модуля, включая тяжёлые зависимости (go-redis, chromedp, prometheus).
    mem_limit: 2g
    profiles: ["tools"]

networks:
  crawler_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.100.0/24

volumes:
  pg_data:
  caddy_data:
  caddy_config:
  prom_data:
  gomodcache:
  gocache:
