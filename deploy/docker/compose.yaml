# Domain Crawler — the dev environment.
# Run via the Makefile from the repository root (make up / make up-infra /
# ...), or manually: docker compose --project-directory . -f deploy/docker/compose.yaml ...
#
# Profiles:
#   (default)      postgres, redis, unbound
#   testbed        coredns, testweb, mockserver — an isolated "mini-internet"
#   app            the project's Go services + chromium
#   monitoring     prometheus
#   runtime        render — the production render container (Dockerfile.render);
#                  render-fallback — worker B: the same image, the
#                  q:render-fallback stream and a rate cap (T-240, spec §4.5)
#   render-engines lightpanda, moli — alternative render engines (T-241)
#   tools          adminer, redis-insight, tools (started on demand)
#
# The crawler_net network (172.28.100.0/24) — deterministic addresses
# (T-180): ipv4_address is set for all long-lived services. The dynamic
# allocator of Docker does not reserve addresses of stopped containers, and
# a starting dynamic service used to take a foreign address — the owner
# fell over "Address already in use" (the 2026-10-23/24 incidents —
# tasks/tasks.md, stage 28). The address plan by class (the table with
# profiles — docs/docker.md §8):
#   infrastructure: postgres 172.28.100.2, redis 172.28.100.3, unbound 172.28.100.10
#   testbed:        coredns 172.28.100.11, testweb 172.28.100.12, mockserver 172.28.100.13
#   app:            chromium 172.28.100.14; monitor 172.28.100.20, ingest 172.28.100.21,
#                   scheduler 172.28.100.22, dns-worker 172.28.100.23, http-worker 172.28.100.24,
#                   render-worker 172.28.100.25, analyzer 172.28.100.26, web 172.28.100.27,
#                   dashboard 172.28.100.28 — address .2k = the metrics port 910k; .29 — reserved
#   runtime:        render 172.28.100.15, render-fallback 172.28.100.18 (T-240)
#   render-engines: lightpanda 172.28.100.16, moli 172.28.100.17 (T-241)
#   monitoring:     prometheus 172.28.100.30
#   tools:          adminer 172.28.100.31, redis-insight 172.28.100.32 (free below)
#   172.28.100.250 — the "black hole" (an address without a listener for the
#   closed-port scenarios) — not claimed by any service.
# The infrastructure/testbed/chromium/render addresses are historically
# fixed and must not be changed — consumers pin them: testbedgen bakes .12
# into the DNS zones (cmd/testbedgen/main.go Network.TestwebIP), the render
# live tests go to ws://172.28.100.14:9222, the .2 DSN — config.dev.yaml
# and the migration tests.
# The exception is the tools run container: the address is NOT set (see the
# comment at the tools service). The residual risk: a live one-off run
# container (make test/lint/debug, docker compose run) may dynamically take
# the address of a stopped static service — the allocator hands out free
# addresses from the low end — and the owner will not start, "Address
# already in use", until the run container finishes; the window is bounded
# by its lifetime and self-heals (--rm).
# Applications get the infrastructure addresses via environment variables,
# and the DNS of all the app services points at unbound (see spec 7.2).

name: crawler

x-go-build: &go-build
  context: .
  dockerfile: deploy/docker/Dockerfile.go
  target: dev
  args:
    GO_VERSION: ${GO_VERSION:?GO_VERSION must be set (see .env.example)}
    ALPINE_VERSION: ${ALPINE_VERSION:-3.24.2}
    AIR_VERSION: ${AIR_VERSION:-v1.67.4}
    DELVE_VERSION: ${DELVE_VERSION:-v1.27.2}
    GOLANGCI_LINT_VERSION: ${GOLANGCI_LINT_VERSION:-v2.14.0}
    MIGRATE_VERSION: ${MIGRATE_VERSION:-v4.20.1}
    GO_MUTESTING_VERSION: ${GO_MUTESTING_VERSION:-v0.0.0-20251226130216-48d0401f00fb}

x-go-common: &go-common
  image: crawler/go-dev:local
  working_dir: /src
  user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
  environment: &go-common-env
    HOME: /tmp
    # GOPATH — a temp directory inside the container: the image's /go
    # directory is owned by root, while Go puts the sumdb cache here
    # (make mod-download/go get after make clean). The modules live in the
    # shared GOMODCACHE volume, it has nothing to do with this.
    GOPATH: /tmp/gopath
    GOMODCACHE: /gomod
    GOCACHE: /gocache
    GOFLAGS: -mod=readonly
    # The values are substituted from .env; the DSN — a static IP of the
    # crawler_net network. CRAWLER_CONFIG — the path to the single YAML
    # (internal/config, spec 5.10); the CRAWLER_* variables override its
    # values (docs/configuration.md). Only the variables the code actually
    # reads: the Redis and resolver addresses, the directory paths the
    # services take from config.dev.yaml, not from the environment (the
    # envSpecs table in internal/config).
    APP_PG_DSN: postgres://${APP_DB_USER:-crawler}:${APP_DB_PASSWORD:-dev-only-crawler}@172.28.100.2:5432/${POSTGRES_DB:-crawler}?sslmode=disable
    CRAWLER_CONFIG: /etc/crawler/config.yaml
    CRAWLER_HTTP_USER_AGENT: "${CRAWLER_USER_AGENT:-DomainCrawler/dev (+dev-environment; contact: dev@example.invalid)}"
  volumes:
    - .:/src                      # the source code (bind, hot reload)
    - gomodcache:/gomod           # the Go module cache (shared, named volume)
    - gocache:/gocache            # the build cache (shared, named volume)
    - ./deploy/docker/config.dev.yaml:/etc/crawler/config.yaml:ro
    - ./rules:/etc/crawler/rules:ro
    - ./var/content:/data/content
  dns_opt:
    - "ndots:1"
  networks:
    - crawler_net
  restart: unless-stopped
  stop_grace_period: 15s
  ulimits:
    nofile:
      soft: 65535
      hard: 65535
  sysctls:
    net.ipv4.ip_local_port_range: "1024 65535"
  # The app containers' healthcheck — the /livez liveness probe (T-110):
  # a container is healthy while its process is alive and answers HTTP.
  # The readiness /healthz (a PostgreSQL pool ping, 503 on failure) is
  # deliberately not used in the healthcheck: the workers pull tasks from
  # the Redis queues themselves — there is no "admit traffic" router, and
  # with the DB down a wall of unhealthy workers would only duplicate the
  # postgres status (it has its own healthcheck); /healthz stays for the
  # operator and monitoring.
  healthcheck:
    test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:$${METRICS_PORT:-9090}/livez || exit 1"]
    interval: 15s
    timeout: 3s
    retries: 20
    start_period: 120s

# The app services use unbound as the only external resolver (spec 7.2):
# Docker forwards everything that is not a compose service name to the
# specified address. tools keeps the default DNS (it needs
# proxy.golang.org).
x-app-dns: &app-dns
  dns:
    - 172.28.100.10

services:
  # ==========================================================================
  # Infrastructure (the default profile)
  # ==========================================================================

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.15-alpine3.24}
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev-only-admin}
      POSTGRES_DB: ${POSTGRES_DB:-crawler}
      APP_DB_USER: ${APP_DB_USER:-crawler}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-dev-only-crawler}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.dev.conf
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/docker/postgres/postgresql.dev.conf:/etc/postgresql/postgresql.dev.conf:ro
      - ./deploy/docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    networks:
      crawler_net:
        ipv4_address: 172.28.100.2
    mem_limit: ${MEM_POSTGRES:-1536m}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-admin} -d ${POSTGRES_DB:-crawler}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.11-alpine3.21}
    command: ["redis-server", "/usr/local/etc/redis/redis.dev.conf"]
    volumes:
      - ./deploy/docker/redis/redis.dev.conf:/usr/local/etc/redis/redis.dev.conf:ro
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks:
      crawler_net:
        ipv4_address: 172.28.100.3
    mem_limit: ${MEM_REDIS:-256m}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  unbound:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.unbound
      args:
        ALPINE_VERSION: ${ALPINE_VERSION:-3.24.2}
    image: crawler/unbound:local
    environment:
      # testbed: everything is forwarded to coredns, the rest REFUSED.
      # The internet mode is enabled only by make up-internet
      # (ALLOW_INTERNET=1): recursion from the root servers, prefetch, a
      # cache of ≈ 542 MB (spec 5.4/3.2). unbound does NOT get public
      # fallback resolvers — the forward-zone semantics makes the
      # forwarders authoritative; the fallback lives on the dns-worker
      # client (dns.fallback_resolvers, see docs/docker.md, the "Unbound"
      # section).
      UNBOUND_MODE: ${UNBOUND_MODE:-testbed}
    command: ["/bin/sh", "-c", "exec unbound -d -c /etc/unbound/unbound.$${UNBOUND_MODE:-testbed}.conf"]
    networks:
      crawler_net:
        ipv4_address: 172.28.100.10
    # spec 3.2: the Unbound budget ≈ 0.7 GB (mem_limit — the docker analog
    # of the spec 10.1 MemoryMax). The internet mode grows its caches to
    # ≈ 542 MB in total (the tables grow lazily as they fill, the starting
    # RSS ~20 MB) — ~160 MB of headroom for the process and the thread
    # buffers; the testbed mode takes ~150 MB, the cap limit does not
    # reserve memory. On weak machines in testbed it can go back to 256m
    # (.env: MEM_UNBOUND).
    mem_limit: ${MEM_UNBOUND:-700m}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nslookup $${UNBOUND_HEALTH_NAME:-same-site.crawl.test} 127.0.0.1 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ==========================================================================
  # Test bench (profile: testbed)
  # ==========================================================================

  coredns:
    image: ${COREDNS_IMAGE:-coredns/coredns:1.14.7}
    command: ["-conf", "/Corefile"]
    volumes:
      - ./deploy/docker/testbed/coredns/Corefile:/Corefile:ro
      - ./deploy/docker/testbed/coredns/zones.conf:/etc/coredns/zones.conf:ro
      - ./deploy/docker/testbed/coredns/zones:/zones:ro
    networks:
      crawler_net:
        ipv4_address: 172.28.100.11
    mem_limit: 128m
    restart: unless-stopped
    profiles: ["testbed"]

  testweb:
    # Caddy with virtual hosts per the scenarios from deploy/docker/testbed/web/Caddyfile
    image: ${CADDY_IMAGE:-caddy:2.11.7-alpine}
    volumes:
      - ./deploy/docker/testbed/web/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/docker/testbed/web/sites:/srv/sites:ro
      - ./testdata/laravel-samples:/srv/samples:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "127.0.0.1:${TESTWEB_HTTP_PORT:-8088}:80"
      - "127.0.0.1:${TESTWEB_HTTPS_PORT:-8443}:443"
    networks:
      crawler_net:
        ipv4_address: 172.28.100.12
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s
    profiles: ["testbed"]

  mockserver:
    # "Nasty" scenarios that cannot be described statically: a tarpit, huge
    # bodies, a zip bomb, a connection drop, endless redirects, bad TLS
    # certificates. Source: cmd/mockserver
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.go
      target: mockserver
      args:
        GO_VERSION: ${GO_VERSION:?GO_VERSION must be set}
        ALPINE_VERSION: ${ALPINE_VERSION:-3.24.2}
    image: crawler/mockserver:local
    networks:
      crawler_net:
        ipv4_address: 172.28.100.13
    mem_limit: 128m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s
    profiles: ["testbed"]

  # ==========================================================================
  # Project applications (profile: app)
  # Static addresses .20–.28: address .2k = the metrics port 910k (the plan
  # — the file header, docs/docker.md §8); .29 — reserved for a new app
  # service.
  # ==========================================================================

  ingest:
    <<: [*go-common, *app-dns]
    build: *go-build
    command: ["./deploy/docker/scripts/air-entrypoint.sh"]
    environment:
      <<: *go-common-env
      SERVICE: ingest
      METRICS_PORT: "9101"
    volumes:
      - .:/src
      - gomodcache:/gomod
      - gocache:/gocache
      - ./deploy/docker/config.dev.yaml:/etc/crawler/config.yaml:ro
      - ./rules:/etc/crawler/rules:ro
      # the watched directory and the neighboring directories — a host bind (spec 4.2)
      - ./var/incoming:/data/incoming
      - ./var/content:/data/content
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      crawler_net:
        ipv4_address: 172.28.100.21
    profiles: ["app"]

  scheduler:
    <<: [*go-common, *app-dns]
    build: *go-build
    command: ["./deploy/docker/scripts/air-entrypoint.sh"]
    environment:
      <<: *go-common-env
      SERVICE: scheduler
      METRICS_PORT: "9102"
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      crawler_net:
        ipv4_address: 172.28.100.22
    profiles: ["app"]

  dns-worker:
    <<: [*go-common, *app-dns]
    build: *go-build
    command: ["./deploy/docker/scripts/air-entrypoint.sh"]
    environment:
      <<: *go-common-env
      SERVICE: dns-worker
      METRICS_PORT: "9103"
    mem_limit: 384m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      crawler_net:
        ipv4_address: 172.28.100.23
    profiles: ["app"]

  http-worker:
    <<: [*go-common, *app-dns]
    build: *go-build
    command: ["./deploy/docker/scripts/air-entrypoint.sh"]
    environment:
      <<: *go-common-env
      SERVICE: http-worker
      METRICS_PORT: "9104"
    # The heaviest Go service: the q:http task slots (http.task_concurrency,
    # the default 192, T-157 — config.dev.yaml does not lower the task
    # parallelism) hold page bodies up to 2 MiB until the end of the domain
    # task (alias deduplication): ≈3.34 MiB anon/slot measured → avg ≈855
    # MiB at 256 slots (docs/load-measurements.md §11, T-143) — a day at
    # 256 gave two unit fatals (§12, T-157), the default lowered to 192
    # (stable by the stage 22 soak: 860–893 MiB, oom=0, NRestarts=0).
    # The previous 384m fit only 128 slots (anon ≈380 of 384 MiB) — at 256
    # the container OOMs. Parity with the production unit's MemoryMax=900M
    # (deploy/systemd/crawler-http-worker.service); lower it only together
    # with http.task_concurrency.
    mem_limit: 900m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      crawler_net:
        ipv4_address: 172.28.100.24
    profiles: ["app"]

  render-worker:
    <<: [*go-common, *app-dns]
    build: *go-build
    command: ["./deploy/docker/scripts/air-entrypoint.sh"]
    environment:
      <<: *go-common-env
      SERVICE: render-worker
      METRICS_PORT: "9105"
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      crawler_net:
        ipv4_address: 172.28.100.25
    profiles: ["app"]

  analyzer:
    <<: [*go-common, *app-dns]
    build: *go-build
    command: ["./deploy/docker/scripts/air-entrypoint.sh"]
    environment:
      <<: *go-common-env
      SERVICE: analyzer
      METRICS_PORT: "9106"
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      crawler_net:
        ipv4_address: 172.28.100.26
    profiles: ["app"]

  monitor:
    <<: [*go-common, *app-dns]
    build: *go-build
    command: ["./deploy/docker/scripts/air-entrypoint.sh"]
    environment:
      <<: *go-common-env
      SERVICE: monitor
      METRICS_PORT: "9100"
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      crawler_net:
        ipv4_address: 172.28.100.20
    profiles: ["app"]

  web:
    # The public landing page (stage 13, T-124): in dev it is published on
    # the host loopback (127.0.0.1:WEB_PORT, web.listen in config.dev.yaml
    # listens on 8080 in the container) — like the operator dashboard (the
    # dashboard service below, DASHBOARD_PORT); the production entry — a
    # reverse-proxy with TLS (deploy/nginx/, docs/deploy.md).
    # METRICS_ADDR exposes the metrics on the docker network interfaces for
    # Prometheus (the port is not published outward — spec §9); the
    # code/unit default — loopback 127.0.0.1:9107.
    <<: [*go-common, *app-dns]
    build: *go-build
    command: ["./deploy/docker/scripts/air-entrypoint.sh"]
    environment:
      <<: *go-common-env
      SERVICE: web
      METRICS_PORT: "9107"
      METRICS_ADDR: ":9107"
      # The landing form (T-123): live checks of real domains in dev.
      # The testbed unbound is hermetic — it answers SERVFAIL for anything
      # outside the test zones, the checker escalates to the public
      # dns.fallback_resolvers (internal/checker/resolve.go). The bulk
      # pipeline (dns-worker) does not get this env — the crawl
      # hermeticity does not change.
      CRAWLER_DNS_FALLBACK_RESOLVERS: "1.1.1.1:53,9.9.9.9:53"
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:8080"
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      crawler_net:
        ipv4_address: 172.28.100.27
    profiles: ["app"]

  dashboard:
    # The pipeline operator dashboard (stage 15, dashboard spec;
    # T-128…T-131): a single status page with password access (HTTP Basic,
    # the credentials — the dashboard section in config.dev.yaml), strictly
    # read-only. In dev it is published on the host loopback
    # (127.0.0.1:DASHBOARD_PORT, dashboard.listen in config.dev.yaml
    # listens on 8090 in the container); the production entry — loopback
    # behind a reverse-proxy with TLS (the web scheme/T-124, docs/deploy.md
    # §6). METRICS_ADDR exposes the metrics on the docker network
    # interfaces for Prometheus (the port is not published outward —
    # spec §9); the code/unit default — loopback 127.0.0.1:9108 (the next
    # one after web:9107).
    <<: [*go-common, *app-dns]
    build: *go-build
    command: ["./deploy/docker/scripts/air-entrypoint.sh"]
    environment:
      <<: *go-common-env
      SERVICE: dashboard
      METRICS_PORT: "9108"
      METRICS_ADDR: ":9108"
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8090}:8090"
    mem_limit: 256m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      crawler_net:
        ipv4_address: 172.28.100.28
    profiles: ["app"]

  chromium:
    # Headless Chromium for render-worker (CDP on :9222).
    # shm_size instead of --disable-dev-shm-usage; init — zombie reaping
    # (spec 4.3). mem_limit — the Chromium budget of spec 3.2 (≈2 GB, the
    # docker analog of the spec 10.1 cgroup MemoryMax). The restart by
    # pages/memory (T-065) is limited here by the page threshold: the
    # worker in remote mode does not see the foreign container's RSS — a
    # hard cap and the restart are held by this limit + restart.
    image: ${CHROMEDP_HEADLESS_IMAGE:-chromedp/headless-shell:156.0.8078.17}
    shm_size: "1gb"
    init: true
    dns:
      - 172.28.100.10
    networks:
      crawler_net:
        ipv4_address: 172.28.100.14
    mem_limit: ${MEM_CHROMIUM:-2048m}
    restart: unless-stopped
    profiles: ["app"]

  # ==========================================================================
  # Alternative render engines (profile: render-engines, stage 35 / T-241)
  # ==========================================================================

  lightpanda:
    # Lightpanda (github.com/lightpanda-io/browser) — an alternative CDP
    # render engine for local development and bench runs (the render
    # engines spec §4.7, FR-16): render-worker switches to it by changing
    # render.remote_url in config.dev.yaml. A separate profile: the engines
    # do not come up with make up — three browsers at once are not needed
    # on a dev machine (the memory budget), a specific engine starts on
    # demand (docs/dev-environment.md, "Render engines"). The version is
    # pinned by LIGHTPANDA_IMAGE (FR-17: a change is a separate procedure
    # with a smoke run).
    image: ${LIGHTPANDA_IMAGE:-lightpanda/browser:1.0.2}
    environment:
      # FR-18: Lightpanda telemetry is enabled in release builds by default
      # and is unacceptable for a crawler over foreign domains — disabled
      # (this removes the very fact of the variable being present; the true
      # value is for readability).
      LIGHTPANDA_DISABLE_TELEMETRY: "true"
    # The basic serve launch is left to the image's CMD (lightpanda serve
    # --host 0.0.0.0 --port 9222 --log-level info; --obey-robots is not
    # passed — FR-18). --advertise-host — a guard for third-party CDP
    # clients that go by the webSocketDebuggerUrl from /json/version:
    # Lightpanda builds it from the bind address, not from the request
    # Host. The worker does not need the flag (T-234): the lightpanda
    # engine's remote allocator connects by the render.remote_url address
    # as is (docs/render.md, "Render engines"). The value equals the
    # service's static address (the address plan above).
    command: ["/bin/lightpanda", "serve", "--host", "0.0.0.0", "--port", "9222", "--advertise-host", "172.28.100.16", "--log-level", "info"]
    # DNS — unbound, like chromium: the engine resolves the page names
    # itself (spec 5.4). The memory budget — the engine's starting cap (the
    # render engines spec §4.7 item 2, ≤1 GB): the remote worker does not
    # see the foreign container's RSS, the hard cap is held by
    # mem_limit + restart.
    dns:
      - 172.28.100.10
    networks:
      crawler_net:
        ipv4_address: 172.28.100.16
    mem_limit: ${MEM_LIGHTPANDA:-1gb}
    restart: unless-stopped
    # The healthcheck — /json/version (the CDP endpoint shared by all three
    # engines, the same one the worker's health check and TestChromium_CDP
    # use). The image is debian:stable-slim without wget/curl, the only
    # HTTP client is bash /dev/tcp: we open a connection, send a GET, and a
    # grep for "Browser" in the body confirms the answer is exactly
    # /json/version.
    healthcheck:
      test: ["CMD-SHELL", "bash -c \"exec 3<>/dev/tcp/127.0.0.1/9222 && printf 'GET /json/version HTTP/1.1\\r\\nHost: 127.0.0.1\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q Browser <&3\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s
    profiles: ["render-engines"]

  moli:
    # Moli (github.com/lexmount/moli) — the second alternative CDP engine
    # (FR-16; Apache-2.0/MIT licenses). There is no official image: the
    # minimal own image from the release tarball —
    # deploy/docker/Dockerfile.moli. The version and the asset checksum are
    # pinned in .env by the MOLI_VERSION/MOLI_SHA256 pair (FR-17). The
    # launch is serve without --layout and without --resource,
    # --obey-robots is not passed, --block-private-networks is not enabled
    # (FR-18 and testbed: the pages are served by testweb at a private
    # address — the rationale is in Dockerfile.moli); the bind host is
    # overridden below.
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.moli
      args:
        DEBIAN_VERSION: ${DEBIAN_VERSION:-13.7-slim}
        MOLI_VERSION: ${MOLI_VERSION:-v1.1.21}
        MOLI_SHA256: ${MOLI_SHA256:-048d9e482b6c618af08b17eb19200ea65b1b2fafd39975e5b9de19a60653ed8f}
    # A version tag, not :local — otherwise up -d does not notice a
    # MOLI_VERSION change (the image exists — no rebuild, FR-17 silently
    # not applied): the new version's tag is not present locally, compose
    # builds it itself; the previous tag remains as a revert path
    # (dc --profile render-engines up -d moli).
    image: crawler/moli:${MOLI_VERSION:-v1.1.21}
    # A bind to the service's static address (not 0.0.0.0 from the CMD):
    # Moli builds webSocketDebuggerUrl from the bind address, there is no
    # --advertise-host flag — the bind address itself is advertised. This
    # no longer matters to the worker (T-234: the moli engine's remote
    # allocator takes only the browser session path from /json/version and
    # substitutes the authority from render.remote_url — docs/render.md,
    # "Render engines"), but the address gives an honest advertisement for
    # third-party CDP clients and for the healthcheck below, which goes to
    # the same address (127.0.0.1 is not listened on with this bind —
    # verified).
    command: ["serve", "--host", "172.28.100.17", "--port", "9222"]
    # DNS/memory — symmetric to lightpanda (see the comment above).
    dns:
      - 172.28.100.10
    networks:
      crawler_net:
        ipv4_address: 172.28.100.17
    mem_limit: ${MEM_MOLI:-1gb}
    restart: unless-stopped
    # The healthcheck — /json/version, curl from the own image (unlike
    # lightpanda we build the own image ourselves and put an HTTP client
    # into it — modeled on mockserver in Dockerfile.go). The address — the
    # service's static IP: moli does not listen on 127.0.0.1 when bound to
    # a specific address. Caution: the moli address is hardcoded in three
    # places (ipv4_address, the command --host and this probe) — when
    # changing the address, change all three per the plan (docs/docker.md
    # §8).
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://172.28.100.17:9222/json/version >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s
    profiles: ["render-engines"]

  # ==========================================================================
  # Production render container (profile: runtime)
  # ==========================================================================

  render:
    # The production render mode entirely in one container: render-worker
    # starts its own Chromium (deploy/docker/Dockerfile.render). The
    # resource requirements are pinned here (T-065): mem_limit — the
    # Chromium budget ≈2 GB (spec 3.2, the docker analog of the spec 10.1
    # cgroup MemoryMax — OOM will not touch the other services);
    # shm_size/init — like the dev chromium service (spec 4.3);
    # cap_drop/no-new-privileges — an unprivileged run (§9). The Chromium
    # restart every N pages and by the RSS threshold — from inside the
    # worker (render.restart_every_pages / render.restart_memory_bytes,
    # T-065, docs/render.md); the systemd units with MemoryMax — stage 9
    # (spec 10.1). The queue cycle wiring lands with T-067; currently the
    # service starts and answers healthz.
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.render
      target: render
      args:
        GO_VERSION: ${GO_VERSION:?GO_VERSION must be set (see .env.example)}
        CHROMEDP_HEADLESS_IMAGE: ${CHROMEDP_HEADLESS_IMAGE:-chromedp/headless-shell:156.0.8078.17}
    image: crawler/render:local
    # The worker writes the content pack files to the host-bind
    # ./var/content, the directory is owned by DEV_UID on the host — while
    # the image ends with USER nobody (65534), which has no rights on the
    # bind: writes used to fail with permission denied (the app profile
    # masks the problem — there the services run as DEV_UID). Like the
    # other services, render runs as DEV_UID/DEV_GID: an unprivileged
    # non-root (spec §9/§10.1; nobody stays in the image for runs without
    # a host-bind) + cap_drop/no-new-privileges below.
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    environment:
      APP_PG_DSN: postgres://${APP_DB_USER:-crawler}:${APP_DB_PASSWORD:-dev-only-crawler}@172.28.100.2:5432/${POSTGRES_DB:-crawler}?sslmode=disable
      CRAWLER_REDIS_ADDR: 172.28.100.3:6379
      CRAWLER_CONFIG: /etc/crawler/config.render.yaml
      CRAWLER_HTTP_USER_AGENT: "${CRAWLER_USER_AGENT:-DomainCrawler/dev (+dev-environment; contact: dev@example.invalid)}"
    volumes:
      - ./deploy/docker/config.render.yaml:/etc/crawler/config.render.yaml:ro
      - ./var/content:/data/content
    # DNS — unbound: for the worker (the queues do not need names, the
    # addresses are static) and for Chromium — it resolves the container's
    # page names (spec 5.4 via unbound).
    dns:
      - 172.28.100.10
    dns_opt:
      - "ndots:1"
    networks:
      crawler_net:
        ipv4_address: 172.28.100.15
    mem_limit: ${MEM_RENDER:-2048m}
    shm_size: "1gb"
    init: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["runtime"]

  # Worker B — the Chromium fallback render (render spec stage 35 §4.5,
  # T-240): the same binary/image as render, a different build — the
  # q:render-fallback consumption stream (RENDER_WORKER_STREAM, the group —
  # the canonical pair render-fallback-worker) and the rate cap
  # render.fallback.worker_rate (FR-13: entries per the 1 min sliding
  # window — renderworker.RateWindow). The engine is chromium, its own
  # headless-shell in the container (no changes, Dockerfile.render): the
  # restarts by pages/RSS — from inside the worker (T-065), like render;
  # the T-208 recycle pair does not apply to docker renders (it is about
  # the native crawler-chromium.service unit, docs/deploy.md §2.3). The
  # resources — the same lines of the Chromium budget ≈2 GB (spec 3.2):
  # the engine is the same, the pace is lower (MEM_RENDER_FALLBACK as a
  # separate variable — bench calibration, render spec §5.1). Brought up
  # once the canary is ready (spec §4.5 item 3): until the fallback is
  # enabled it works off an empty queue — a wiring check.
  render-fallback:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.render
      target: render
      args:
        GO_VERSION: ${GO_VERSION:?GO_VERSION must be set (see .env.example)}
        CHROMEDP_HEADLESS_IMAGE: ${CHROMEDP_HEADLESS_IMAGE:-chromedp/headless-shell:156.0.8078.17}
    image: crawler/render:local
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    environment:
      APP_PG_DSN: postgres://${APP_DB_USER:-crawler}:${APP_DB_PASSWORD:-dev-only-crawler}@172.28.100.2:5432/${POSTGRES_DB:-crawler}?sslmode=disable
      CRAWLER_REDIS_ADDR: 172.28.100.3:6379
      CRAWLER_CONFIG: /etc/crawler/config.render-fallback.yaml
      # The worker B build (T-240, FR-12): the consumption stream is a
      # launch parameter (not configuration, spec §4.1 item 3); the group
      # is derived as the stream's canonical pair (queue.WorkingGroups):
      # render-fallback-worker.
      RENDER_WORKER_STREAM: q:render-fallback
      CRAWLER_HTTP_USER_AGENT: "${CRAWLER_USER_AGENT:-DomainCrawler/dev (+dev-environment; contact: dev@example.invalid)}"
    volumes:
      - ./deploy/docker/config.render-fallback.yaml:/etc/crawler/config.render-fallback.yaml:ro
      - ./var/content:/data/content
    dns:
      - 172.28.100.10
    dns_opt:
      - "ndots:1"
    networks:
      crawler_net:
        ipv4_address: 172.28.100.18
    mem_limit: ${MEM_RENDER_FALLBACK:-2048m}
    shm_size: "1gb"
    init: true
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["runtime"]

  # ==========================================================================
  # Monitoring (profile: monitoring)
  # ==========================================================================

  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.13.4}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./deploy/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      crawler_net:
        ipv4_address: 172.28.100.30
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    profiles: ["monitoring"]

  # ==========================================================================
  # Service tools (profile: tools)
  # ==========================================================================

  adminer:
    image: ${ADMINER_IMAGE:-adminer:5.5.1-standalone}
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"
    networks:
      crawler_net:
        ipv4_address: 172.28.100.31
    mem_limit: 128m
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  redis-insight:
    image: ${REDIS_INSIGHT_IMAGE:-redis/redisinsight:3.2.0}
    environment:
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: "6379"
    ports:
      - "127.0.0.1:${REDIS_INSIGHT_PORT:-5540}:5540"
    networks:
      crawler_net:
        ipv4_address: 172.28.100.32
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["tools"]

  tools:
    # A container with the Go toolchain, crawlerctl, migrate, lint.
    # Its DNS is NOT overridden (proxy.golang.org is needed for new
    # modules), so new dependencies are downloaded from here:
    # make mod-download.
    #
    # A static address is NOT set — the only exception to the address plan
    # (T-180): the make test / lint / debug runs and docker compose run are
    # ONE-OFF run containers, started in parallel from the main tree and
    # the worktrees with COMPOSE_PROJECT_NAME=crawler, i.e. into the same
    # crawler_net network; a shared static address would conflict between
    # them ("Address already in use"). The residual risk: a live run
    # container may dynamically take the address of a stopped static
    # service (the allocator hands out free addresses from the low end) —
    # the owner will not start until it finishes; the window is bounded by
    # the run container's lifetime and self-heals (--rm). Likewise
    # make debug SERVICE=<app service>: stop the service's regular
    # container before launching (dc stop <svc>), otherwise the run
    # container will not get its static address.
    <<: *go-common
    build: *go-build
    command: ["sleep", "infinity"]
    # An explicit networks (overrides the go-common anchor's flat list) for
    # the DNS aliases of the block_tracker_domains live test's tracker
    # domains (T-214, block_live_test.go): the run container serves the
    # tracker-domain probes itself — the hermetic unbound does not resolve
    # these names, and without a resolution "blocked" in the test is
    # indistinguishable from a DNS failure. The hosts are not Google
    # analytics: google domains are in Chromium's HSTS preload (the http
    # probe is force-upgraded to https and fails on TLS with the test's
    # HTTP server). The aliases apply only with the
    # `docker compose run --use-aliases` flag (without it run containers do
    # not get service aliases), live as long as the run container lives
    # (make test/lint — seconds-minutes) and act only in the dev stack;
    # parallel run containers share the names (round-robin Docker DNS) — a
    # race window of the same class as the dynamic addresses of T-180.
    networks:
      crawler_net:
        aliases:
          - c.clarity.ms
          - mc.yandex.ru
    environment:
      # On top of the shared variables — the CDP address of the dev
      # chromium for the render live tests (internal/render/*_live_test.go)
      # and the acceptance tests (accChromiumWS); the tests run in tools
      # (make test / make test-integration). The app services do not need
      # it: the worker takes the address from render.remote_url in
      # config.dev.yaml.
      <<: *go-common-env
      CHROMIUM_WS_URL: ws://172.28.100.14:9222
    volumes:
      - .:/src
      - gomodcache:/gomod
      - gocache:/gocache
      - ./deploy/docker/config.dev.yaml:/etc/crawler/config.yaml:ro
      - ./migrations:/migrations
      - ./testdata:/testdata:ro
      - ./rules:/rules:ro
      - ./var/incoming:/data/incoming
      - ./var/content:/data/content
    restart: "no"
    # The shared anchor's healthcheck is perpetually red here: tools is
    # sleep infinity, there is no metrics HTTP server in the container.
    # Disabling it — otherwise noise in dc ps and a hung up --wait if the
    # tools profile is brought up whole (T-110).
    healthcheck:
      disable: true
    # A higher limit than the services': go vet/lint/test compile all the
    # module's packages, including the heavy dependencies (go-redis,
    # chromedp, prometheus).
    mem_limit: 2g
    profiles: ["tools"]

networks:
  crawler_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.100.0/24

volumes:
  pg_data:
  caddy_data:
  caddy_config:
  prom_data:
  gomodcache:
  gocache:
