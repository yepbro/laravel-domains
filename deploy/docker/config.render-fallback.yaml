# The worker B configuration — the Chromium fallback render (render spec
# stage 35 §4.5, T-240): the same render-worker binary, a different
# configuration build. Differences from the production profile
# config.render.yaml:
#   - the q:render-fallback consumption stream and the
#     render-fallback-worker group — the
#     RENDER_WORKER_STREAM=q:render-fallback build variable in the
#     render-fallback service (compose) / the crawler-render-fallback-worker
#     unit (systemd): the consumption stream is a worker build parameter,
#     not a configuration field (spec §4.1 item 3, T-236); the group is the
#     stream's canonical pair of queue.WorkingGroups, it is not set
#     separately;
#   - the pace — render.fallback.worker_rate (FR-13): no more entries than
#     the renderworker.RateWindow = 1 min sliding window — the "collect and
#     rework" batch mode without scaling up chromium capacity; it applies
#     with the fallback disabled too (the accumulated backlog is reworked
#     to empty, FR-14).
# The engine is chromium, remote_url is empty — its own headless-shell
# process (today's render image, no changes); the DB/queue addresses come
# via environment variables (APP_PG_DSN, CRAWLER_REDIS_ADDR — see
# compose.yaml).

postgres:
  dsn: "" # set by APP_PG_DSN from compose.yaml

render:
  # Worker B is always on chromium (spec §4.5 item 1): it reworks the
  # engine-dependent failures of the main engine — a recursive fallback is
  # forbidden (FR-10).
  engine: chromium
  remote_url: "" # its own headless-shell process (production mode, Dockerfile.render)
  contexts: 8 # like the main render: pool slots simply sit underloaded as the rate cap
  timeout: "25s"
  restart_every_pages: 500
  # The RSS restart threshold (T-065) — like the main render: a restart
  # before cgroup-OOM (the budget ≈2 GB, spec 3.2); the rationale —
  # docs/render.md, the "Browser restart" section.
  restart_memory_bytes: "1536MiB"
  fallback:
    # The publication flag: worker B is indifferent to it (publishFallback
    # publishes only from the q:render stream — recursion forbidden,
    # FR-10); here it documents the circuit: disabling the feature (FR-14)
    # is done by the flag of the PRIMARY worker's config, this worker will
    # rework whatever accumulated in q:render-fallback to empty.
    enabled: true
    # The rate cap — the only field by which the B build differs
    # behaviorally: entries per the 1 min sliding window (renderworker.
    # RateWindow). The default 100 ≈ the full capacity of one chromium
    # (8 contexts × ~5 s/page ≈ 1.6 pages/s) — a starting value, calibrated
    # by a bench run (spec §4.4 item 4).
    worker_rate: 100
