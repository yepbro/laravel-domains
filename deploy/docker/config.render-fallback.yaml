# Конфигурация воркера B — фолбэк-рендер на Chromium (ТЗР этапа 35 §4.5,
# T-240): тот же бинарь render-worker другой сборкой конфигурации.
# Отличия от боевого профиля config.render.yaml:
#   - стрим потребления q:render-fallback и группа render-fallback-worker —
#     переменная сборки RENDER_WORKER_STREAM=q:render-fallback в сервисе
#     render-fallback (compose) / юните crawler-render-fallback-worker
#     (systemd): стрим потребления — параметр сборки воркера, не поля
#     конфигурации (ТЗ §4.1 п.3, T-236); группа — каноническая пара стрима
#     queue.WorkingGroups, отдельно её не задают;
#   - темп — render.fallback.worker_rate (ФТ-13): не больше записей за
#     скользящее окно renderworker.RateWindow = 1 мин — батч-режим
#     «собрать и доработать» без наращивания chromium-мощности; действует
#     и при выключенном фолбэке (накопленное дорабатывается до пуста,
#     ФТ-14).
# Движок chromium, remote_url пуст — собственный процесс headless-shell
# (сегодняшний render-образ, без изменений); адреса БД/очереди приходят
# переменными окружения (APP_PG_DSN, CRAWLER_REDIS_ADDR — см. compose.yaml).

postgres:
  dsn: "" # задаётся APP_PG_DSN из compose.yaml

render:
  # Воркер B всегда на chromium (ТЗ §4.5 п.1): дорабатывает движко-
  # зависимые сбои основного движка — рекурсивный фолбэк запрещён (ФТ-10).
  engine: chromium
  remote_url: "" # собственный процесс headless-shell (боевой режим, Dockerfile.render)
  contexts: 8 # как у основного render: слоты пула потолком темпа просто недогружаются
  timeout: "25s"
  restart_every_pages: 500
  # Порог перезапуска по RSS (T-065) — как у основного render: перезапуск
  # до cgroup-OOM (бюджет ≈2 ГБ, ТЗ 3.2); обоснование — docs/render.md,
  # раздел «Перезапуск браузера».
  restart_memory_bytes: "1536MiB"
  fallback:
    # Флаг публикации: воркеру B безразличен (publishFallback публикует
    # только из стрима q:render — рекурсия запрещена, ФТ-10), здесь —
    # документация контура: выключение фичи (ФТ-14) — флагом конфига
    # ПЕРВИЧНОГО воркера, накопленное в q:render-fallback этот воркер
    # доработает до пуста.
    enabled: true
    # Потолок темпа — единственное поле, которым сборка B отличается
    # поведенчески: записей за скользящее окно 1 мин (renderworker.
    # RateWindow). Дефолт 100 ≈ полной мощности одного chromium
    # (8 контекстов × ~5 с/страница ≈ 1,6 стр/с) — стартовое значение,
    # калибруется стендовым прогоном (ТЗ §4.4 п.4).
    worker_rate: 100
