# Prometheus (dev) — metric scraping for all the project's services.
# The app services are discovered via docker DNS (dns_sd), so prometheus
# itself has no DNS override.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: dev

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: monitor
    dns_sd_configs:
      - names: ["monitor"]
        port: 9100
        type: A

  - job_name: ingest
    dns_sd_configs:
      - names: ["ingest"]
        port: 9101
        type: A

  - job_name: scheduler
    dns_sd_configs:
      - names: ["scheduler"]
        port: 9102
        type: A

  - job_name: dns-worker
    dns_sd_configs:
      - names: ["dns-worker"]
        port: 9103
        type: A

  - job_name: http-worker
    dns_sd_configs:
      - names: ["http-worker"]
        port: 9104
        type: A

  - job_name: render-worker
    dns_sd_configs:
      - names: ["render-worker"]
        port: 9105
        type: A

  # The fallback worker B (T-240, S-P3-3): a runtime profile container —
  # metrics on the binary's standard port 9105 inside its own network
  # namespace (docker.md §8). While the profile is not up, dns_sd has no
  # targets — the job stays silent and comes alive together with the
  # render-fallback service (crawler_service_up, consumed/depth for the
  # published/consumed balance — services.md, "working-logic metrics").
  - job_name: render-fallback
    dns_sd_configs:
      - names: ["render-fallback"]
        port: 9105
        type: A

  - job_name: analyzer
    dns_sd_configs:
      - names: ["analyzer"]
        port: 9106
        type: A

  - job_name: web
    dns_sd_configs:
      - names: ["web"]
        port: 9107
        type: A

  - job_name: dashboard
    dns_sd_configs:
      - names: ["dashboard"]
        port: 9108
        type: A

  - job_name: mockserver
    dns_sd_configs:
      - names: ["mockserver"]
        port: 8080
        type: A

  - job_name: coredns
    dns_sd_configs:
      - names: ["coredns"]
        port: 9153
        type: A
