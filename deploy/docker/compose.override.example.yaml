# Template of local compose overrides.
# Copy it to deploy/docker/compose.override.yaml (gitignored) and edit to
# taste. The file is picked up automatically when compose runs from the
# deploy/docker directory; when running via the Makefile, add the path
# explicitly:
#   make up COMPOSE="docker compose --project-directory . \
#     -f deploy/docker/compose.yaml -f deploy/docker/compose.override.yaml \
#     --env-file .env"
#
# Typical examples — uncomment what you need.

services:

  # Debugging a chosen service under delve (make debug SERVICE=dns-worker):
  # the service is rebuilt and starts under the debugger on 127.0.0.1:2345.
  dns-worker:
    environment:
      SERVICE: dns-worker
      METRICS_PORT: "9103"
    ports:
      - "127.0.0.1:2345:2345"
    command:
      - dlv
      - debug
      - ./cmd/dns-worker
      - --headless
      - --listen=0.0.0.0:2345
      - --api-version=2
      - --accept-multiclient
    # under the debugger there is no need to restart on failure
    restart: "no"

  # Lower limits for a weak machine:
  # postgres:
  #   mem_limit: 768m

  # Publishing additional ports:
  # http-worker:
  #   ports:
  #     - "127.0.0.1:9104:9104"
