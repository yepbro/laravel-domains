# PostgreSQL 16 — dev configuration.
# Parameters are reduced for dev, but the key settings of the production schema
# are kept: synchronous_commit=off, random_page_cost=1.1, effective_io_concurrency=200 (NVMe).
listen_addresses = '*'
# 130: the service stack (~30 pools) + parallel test runs (make test in
# subagent worktrees + make test-integration in the main tree) — at 60 the
# integration tests on isolated schemas hit 53300 (slots exhausted).
max_connections = 130
shared_buffers = 512MB
work_mem = 16MB
maintenance_work_mem = 128MB
dynamic_shared_memory_type = posix

# WAL / checkpoints
synchronous_commit = off
max_wal_size = 1GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9
wal_compression = on

# Planner for NVMe
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# autovacuum: frequent updates of domains / subdomain_results
autovacuum = on
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# Monitoring
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
track_functions = pl

# Logs
log_min_messages = warning
# As in production (T-177): statements longer than 3 s go to the server log;
# the threshold mirrors the monitor loop (monitor.slow_query_min_duration).
log_min_duration_statement = 3000
# As in production (T-192): a lock wait longer than deadlock_timeout (1 s) —
# a "process N still waiting …" line in the log (the convoy holder's name).
log_lock_waits = on
log_timezone = 'UTC'
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
