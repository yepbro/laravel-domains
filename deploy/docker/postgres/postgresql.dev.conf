# PostgreSQL 16 — dev-конфигурация.
# Параметры уменьшены под dev, но ключевые настройки боевой схемы сохранены:
# synchronous_commit=off, random_page_cost=1.1, effective_io_concurrency=200 (NVMe).
listen_addresses = '*'
# 130: стек сервисов (~30 пулов) + параллельные прогоны тестов (make test в
# worktree субагентов + make test-integration в основном дереве) — при 60
# интеграционные тесты на изолированных схемах ловили 53300 (слоты исчерпаны).
max_connections = 130
shared_buffers = 512MB
work_mem = 16MB
maintenance_work_mem = 128MB
dynamic_shared_memory_type = posix

# WAL / чекпойнты
synchronous_commit = off
max_wal_size = 1GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9
wal_compression = on

# Планировщик под NVMe
random_page_cost = 1.1
effective_io_concurrency = 200
default_statistics_target = 100

# autovacuum: частые обновления domains / subdomain_results
autovacuum = on
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# Мониторинг
shared_preload_libraries = 'pg_stat_statements'
track_io_timing = on
track_functions = pl

# Логи
log_min_messages = warning
# Как в бою (T-177): операторы дольше 3 с — в журнал сервера; порог
# дублирует цикл monitor (monitor.slow_query_min_duration).
log_min_duration_statement = 3000
# Как в бою (T-192): ожидание лока дольше deadlock_timeout (1 с) —
# строка «process N still waiting …» в журнале (имя держателя конвоя).
log_lock_waits = on
log_timezone = 'UTC'
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
