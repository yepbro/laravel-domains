# Unbound — the testbed mode (the default).
# All traffic is forwarded to coredns (172.28.100.11), which answers
# authoritatively for the test zones and returns REFUSED for everything else.
# Nothing leaves for the outside.
server:
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    chroot: ""
    username: "unbound"
    directory: ""
    pidfile: ""
    access-control: 127.0.0.0/8 allow
    access-control: 172.28.100.0/24 allow
    # .test — a zone reserved by RFC 6761: by default unbound keeps an empty
    # static zone for it (an instant NXDOMAIN). Disabling it so the queries
    # are forwarded to coredns.
    local-zone: "test." nodefault
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    qname-minimisation: yes
    prefetch: yes
    # The cache is minimal: the testbed load is integration tests, a large cache
    # is not needed; ~116 MB in total — a margin for any MEM_UNBOUND (including 256m
    # for weak machines). The production cache size — in unbound.internet.conf.
    msg-cache-size: 32m
    rrset-cache-size: 64m
    key-cache-size: 16m
    neg-cache-size: 4m
    infra-cache-numhosts: 10000
    outbound-msg-retry: 2
    max-sent-count: 4

# Forwarding everything to coredns; the test zones are served by the coredns
# file plugin, the rest gets REFUSED from the template plugin of the root Corefile block.
forward-zone:
    name: "."
    forward-addr: 172.28.100.11
    forward-first: no
