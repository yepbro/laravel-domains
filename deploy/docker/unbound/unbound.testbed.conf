# Unbound — режим testbed (по умолчанию).
# Весь трафик форвардится в coredns (172.28.100.11), который авторитетно отвечает
# за тестовые зоны, а на всё остальное возвращает REFUSED. Наружу ничего не уходит.
server:
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    chroot: ""
    username: "unbound"
    directory: ""
    pidfile: ""
    access-control: 127.0.0.0/8 allow
    access-control: 172.28.100.0/24 allow
    # .test — зарезервированная зона RFC 6761: unbound по умолчанию держит
    # для неё пустую static-зону (мгновенный NXDOMAIN). Отключаем, чтобы
    # запросы уходили в forward на coredns.
    local-zone: "test." nodefault
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    qname-minimisation: yes
    prefetch: yes
    # Кэш уменьшен под dev-лимит памяти 256 МБ (ТЗ 4.1)
    msg-cache-size: 32m
    rrset-cache-size: 64m
    key-cache-size: 16m
    neg-cache-size: 4m
    outbound-msg-retry: 2
    max-sent-count: 4

# Форвард всего в coredns; тестовые зоны обслуживает file-плагин coredns,
# остальное получает REFUSED от template-плагина корневого блока Corefile.
forward-zone:
    name: "."
    forward-addr: 172.28.100.11
    forward-first: no
