# Unbound — режим internet (включается ТОЛЬКО make up-internet при ALLOW_INTERNET=1).
# Обычная рекурсия с корневых серверов. Тестовые зоны .test в реальном DNS
# не существуют и будут резолвиться как NXDOMAIN.
server:
    verbosity: 1
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    chroot: ""
    username: "unbound"
    directory: ""
    pidfile: ""
    access-control: 127.0.0.0/8 allow
    access-control: 172.28.100.0/24 allow
    # .test (RFC 6761): отключаем встроенную static-зону, поведение обычное.
    local-zone: "test." nodefault
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    qname-minimisation: yes
    prefetch: yes
    msg-cache-size: 32m
    rrset-cache-size: 64m
    key-cache-size: 16m
    neg-cache-size: 4m
    outbound-msg-retry: 2
    max-sent-count: 4
    # Валидатор DNSSEC отключён: root.key требует записи в /var/lib/unbound,
    # для dev это избыточно. module-config по умолчанию включает validator —
    # заменяем на чистый iterator.
    module-config: "iterator"
