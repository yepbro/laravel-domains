# Unbound — the internet mode (enabled ONLY by make up-internet with ALLOW_INTERNET=1).
# Full recursion from the root servers (spec 5.4). The .test test zones do not
# exist in the real DNS and resolve as NXDOMAIN.
#
# Public resolvers are deliberately NOT added here: a forward-zone with name "."
# intercepts all queries and makes the forwarders primary, while forward-first: yes
# changes only the failure direction (a SERVFAIL from the forwarder → unbound's own
# recursion); the reverse direction "recursion → the forwarder on SERVFAIL" does not
# exist in unbound. Sending the whole crawl through 1.1.1.1/9.9.9.9 as the first route
# would contradict spec 5.4 ("fallback only") and devalue the local cache. The fallback
# lives in the dns-worker client: on a SERVFAIL/timeout of the local unbound the query
# is repeated directly to dns.fallback_resolvers (internal/dnsclient, T-034).
# The rationale and the memory parameters — docs/docker.md, the "Unbound" section.
server:
    verbosity: 1
    # 2 threads for the crawler's load (dns.concurrency 2000, max_qps 10000);
    # the per-thread overhead is a few MB, within the limit margin (see below).
    num-threads: 2
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    chroot: ""
    username: "unbound"
    directory: ""
    pidfile: ""
    access-control: 127.0.0.0/8 allow
    access-control: 172.28.100.0/24 allow
    # .test (RFC 6761): the built-in static zone is disabled, the behavior is the usual one.
    local-zone: "test." nodefault
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    qname-minimisation: yes
    # Prefetch (spec 5.4): a record requested with less than 10% of its TTL left
    # is refreshed before it expires — popular records do not fall out of the cache.
    prefetch: yes
    # The cache — the spec 3.2 budget (Unbound ≈ 0.7 GB) within the spec 5.4 window
    # (512–768 MB), the container limit MEM_UNBOUND=700m (mem_limit in compose — an
    # analog of MemoryMax from spec 10.1). The sum of the caches ≈ 532 MB + ~10 MB
    # of infra cache, the remainder ≈ 160 MB — the process, thread buffers, allocator
    # fragmentation. rrset ≈ 3× msg — the NLnet Labs recommendation (2–4× msg-cache-size).
    msg-cache-size: 128m
    rrset-cache-size: 384m
    # The DNSSEC validator is disabled (module-config below) — key-cache is unused.
    key-cache-size: 4m
    # The crawler sees NXDOMAIN en masse — the negative cache is larger than the 1m default.
    neg-cache-size: 16m
    # RTT/timeout statistics of NS: the crawler meets millions of delegations;
    # the 10,000-host default is small; ~100 bytes per host ≈ 10 MB.
    infra-cache-numhosts: 100000
    outbound-msg-retry: 2
    max-sent-count: 4
    # The DNSSEC validator is disabled: root.key requires records in /var/lib/unbound,
    # and the crawler does not need signature checks. The default module-config includes
    # the validator — replaced with the plain iterator.
    module-config: "iterator"
