# Unbound — режим internet (включается ТОЛЬКО make up-internet при ALLOW_INTERNET=1).
# Полноценная рекурсия с корневых серверов (ТЗ 5.4). Тестовые зоны .test в реальном
# DNS не существуют и резолвятся как NXDOMAIN.
#
# Публичные резолверы сюда НАМЕРЕННО не добавлены: forward-zone с name "."
# перехватывает все запросы и делает форвардеры первичными, а forward-first: yes
# меняет только направление отказа (SERVFAIL форвардера → собственная рекурсия
# unbound); обратного направления «рекурсия → форвардер при SERVFAIL» в unbound
# нет. Пропускать весь crawl через 1.1.1.1/9.9.9.9 первым маршрутом противоречило
# бы ТЗ 5.4 («только как fallback») и обесценивало локальный кэш. Fallback живёт
# на клиенте dns-worker: при SERVFAIL/таймауте локального unbound запрос
# повторяется напрямую в dns.fallback_resolvers (internal/dnsclient, T-034).
# Обоснование и параметры памяти — docs/docker.md, раздел «Unbound».
server:
    verbosity: 1
    # 2 потока под нагрузку краулера (dns.concurrency 2000, max_qps 10000);
    # накладные расходы на поток — единицы МБ, в запасе лимита (см. ниже).
    num-threads: 2
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    chroot: ""
    username: "unbound"
    directory: ""
    pidfile: ""
    access-control: 127.0.0.0/8 allow
    access-control: 172.28.100.0/24 allow
    # .test (RFC 6761): отключаем встроенную static-зону, поведение обычное.
    local-zone: "test." nodefault
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    qname-minimisation: yes
    # Prefetch (ТЗ 5.4): запись, запрошенная при остатке TTL < 10%, обновляется
    # до истечения срока — популярные записи не выпадают из кэша.
    prefetch: yes
    # Кэш — бюджет ТЗ 3.2 (Unbound ≈ 0,7 ГБ) в окне ТЗ 5.4 (512–768 МБ),
    # лимит контейнера MEM_UNBOUND=700m (mem_limit в compose — аналог
    # MemoryMax из ТЗ 10.1). Сумма кэшей ≈ 532 МБ + ~10 МБ infra-кэша,
    # остаток ≈ 160 МБ — процесс, буферы потоков, фрагментация аллокатора.
    # rrset ≈ 3× msg — рекомендация NLnet Labs (2–4× msg-cache-size).
    msg-cache-size: 128m
    rrset-cache-size: 384m
    # Валидатор DNSSEC отключён (module-config ниже) — key-cache не используется.
    key-cache-size: 4m
    # Краулер встречает массово NXDOMAIN — отрицательный кэш больше дефолтного 1m.
    neg-cache-size: 16m
    # RTT/timeout-статистика NS: у краулера миллионы делегаций, дефолт 10 000
    # хостов мал; ~100 байт на хост ≈ 10 МБ.
    infra-cache-numhosts: 100000
    outbound-msg-retry: 2
    max-sent-count: 4
    # Валидатор DNSSEC отключён: root.key требует записей в /var/lib/unbound,
    # краулеру проверка подписей не нужна. module-config по умолчанию включает
    # validator — заменяем на чистый iterator.
    module-config: "iterator"
