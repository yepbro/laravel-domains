# Access of the monitor service's NVMe wear alert to /dev/nvme* (T-089, spec §10.3).
#
# The nvme-smart group is assigned to the controller nodes by the udev rule
# deploy/smartd/99-crawler-nvme.rules. Without access the nvme_wear alert
# (internal/monitor/alerts.go, T-080) honestly reports "not measured", and the
# percentage_used/TBW threshold remains only with smartd — which in smartmontools
# 7.4 (Ubuntu 24.04 LTS) does not keep it (docs/disks.md, the "monitor layer").
# Installation and rollback instructions — deploy/smartd/README.md.

[Service]
SupplementaryGroups=nvme-smart
