# Доступ алерта износа NVMe сервиса monitor к /dev/nvme* (T-089, ТЗ §10.3).
#
# Группу nvme-smart узлам контроллеров назначает udev-правило
# deploy/smartd/99-crawler-nvme.rules. Без доступа алерт nvme_wear
# (internal/monitor/alerts.go, T-080) честно «не измеряется», и порог
# percentage_used/TBW остаётся только у smartd — который в smartmontools
# 7.4 (Ubuntu 24.04 LTS) его не держит (docs/disks.md, «Слой monitor»).
# Инструкция установки и отката — deploy/smartd/README.md.

[Service]
SupplementaryGroups=nvme-smart
