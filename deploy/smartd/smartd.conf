# Domain Crawler — SMART/TBW monitoring of NVMe drives (T-089, spec §10.3).
#
# Installed as /etc/smartd.conf on top of the smartmontools package sample
# (the instructions — README.md nearby; the rationale, the TBW estimate from
# the load and the link to the monitoring alert — docs/disks.md, the
# "SMART and TBW monitoring" section).
#
# DEVICESCAN -d nvme — NVMe drives only: per spec §3.1 the whole server runs
# on a single NVMe. Debian/Ubuntu builds exclude NVMe from the plain
# DEVICESCAN, so the type is given explicitly; a second controller appearing
# later will be picked up automatically.
#
# The checks (identical for NVMe in smartmontools 7.4 and 7.5; the semantics —
# man smartd.conf(5)):
#   -H        Critical Warning from the health log: any set bit means a
#             LOG_CRIT entry and a handler call. The bits — available spare
#             below the threshold, temperature out of range, reliability
#             degradation, media in read-only: harbingers of resource
#             exhaustion and drive death.
#   -l error  the growth of "Error Information Log Entries" (media/integrity
#             errors land in the NVMe error log; since 7.4 LOG_CRIT is set
#             only for device-related errors — firmware service records do
#             not scare the operator).
#   -W 4,45,60 temperature (Composite Temperature): a report on a change of
#             ≥4 °C, LOG_INFO at ≥45 °C, LOG_CRIT at ≥60 °C —
#             throttling of typical NVMe starts around 70–80 °C; 60 °C is a
#             reason to open up and clean the server.
#
# Warnings: mail is not used (-m <nomailer> — there is no MTA on the server,
# spec §5.9 does not require mail) — the /usr/local/lib/crawler/
# smartd-warning.sh handler writes an entry to syslog/journald (the smartd
# tag), the same stream as the crawler services: journalctl -t smartd
# (docs/deploy.md §5). smartd itself duplicates firings to syslog directly;
# the handler adds a structured entry (device, type, first firing) and remains
# the hookup point for future alert channels without editing this config.
DEVICESCAN -d nvme -H -l error -W 4,45,60 -m <nomailer> -M exec /usr/local/lib/crawler/smartd-warning.sh

# smartmontools ≥ 7.5 (Debian 13+, recent Ubuntu; Ubuntu 24.04 LTS has 7.4):
# instead of the line above uncomment the next one — the experimental NVMe
# checks are added: -f — "Percentage Used" exceeded 95% or "Media and Data
# Integrity Errors" grew; -p — a change of "Available Spare" (LOG_CRIT when
# below the device's threshold). Up to 95% of the resource the percentage_used
# threshold (90%) and the TBW details are held by the monitoring alert —
# docs/disks.md, the "monitor layer": it is mandatory on 7.4, duplicates on 7.5.
#DEVICESCAN -d nvme -H -l error -f -p -W 4,45,60 -m <nomailer> -M exec /usr/local/lib/crawler/smartd-warning.sh
