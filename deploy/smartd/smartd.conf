# Domain Crawler — мониторинг SMART/TBW накопителей NVMe (T-089, ТЗ §10.3).
#
# Устанавливается как /etc/smartd.conf поверх образца пакета smartmontools
# (инструкция — README.md рядом; обоснование, оценка TBW от нагрузки и связь
# с алертом мониторинга — docs/disks.md, раздел «Мониторинг SMART и TBW»).
#
# DEVICESCAN -d nvme — только накопители NVMe: по ТЗ §3.1 весь сервер живёт
# на одной NVMe. Сборки Debian/Ubuntu исключают NVMe из обычного DEVICESCAN,
# поэтому тип указывается явно; появившийся второй контроллер подхватится
# автоматически.
#
# Проверки (для NVMe одинаковы в smartmontools 7.4 и 7.5; семантика —
# man smartd.conf(5)):
#   -H        Critical Warning из health-лога: любой установленный бит —
#             запись LOG_CRIT и вызов обработчика. Биты — available spare
#             ниже порога, температура вне диапазона, деградация
#             надёжности, носитель в read-only: предвестники исчерпания
#             ресурса и смерти накопителя.
#   -l error  рост «Error Information Log Entries» (media/integrity-ошибки
#             попадают в журнал ошибок NVMe; с 7.4 LOG_CRIT ставится только
#             по ошибкам, относящимся к устройству, — служебные записи
#             прошивки не пугают оператора).
#   -W 4,45,60 температура (Composite Temperature): отчёт при изменении
#             на ≥4 °C, LOG_INFO при ≥45 °C, LOG_CRIT при ≥60 °C —
#             троттлинг типичных NVMe начинается около 70–80 °C, 60 °C —
#             повод разобрать и почистить сервер.
#
# Предупреждения: почта не используется (-m <nomailer> — MTA на сервере нет,
# ТЗ §5.9 почту не требует) — обработчик /usr/local/lib/crawler/
# smartd-warning.sh пишет запись в syslog/journald (тег smartd), в ту же
# ленту, что и сервисы краулера: journalctl -t smartd (docs/deploy.md §5).
# Сам smartd дублирует срабатывания в syslog напрямую; обработчик добавляет
# структурированную запись (устройство, тип, первое срабатывание) и остаётся
# точкой подключения будущих каналов оповещения без правки этого конфига.
DEVICESCAN -d nvme -H -l error -W 4,45,60 -m <nomailer> -M exec /usr/local/lib/crawler/smartd-warning.sh

# smartmontools ≥ 7.5 (Debian 13+, свежие Ubuntu; в Ubuntu 24.04 LTS — 7.4):
# вместо строки выше раскомментируйте следующую — добавляются
# экспериментальные проверки NVMe: -f — «Percentage Used» превысил 95 % или
# выросло «Media and Data Integrity Errors»; -p — изменение «Available
# Spare» (LOG_CRIT при значении ниже порога устройства). До 95 % ресурса
# порог percentage_used (90 %) и TBW в деталях держит алерт мониторинга —
# docs/disks.md, «Слой monitor»: на 7.4 он обязателен, на 7.5 дублирует.
#DEVICESCAN -d nvme -H -l error -f -p -W 4,45,60 -m <nomailer> -M exec /usr/local/lib/crawler/smartd-warning.sh
