name: deploy

# CD-конвейер (T-135): деплой боевого сервера 155.212.174.88 после зелёного
# ci на master. Запускается workflow_run по завершении ci (деплоится ровно
# тот SHA, что протестирован) или вручную workflow_dispatch.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: build · upload · restart · healthz · rollback
    # Только успех ci на push в master (или ручной запуск)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SSH_HOST: root@155.212.174.88
      SSH_OPTS: -o UserKnownHostsFile=known_hosts.txt -o ConnectTimeout=15
    steps:
      - uses: actions/checkout@v7
        with:
          # Полная история и теги: git describe (версия деплоя — в
          # бинарниках и извещении) ищет ближайший тег обходом истории,
          # которого нет в shallow-клоне с depth 1.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Подготовить .env (версия Tailwind/Alpine для web-css)
        id: env
        run: cp .env.example .env

      - name: Собрать CSS лендинга (go:embed, deploy.md §4.2)
        id: web-css
        run: make web-css

      - name: Собрать статические бинарники
        id: build
        run: |
          version="$(git describe --tags --always --dirty 2>/dev/null || echo unknown)"
          revision="$(git rev-parse --short HEAD)"
          mkdir -p out
          for svc in ingest scheduler dns-worker http-worker render-worker analyzer monitor web dashboard crawlerctl; do
            CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X crawler/internal/metrics.buildMode=prod -X crawler/internal/metrics.buildVersion=$version -X crawler/internal/metrics.buildRevision=$revision" \
              -o "out/$svc" "./cmd/$svc"
          done
          echo "version=$version revision=$revision" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Скрипт Telegram-извещений едет с набором (T-162/T-173):
          # monitor ждёт его в /opt/crawler/bin (alerts.telegram_script);
          # ручная установка не переживает деплой — install пересоздаёт
          # каталог из архива. install chmod 0755 гарантирует бит запуска.
          cp deploy/telegram-notify.sh out/telegram-notify.sh
          tar -C out -czf binaries.tar.gz .

      - name: Настроить SSH
        id: ssh
        run: |
          install -m 600 /dev/null id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > known_hosts.txt

      # scp и установка — отдельные шаги, чтобы извещение Telegram честно
      # отделяло провал до начала установки (отката нет) от провала
      # установки (откат): см. шаг «Извещение Telegram» ниже.
      - name: Загрузить бинарники (scp)
        id: upload
        run: scp $SSH_OPTS -i id_ed25519 binaries.tar.gz "$SSH_HOST:/tmp/crawler-deploy.tar.gz"

      # Откат — trap в deploy-install.sh: активен после успешной остановки
      # набора до успешного старта. Исход отражён в коде выхода (см. шапку
      # deploy-install.sh): провал этого шага = trap-откат выполнен, а
      # особые коды (T-137): 4 — нет архива, 7 — сбой подготовки бэкапа
      # (bin не тронут, набор перезапущен), 3/8 — состояние юнитов
      # требует проверки, 5 — откат выполнен, но набор не весь, 6 — откат
      # не удался, 255 (транспорт ssh: удалённый скрипт мог дойти до
      # любого места) — состояние сервера неизвестно.
      - name: Установить на сервер
        id: install
        run: |
          set +e
          ssh $SSH_OPTS -i id_ed25519 "$SSH_HOST" 'bash -s' -- < deploy/deploy-install.sh
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # Healthcheck только проверяет (T-135); откат по его провалу —
      # следующий шаг (T-137, ТЗ §10.4 «healthcheck с автоматическим
      # откатом»). rc шага различает провал проверки (1) от транспорта
      # ssh (255) и сбоя разбора скрипта (2): последние — состояние
      # сервера неизвестно, деструктивный откат не запускается.
      - name: Проверить живость (healthz всех сервисов)
        id: healthcheck
        run: |
          set +e
          ssh $SSH_OPTS -i id_ed25519 "$SSH_HOST" 'bash -s' -- < deploy/deploy-healthcheck.sh
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # Автоматический откат по провалу healthcheck (T-137, ТЗ §10.4):
      # stop → восстановление /opt/crawler/bin.prev → start (со сбросом
      # start-limit юнитов). Только провал healthcheck: провал install
      # уже откачен trap'ом самого install-шага, более ранние шаги
      # (сборка, scp) сервера не касаются. Идёт ДО диагностики: быстрый
      # возврат рабочей версии важнее сбора логов (логи новой версии
      # остаются в journalctl). Коды deploy-rollback.sh → result для
      # извещения ниже; rc=255 (транспорт ssh) и rc=2 (bash не выполнил
      # скрипт) → unknown — состояние сервера неизвестно. Шаг красит ран
      # при неполном успехе (юниты не все active / откат не удался):
      # pick() в извещении называет healthcheck — корень провала,
      # детали отката — в строке «Откат: …».
      - name: Откат (при провале healthcheck)
        id: rollback
        # Только подтверждённый провал проверки (rc=1): 255 (транспорт
        # ssh) и 2 (сбой разбора скрипта) означают, что проверка не
        # завершилась — состояние неизвестно, откат не запускается
        # (извещение «откат неизвестен»).
        if: failure() && steps.healthcheck.outcome == 'failure' && steps.healthcheck.outputs.rc == '1'
        run: |
          set +e
          ssh $SSH_OPTS -i id_ed25519 "$SSH_HOST" 'bash -s' -- < deploy/deploy-rollback.sh
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0)   result=performed;           note='откат выполнен, все юниты active' ;;
            1)   result=performed-degraded;  note='откат выполнен, но не все юниты active' ;;
            3)   result=failed;              note='откат не удался — требуется оператор' ;;
            4)   result=nothing-to-rollback; note='bin.prev отсутствует — откатывать нечего' ;;
            255) result=unknown;             note='ssh-транспорт (rc=255) — состояние сервера неизвестно' ;;
            2)   result=unknown;             note='скрипт не выполнился (bash rc=2) — состояние сервера неизвестно' ;;
            *)   result=failed;              note="неожидаемый код $rc" ;;
          esac
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "rollback: $note"
          case "$result" in
            performed|nothing-to-rollback) exit 0 ;;
            *) exit 1 ;;
          esac

      # Диагностика при провале — ПОСЛЕ отката (приоритет возврата рабочей
      # версии; логи упавшей новой версии остаются в journalctl). Сервер
      # либо откачен (trap install-шага или шаг rollback), либо откат
      # не удался/невозможен — детали в извещении Telegram ниже.
      - name: Диагностика (при падении)
        if: failure()
        run: |
          ssh $SSH_OPTS -i id_ed25519 "$SSH_HOST" \
            "systemctl list-units 'crawler-*' --no-legend; journalctl -u 'crawler-*' --no-pager --since '-30 min' -n 200" \
            || true

      # Извещение Telegram (ТЗ §10.4): успех и провал деплоя — одно
      # сообщение на ран; ручной workflow_dispatch — штатный деплой,
      # тоже извещается (в отличие от ручных прогонов ci). Отменённый
      # ран (job.status=cancelled, включая таймаут job'а) извещается как
      # неуспешный: состояние сервера в этот момент может быть любым.
      # Версия — из шага сборки (тот же git describe, что в бинарниках),
      # с пересчётом по чекауту, если шаг не успел; до сборки версии
      # нет — строка опускается. Факт отката (T-137) — по кодам шагов:
      # установка: 4/7 — сервер/bin не тронуты (строки про откат нет),
      # 3 и 255, отмена — неизвестно, 5 — trap-откат выполнен, но набор
      # не весь, 6 — trap-откат не удался, прочее — trap-откат выполнен;
      # healthcheck: результат шага rollback выше — выполнен / выполнен,
      # но не все юниты active / откатывать нечего (bin.prev нет) /
      # не удался / неизвестно (шаг не завершился или healthcheck не
      # завершился сам — отмена рана, потеря связи, rc=255/2). Провал до
      # установки → строки про откат нет. Сбой отправки не красит ран:
      # continue-on-error.
      - name: Извещение Telegram
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          status=fail
          event="Деплой не успешен"
          if [ "$JOB_STATUS" = success ]; then
            status=ok
            event="Деплой успешен"
          elif [ "$JOB_STATUS" = cancelled ]; then
            event="Деплой не успешен (ран отменён)"
          fi
          # Имена шагов ниже синхронизировать с name: шагов выше.
          # pick: failure|cancelled → запомнить имя шага (отменённый
          # in-flight шаг — тоже виновник).
          pick() {
            case "$1" in failure|cancelled) step="$2"; return 0 ;; *) return 1 ;; esac
          }
          step="вне основных шагов деплоя (см. лог рана)"
          rollback=""
          if pick "${{ steps.web-css.outcome }}" "Собрать CSS лендинга (go:embed, deploy.md §4.2)"; then :
          elif pick "${{ steps.build.outcome }}" "Собрать статические бинарники"; then :
          elif pick "${{ steps.ssh.outcome }}" "Настроить SSH"; then :
          elif pick "${{ steps.upload.outcome }}" "Загрузить бинарники (scp)"; then :
          elif pick "${{ steps.install.outcome }}" "Установить на сервер"; then
            # Коды deploy-install.sh (T-137): 4 — нет архива и 7 — сбой
            # подготовки бэкапа (bin не тронут, набор перезапущен) →
            # строки про откат нет; 3 — не остановился набор, 255 —
            # транспорт ssh, 8 — не поднял остановленный набор →
            # состояние требует проверки; 5 — trap-откат выполнен, но
            # набор не весь; 6 — trap-откат не удался; прочие (включая 2:
            # его дают и bash при сбое разбора, и tar при битом архиве) —
            # сбой внутри установки: trap откатил на bin.prev.
            if [ "${{ steps.install.outcome }}" = cancelled ]; then
              rollback=unknown
            else
              case "${{ steps.install.outputs.rc }}" in
                255|3|8)           rollback=unknown ;;
                4|7)               rollback='' ;;
                5)                 rollback=performed-degraded ;;
                6)                 rollback=failed ;;
                *)                 rollback=performed ;;
              esac
            fi
          elif pick "${{ steps.healthcheck.outcome }}" "Проверить живость (healthz всех сервисов)"; then
            # Провал healthcheck → откат шагом rollback выше (T-137;
            # запускается только при подтверждённом провале проверки
            # rc=1). result пуст — откат не запускался/не завершился
            # (отмена рана, потеря связи, rc=255/2) → неизвестно.
            case "${{ steps.rollback.outputs.result }}" in
              performed)           rollback=performed ;;
              performed-degraded)  rollback=performed-degraded ;;
              nothing-to-rollback) rollback=nothing-to-rollback ;;
              failed)              rollback=failed ;;
              *)                   rollback=unknown ;;
            esac
          fi
          version="${{ steps.build.outputs.version }}"
          if [ -z "$version" ] && [ "${{ steps.web-css.outcome }}" = success ]; then
            version="$(git describe --tags --always 2>/dev/null || true)"
          fi
          args=(--status "$status" --workflow deploy --event "$event")
          if [ "$status" != ok ]; then
            args+=(--step "$step")
          fi
          if [ -n "$version" ]; then
            args+=(--version "$version")
          fi
          if [ -n "$rollback" ]; then
            args+=(--rollback "$rollback")
          fi
          deploy/telegram-notify.sh "${args[@]}"
