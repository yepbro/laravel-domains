name: deploy

# CD pipeline (T-135): deploys the production server 155.212.174.88 after a
# green ci on production. Triggered by workflow_run when ci completes
# (exactly the tested SHA gets deployed) or manually via workflow_dispatch.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [production]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: build · upload · restart · healthz · rollback
    # Only a successful ci on a push to production (or a manual run):
    # master is the main development branch, only what is merged into
    # production goes to prod (docs/ci-cd.md).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'production')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SSH_HOST: root@155.212.174.88
      SSH_OPTS: -o UserKnownHostsFile=known_hosts.txt -o ConnectTimeout=15
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags: git describe (the deploy version — in the
          # binaries and the notification) searches for the nearest tag by
          # walking history, which a shallow clone with depth 1 lacks.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: Prepare .env (Tailwind/Alpine versions for web-css)
        id: env
        run: cp .env.example .env

      - name: Build landing page CSS (go:embed, deploy.md §4.2)
        id: web-css
        run: make web-css

      - name: Build static binaries
        id: build
        run: |
          version="$(git describe --tags --always --dirty 2>/dev/null || echo unknown)"
          revision="$(git rev-parse --short HEAD)"
          mkdir -p out
          for svc in ingest scheduler dns-worker http-worker render-worker analyzer monitor web dashboard crawlerctl; do
            CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X crawler/internal/metrics.buildMode=prod -X crawler/internal/metrics.buildVersion=$version -X crawler/internal/metrics.buildRevision=$revision" \
              -o "out/$svc" "./cmd/$svc"
          done
          echo "version=$version revision=$revision" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The Telegram notification script ships with the set
          # (T-162/T-173): monitor expects it at /opt/crawler/bin
          # (alerts.telegram_script); a manual install does not survive a
          # deploy — install recreates the directory from the archive.
          # install chmod 0755 guarantees the executable bit.
          cp deploy/telegram-notify.sh out/telegram-notify.sh
          tar -C out -czf binaries.tar.gz .

      - name: Set up SSH
        id: ssh
        run: |
          install -m 600 /dev/null id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > known_hosts.txt

      # scp and install are separate steps so that the Telegram notification
      # honestly separates a failure before the install starts (no rollback)
      # from an install failure (a rollback): see the "Telegram notification"
      # step below.
      - name: Upload binaries (scp)
        id: upload
        run: scp $SSH_OPTS -i id_ed25519 binaries.tar.gz "$SSH_HOST:/tmp/crawler-deploy.tar.gz"

      # The rollback is a trap in deploy-install.sh: active after the set
      # has been stopped successfully until it has been started
      # successfully. The outcome is reflected in the exit code (see the
      # deploy-install.sh header): this step failing = the trap rollback
      # was performed, while the special codes (T-137): 4 — no archive,
      # 7 — backup preparation failure (bin untouched, the set restarted),
      # 3/8 — the unit state needs checking, 5 — the rollback was performed
      # but the set is partial, 6 — the rollback failed, 255 (the ssh
      # transport: the remote script may have gotten anywhere) — the server
      # state is unknown.
      - name: Install on the server
        id: install
        run: |
          set +e
          ssh $SSH_OPTS -i id_ed25519 "$SSH_HOST" 'bash -s' -- < deploy/deploy-install.sh
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # The healthcheck only checks (T-135); the rollback on its failure is
      # the next step (T-137, spec §10.4 "healthcheck with automatic
      # rollback"). The step rc distinguishes a check failure (1) from the
      # ssh transport (255) and a script parse failure (2): for the latter
      # ones the server state is unknown, the destructive rollback is not
      # started.
      - name: Liveness check (healthz of all services)
        id: healthcheck
        run: |
          set +e
          ssh $SSH_OPTS -i id_ed25519 "$SSH_HOST" 'bash -s' -- < deploy/deploy-healthcheck.sh
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      # The automatic rollback on a healthcheck failure (T-137,
      # spec §10.4): stop → restore /opt/crawler/bin.prev → start (with a
      # start-limit reset of the units). Only a healthcheck failure: an
      # install failure is already rolled back by the install step's own
      # trap, earlier steps (build, scp) do not touch the server. Runs
      # BEFORE the diagnostics: returning a working version quickly matters
      # more than collecting logs (the new version's logs remain in
      # journalctl). The deploy-rollback.sh codes → result for the
      # notification below; rc=255 (the ssh transport) and rc=2 (bash did
      # not execute the script) → unknown — the server state is unknown.
      # The step fails the run on partial success (the units are not all
      # active / the rollback failed): pick() in the notification names
      # healthcheck as the failure root, the rollback details are in the
      # "Rollback: …" line.
      - name: Rollback (on healthcheck failure)
        id: rollback
        # Only a confirmed check failure (rc=1): 255 (the ssh transport)
        # and 2 (a script parse failure) mean the check did not complete —
        # the state is unknown, the rollback is not started (the
        # notification reports "rollback unknown").
        if: failure() && steps.healthcheck.outcome == 'failure' && steps.healthcheck.outputs.rc == '1'
        run: |
          set +e
          ssh $SSH_OPTS -i id_ed25519 "$SSH_HOST" 'bash -s' -- < deploy/deploy-rollback.sh
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0)   result=performed;           note='rollback performed, all units active' ;;
            1)   result=performed-degraded;  note='rollback performed, but not all units are active' ;;
            3)   result=failed;              note='rollback failed — an operator is required' ;;
            4)   result=nothing-to-rollback; note='bin.prev is missing — nothing to roll back' ;;
            255) result=unknown;             note='ssh transport (rc=255) — the server state is unknown' ;;
            2)   result=unknown;             note='the script did not run (bash rc=2) — the server state is unknown' ;;
            *)   result=failed;              note="unexpected code $rc" ;;
          esac
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "rollback: $note"
          case "$result" in
            performed|nothing-to-rollback) exit 0 ;;
            *) exit 1 ;;
          esac

      # Diagnostics on failure — AFTER the rollback (returning a working
      # version takes priority; the failed new version's logs remain in
      # journalctl). The server is either rolled back (the install step's
      # trap or the rollback step), or the rollback failed/is impossible —
      # the details are in the Telegram notification below.
      - name: Diagnostics (on failure)
        if: failure()
        run: |
          ssh $SSH_OPTS -i id_ed25519 "$SSH_HOST" \
            "systemctl list-units 'crawler-*' --no-legend; journalctl -u 'crawler-*' --no-pager --since '-30 min' -n 200" \
            || true

      # Telegram notification (spec §10.4): deploy success and failure —
      # one message per run; a manual workflow_dispatch is a regular
      # deploy and is notified too (unlike manual ci runs). A cancelled
      # run (job.status=cancelled, including a job timeout) is notified as
      # unsuccessful: the server state at that moment can be anything.
      # The version comes from the build step (the same git describe as in
      # the binaries), recomputed from the checkout if the step did not get
      # there; before the build there is no version — the line is omitted.
      # The rollback fact (T-137) — by step codes: install: 4/7 — the
      # server/bin untouched (no rollback line), 3 and 255, a cancellation
      # — unknown, 5 — the trap rollback performed but the set is partial,
      # 6 — the trap rollback failed, other — the trap rollback performed;
      # healthcheck: the result of the rollback step above — performed /
      # performed, but not all units active / nothing to roll back
      # (bin.prev missing) / failed / unknown (the step did not complete or
      # the healthcheck did not complete itself — a run cancellation, a
      # lost connection, rc=255/2). A failure before the install → no
      # rollback line. A send failure does not fail the run:
      # continue-on-error.
      - name: Telegram notification
        if: always()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
        run: |
          status=fail
          event="Deploy failed"
          if [ "$JOB_STATUS" = success ]; then
            status=ok
            event="Deploy succeeded"
          elif [ "$JOB_STATUS" = cancelled ]; then
            event="Deploy failed (run cancelled)"
          fi
          # The step names below must be kept in sync with the name: of the
          # steps above.
          # pick: failure|cancelled → remember the step name (a cancelled
          # in-flight step is also the culprit).
          pick() {
            case "$1" in failure|cancelled) step="$2"; return 0 ;; *) return 1 ;; esac
          }
          step="outside the main deploy steps (see the run log)"
          rollback=""
          if pick "${{ steps.web-css.outcome }}" "Build landing page CSS (go:embed, deploy.md §4.2)"; then :
          elif pick "${{ steps.build.outcome }}" "Build static binaries"; then :
          elif pick "${{ steps.ssh.outcome }}" "Set up SSH"; then :
          elif pick "${{ steps.upload.outcome }}" "Upload binaries (scp)"; then :
          elif pick "${{ steps.install.outcome }}" "Install on the server"; then
            # deploy-install.sh codes (T-137): 4 — no archive and 7 — a
            # backup preparation failure (bin untouched, the set restarted)
            # → no rollback line; 3 — the set did not stop, 255 — the ssh
            # transport, 8 — the stopped set was not brought up → the
            # state needs checking; 5 — the trap rollback performed but
            # the set is partial; 6 — the trap rollback failed; others
            # (including 2: produced both by bash on a parse failure and
            # by tar on a broken archive) — a failure inside the install:
            # the trap rolled back to bin.prev.
            if [ "${{ steps.install.outcome }}" = cancelled ]; then
              rollback=unknown
            else
              case "${{ steps.install.outputs.rc }}" in
                255|3|8)           rollback=unknown ;;
                4|7)               rollback='' ;;
                5)                 rollback=performed-degraded ;;
                6)                 rollback=failed ;;
                *)                 rollback=performed ;;
              esac
            fi
          elif pick "${{ steps.healthcheck.outcome }}" "Liveness check (healthz of all services)"; then
            # A healthcheck failure → a rollback by the rollback step above
            # (T-137; it runs only on a confirmed check failure, rc=1).
            # result is empty — the rollback was not started/did not
            # complete (a run cancellation, a lost connection, rc=255/2)
            # → unknown.
            case "${{ steps.rollback.outputs.result }}" in
              performed)           rollback=performed ;;
              performed-degraded)  rollback=performed-degraded ;;
              nothing-to-rollback) rollback=nothing-to-rollback ;;
              failed)              rollback=failed ;;
              *)                   rollback=unknown ;;
            esac
          fi
          version="${{ steps.build.outputs.version }}"
          if [ -z "$version" ] && [ "${{ steps.web-css.outcome }}" = success ]; then
            version="$(git describe --tags --always 2>/dev/null || true)"
          fi
          args=(--status "$status" --workflow deploy --event "$event")
          if [ "$status" != ok ]; then
            args+=(--step "$step")
          fi
          if [ -n "$version" ]; then
            args+=(--version "$version")
          fi
          if [ -n "$rollback" ]; then
            args+=(--rollback "$rollback")
          fi
          deploy/telegram-notify.sh "${args[@]}"
