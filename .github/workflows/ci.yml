name: ci

# Runs on master, production and PRs: a push event on a branch with an open
# PR would duplicate the same commit with two runs. production is needed
# separately: deploy (workflow_run) fires on a green ci run on production
# (docs/ci-cd.md) — without a push-run of ci on that branch the deploy
# chain never starts.
on:
  push:
    branches: [master, production]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job: the build is shared (the same images for lint, tests and
  # integration), the integration stack is the only compose project with a
  # static subnet and volumes; splitting the steps into separate jobs would
  # double the builds with no benefit.
  build-and-test:
    name: build · lint · test · integration
    # ubuntu-latest migrates to Ubuntu 26 starting Oct 19, 2026 — pin the
    # runner image so the CI environment does not change under the project
    # on its own.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The same compose files as locally, plus type=gha layer caching
      COMPOSE: docker compose --project-directory . -f deploy/docker/compose.yaml -f deploy/docker/compose.ci.yaml --env-file .env
    steps:
      # depth 2: in PR runs HEAD is a merge commit, while the notification
      # needs the PR branch's head commit (the merge commit's parent);
      # depth 1 does not include it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Building all images (the dev image with golangci-lint/delve/air +
      # mockserver with a full compile + unbound) with the BuildKit cache
      # and loading them into docker does not fit into the ~14 GB free on
      # the runner: "no space left on device". The runner's precompiled
      # SDKs (Android, .NET, GHC, CodeQL ≈ 20 GB) are not needed by the
      # project — remove them before the build.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v4

      - name: Prepare .env
        run: cp .env.example .env

      - name: Build images (with layer cache)
        id: build
        run: make build COMPOSE="$COMPOSE"

      # The images are already loaded into the docker daemon, the layers are
      # exported to the GHA cache — the BuildKit state (several GB) is not
      # needed by the later steps (lint/test/test-integration run the ready
      # images without rebuilding), and build-runtime at the end builds from
      # scratch anyway. Free up space for the infrastructure images and the
      # test-run volumes.
      - name: Prune the BuildKit cache after the build
        run: |
          docker builder prune -af || true
          df -h /

      - name: Lint (golangci-lint)
        id: lint
        run: make lint COMPOSE="$COMPOSE"

      - name: Unit tests
        id: test
        run: make test COMPOSE="$COMPOSE"

      # The race detector for the goroutine loops of monitor (T-190): the
      # regular make test runs without -race; the step is cheap — the images
      # are already loaded, a single package runs.
      - name: Race-detector tests (monitor)
        id: test-race
        run: make test-race COMPOSE="$COMPOSE"

      - name: Laravel rules against the sample corpus
        id: test-rules
        run: make test-rules COMPOSE="$COMPOSE"

      - name: Integration tests on the testbed
        id: test-integration
        run: make test-integration COMPOSE="$COMPOSE"

      - name: Production image check (runtime + render)
        id: build-runtime
        run: make build-runtime

      # Diagnostics on failure: the state and logs of all services go into
      # an artifact (GitHub keeps the runner console log anyway, but without
      # the service log tails).
      - name: Collect diagnostics (on failure)
        if: failure()
        run: |
          mkdir -p ci-logs
          { echo '$ docker compose ps -a'; \
            $COMPOSE --profile '*' ps -a; } > ci-logs/ps.txt 2>&1 || true
          $COMPOSE --profile '*' logs --no-color --tail=500 \
            > ci-logs/services.log 2>&1 || true

      - name: Upload diagnostics to an artifact (on failure)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: ci-logs/

      # Telegram notification (spec §10.4): one message per failed ci run.
      # The category follows the first failed step (the steps before it are
      # green, the ones after are skipped): image build/lint/production
      # images → "Code error", tests → "Tests error"; other failures
      # (diagnostics, environment preparation) → the "CI pipeline error"
      # fallback — the event is missing from the §10.4 table, but staying
      # silent about a red run is worse (the decision is recorded in
      # commit T-136). Manual ci runs stay silent — §10.4: manual runs do
      # not produce notifications. A send failure does not fail the run:
      # continue-on-error + the secrets guard in the script (PRs from
      # forks). Successful ci runs are not notified (§10.4).
      - name: Telegram notification
        if: failure() && github.event_name != 'workflow_dispatch'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # The step names in the categories must be kept in sync with the
          # name: of the steps above.
          event="CI pipeline error"
          step="outside build and test steps (see the run log)"
          if [ "${{ steps.build.outcome }}" = failure ]; then
            event="Code error"; step="Build images (with layer cache)"
          elif [ "${{ steps.lint.outcome }}" = failure ]; then
            event="Code error"; step="Lint (golangci-lint)"
          elif [ "${{ steps.test.outcome }}" = failure ]; then
            event="Tests error"; step="Unit tests"
          elif [ "${{ steps.test-race.outcome }}" = failure ]; then
            event="Tests error"; step="Race-detector tests (monitor)"
          elif [ "${{ steps.test-rules.outcome }}" = failure ]; then
            event="Tests error"; step="Laravel rules against the sample corpus"
          elif [ "${{ steps.test-integration.outcome }}" = failure ]; then
            event="Tests error"; step="Integration tests on the testbed"
          elif [ "${{ steps.build-runtime.outcome }}" = failure ]; then
            event="Code error"; step="Production image check (runtime + render)"
          fi
          # In PR runs HEAD is a merge commit: the offending commit is the
          # PR branch head.
          args=(--status fail --event "$event" --workflow ci --step "$step")
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            args+=(--sha "${{ github.event.pull_request.head.sha }}")
          fi
          deploy/telegram-notify.sh "${args[@]}"
