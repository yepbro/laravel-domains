name: ci

# Прогон только на master и в PR: событие push на ветке с открытым PR
# дублировало бы тот же коммит двумя ранами.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Один job: сборка общая (одни образы для линта, тестов и integration),
  # integration-стек — единственный compose-проект со статической подсетью
  # и томами; вынос шагов в отдельные jobs удвоил бы сборки без выгоды.
  build-and-test:
    name: build · lint · test · integration
    # ubuntu-latest с 19.10.2026 мигрирует на Ubuntu 26 — фиксируем образ
    # раннера, чтобы окружение CI не менялось под проектом само по себе.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Те же compose-файлы, что и локально, + кэш слоёв type=gha
      COMPOSE: docker compose --project-directory . -f deploy/docker/compose.yaml -f deploy/docker/compose.ci.yaml --env-file .env
    steps:
      # depth 2: в PR-ранах HEAD — merge-commit, а для извещения нужен
      # head-коммит ветки PR (родитель merge-коммита); depth 1 его не
      # содержит.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # Сборка всех образов (dev-образ с golangci-lint/delve/air + mockserver
      # с полной компиляцией + unbound) с кэшем BuildKit и загрузкой в docker
      # не влезает в ~14 ГБ свободных на раннере: «no space left on device».
      # Прекомпилированные SDK раннера (Android, .NET, GHC, CodeQL ≈ 20 ГБ)
      # проекту не нужны — убираем их до сборки.
      - name: Освободить место на диске раннера
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker image prune -af || true
          df -h /

      - uses: docker/setup-buildx-action@v4

      - name: Подготовить .env
        run: cp .env.example .env

      - name: Сборка образов (с кэшем слоёв)
        id: build
        run: make build COMPOSE="$COMPOSE"

      # Образы уже загружены в docker daemon, слои выгружены в кэш GHA —
      # состояние BuildKit (несколько ГБ) не нужно дальнейшим шагам (lint/
      # test/test-integration запускают готовые образы без пересборки),
      # а build-runtime в конце собирает с нуля и так. Освобождаем место
      # для образов инфраструктуры и томов тестового прогона.
      - name: Освободить кэш BuildKit после сборки
        run: |
          docker builder prune -af || true
          df -h /

      - name: Линт (golangci-lint)
        id: lint
        run: make lint COMPOSE="$COMPOSE"

      - name: Модульные тесты
        id: test
        run: make test COMPOSE="$COMPOSE"

      - name: Правила Laravel по корпусу образцов
        id: test-rules
        run: make test-rules COMPOSE="$COMPOSE"

      - name: Интеграционные тесты на testbed
        id: test-integration
        run: make test-integration COMPOSE="$COMPOSE"

      - name: Проверка боевых образов (runtime + render)
        id: build-runtime
        run: make build-runtime

      # Диагностика при падении: состояние и логи всех сервисов — в artifact
      # (консольный лог раннера GitHub хранит и так, но без хвостов сервисов).
      - name: Собрать диагностику (при падении)
        if: failure()
        run: |
          mkdir -p ci-logs
          { echo '$ docker compose ps -a'; \
            $COMPOSE --profile '*' ps -a; } > ci-logs/ps.txt 2>&1 || true
          $COMPOSE --profile '*' logs --no-color --tail=500 \
            > ci-logs/services.log 2>&1 || true

      - name: Выгрузить диагностику в artifact (при падении)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          path: ci-logs/

      # Извещение Telegram (ТЗ §10.4): одно сообщение на провал рана ci.
      # Категория — по первому провалившемуся шагу (шаги до него зелёные,
      # после — skipped): сборка образов/линт/боевые образы → «Ошибка в
      # коде», тесты → «Ошибка тестов»; прочие провалы (диагностика,
      # подготовка окружения) → фолбэк «Ошибка конвейера CI» — события
      # нет в таблице §10.4, но молчать о красном ране хуже (решение
      # зафиксировано в коммите T-136). Ручные запуски ci молчат —
      # §10.4: ручные прогоны извещений не порождают. Сбой отправки не
      # красит ран: continue-on-error + guard секретов в скрипте
      # (PR из форков). Успешные ci-раны не извещаются (§10.4).
      - name: Извещение Telegram
        if: failure() && github.event_name != 'workflow_dispatch'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          # Имена шагов в категориях синхронизировать с name: шагов выше.
          event="Ошибка конвейера CI"
          step="вне шагов сборки и тестов (см. лог рана)"
          if [ "${{ steps.build.outcome }}" = failure ]; then
            event="Ошибка в коде"; step="Сборка образов (с кэшем слоёв)"
          elif [ "${{ steps.lint.outcome }}" = failure ]; then
            event="Ошибка в коде"; step="Линт (golangci-lint)"
          elif [ "${{ steps.test.outcome }}" = failure ]; then
            event="Ошибка тестов"; step="Модульные тесты"
          elif [ "${{ steps.test-rules.outcome }}" = failure ]; then
            event="Ошибка тестов"; step="Правила Laravel по корпусу образцов"
          elif [ "${{ steps.test-integration.outcome }}" = failure ]; then
            event="Ошибка тестов"; step="Интеграционные тесты на testbed"
          elif [ "${{ steps.build-runtime.outcome }}" = failure ]; then
            event="Ошибка в коде"; step="Проверка боевых образов (runtime + render)"
          fi
          # В PR-ранах HEAD — merge-commit: виновный коммит = head ветки PR.
          args=(--status fail --event "$event" --workflow ci --step "$step")
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            args+=(--sha "${{ github.event.pull_request.head.sha }}")
          fi
          deploy/telegram-notify.sh "${args[@]}"
