name: ops-telegram-env

# One-off/repeatable delivery of the monitoring Telegram secrets to the
# production server (T-173): the TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID values
# live in repository secrets (write-only — they cannot be read) and are
# needed in the EnvironmentFile of the crawler-monitor unit
# (/etc/crawler/crawler.env), so that monitor delivers alerts (T-162) and
# load reports (T-173) to the operator. CI is the only place with access to
# both the secrets and the server (DEPLOY_SSH_KEY, the same one deploy
# uses). Runs manually only, via workflow_dispatch; the steps follow the
# SSH pattern of deploy.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-production
  cancel-in-progress: false

jobs:
  telegram-env:
    name: ssh · env upsert · restart monitor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SSH_HOST: root@155.212.174.88
      SSH_OPTS: -o UserKnownHostsFile=known_hosts.txt -o ConnectTimeout=15
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        run: |
          install -m 600 /dev/null id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > known_hosts.txt

      # Secrets are passed as arguments to the bash script over SSH: GitHub
      # masks them in the run logs, the script never prints the values
      # (deploy/telegram-env.sh; the "bash -s" style from deploy.yml).
      # Script exit codes: 4 — no env file or arguments, 3 — the delivery
      # enablement line was not found in the journal.
      - name: Deliver secrets and restart monitor
        run: |
          set +e
          ssh $SSH_OPTS -i id_ed25519 "$SSH_HOST" 'bash -s -- ' \
            "${{ secrets.TELEGRAM_BOT_TOKEN }}" "${{ secrets.TELEGRAM_CHAT_ID }}" \
            < deploy/telegram-env.sh
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
