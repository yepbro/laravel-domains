name: ops-telegram-env

# One-off/repeatable delivery of the monitoring Telegram secrets to the
# production server (T-173): the TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID values
# live in repository secrets (write-only — they cannot be read) and are
# needed in the EnvironmentFile of the crawler-monitor unit
# (/etc/crawler/crawler.env), so that monitor delivers alerts (T-162) and
# load reports (T-173) to the operator. CI is the only place with access to
# both the secrets and the server (DEPLOY_SSH_KEY, the same one deploy
# uses). Runs manually only, via workflow_dispatch; the steps follow the
# SSH pattern of deploy.yml.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-production
  cancel-in-progress: false

jobs:
  telegram-env:
    name: ssh · env upsert · restart monitor
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SSH_HOST: root@155.212.174.88
      SSH_OPTS: -o UserKnownHostsFile=known_hosts.txt -o ConnectTimeout=15
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        run: |
          install -m 600 /dev/null id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > id_ed25519
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" > known_hosts.txt

      # The secrets travel in the ssh stdin stream — two lines ahead of the
      # script text — and not in any process command line (T-303, 19#P2-3):
      # /proc/<pid>/cmdline is world-readable on the server (hidepid=0) and
      # the former `bash -s -- <token> <chat>` exposed the values there for
      # the script's lifetime. The remote command reads the two lines with
      # shell builtins (read — no extra process) and exports them for the
      # script; the environment of the root process
      # (/proc/<pid>/environ) is root-only. GitHub still masks the values
      # in the run logs; the values must be single-line (they are).
      # Green means delivered: the script text is checked BEFORE the pipe
      # (a failed checkout must not send an empty stream) and the remote
      # wrapper rejects missing/empty lines (a bare `bash -s` on an empty
      # stdin would exit 0 — review P3-2).
      # Exit codes: 4 — no values (the wrapper or the script itself),
      # 3 — the delivery enablement line was not found in the journal,
      # 1 — the checkout lacks the script / the upsert failed.
      - name: Deliver secrets and restart monitor
        run: |
          set +e
          script="$(cat deploy/telegram-env.sh)" || exit 1
          { printf '%s\n' "${{ secrets.TELEGRAM_BOT_TOKEN }}" "${{ secrets.TELEGRAM_CHAT_ID }}"; printf '%s\n' "$script"; } | \
            ssh $SSH_OPTS -i id_ed25519 "$SSH_HOST" \
              'read -r _tok && read -r _chat || exit 4; [ -n "$_tok" ] && [ -n "$_chat" ] || exit 4; export TELEGRAM_BOT_TOKEN="$_tok" TELEGRAM_CHAT_ID="$_chat"; unset _tok _chat; exec bash -s'
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
