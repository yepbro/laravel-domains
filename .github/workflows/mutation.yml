name: mutation

# Мутационное тестирование (go-mutesting) — тяжёлая проверка, в CI
# каждого пуша не входит: еженедельный прогон по master (воскресенье
# вечером по Москве) + ручной запуск.
#
# Полный охват гоняется ТРЕМЯ ПАРАЛЛЕЛЬНЫМИ ДЖОБАМИ (части A, B, C):
# hosted-раннер существенно медленнее локали, полный охват после-
# вательно по замерам — ~9.5–11.5 ч — не влезает в платформенный
# потолок джоба 6 ч (360 мин — максимум). Части сбалансированы
# по ЗАМЕРЕННОМУ ВРЕМЕНИ, а не по числу мутантов или LOC: темп
# задаёт тестовый сюит пакета и расходится в разы (queue
# ~6 с/мутант, render ~29 с/мутант). Фактура прогона
# 42595221462 от 09.11.2026 (тогдашний
# сплит на две половины): половина A прошла шаг мутации за ~2ч15м,
# а половина B (тогда queue+render+rules+scheduler+status) срезана
# шаговым таймаутом 340 мин — queue отработал ~77 мин (770 мутантов),
# render шёл темпом ~29 с/мутант (за 265 мин — лишь ~70–85% пакета,
# т.е. полный пакет ~5.2–6.3 ч), rules/scheduler/status не начались;
# полный B-набор — ≥7 ч, потолок 6 ч не пробивается никак. Поэтому
# render выделен в отдельный джоб C. Оценки: A ~2ч15м (замер),
# B ~2–3 ч (rules/scheduler/status в CI не гонялись — оценка,
# уточнится первым прогоном), C ~5.2–6.3 ч — даже пессимистичный
# край C информативнее прежней половины B (срез на ~70–85% render
# при трёх не начатых пакетах).
# Порог и охват настраиваются входами; отчёты — в artifact рана.
on:
  workflow_dispatch:
    inputs:
      pkgs:
        description: 'Точечный охват: ./-шаблоны через пробел (пусто — полный охват, все три джоба; полный список сюда не вписывать — один джоб срежется по 6 ч)'
        required: false
        default: ''
      min_score:
        description: 'Минимальный mutation score (0..1)'
        required: false
        default: '0.98'
      timeout:
        description: 'Таймаут go test на мутанта, сек'
        required: false
        default: '60'
  schedule:
    - cron: '0 17 * * 0'  # воскресенье 20:00 МСК (UTC+3, без DST)

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  # Как в ci.yml: те же compose-файлы + кэш слоёв type=gha
  COMPOSE: docker compose --project-directory . -f deploy/docker/compose.yaml -f deploy/docker/compose.ci.yaml --env-file .env

jobs:
  # Три явных джоба, а не matrix: у частей разные наборы и разный вес,
  # у B и C своё условие скипа (ручной точечный pkgs), а fail-fast
  # матрицы отменял бы соседние части при провале одной. Гейт порога —
  # на каждой части отдельно: строже глобального взвешенного 0.98 (тот
  # допускал бы перекос — идеальная часть компенсировала бы
  # провальную ниже порога); осознанное решение.
  mutate-a:
    name: mutation testing (часть A)
    runs-on: ubuntu-24.04
    # 6 ч — платформенный максимум hosted-джоба; часть A — замер
    # 09.11.2026: шаг мутации ~2ч15м; запас > 3 ч на сборку образа
    # и медленный раннер. Состав не менялся с прежней половины A —
    # замер остаётся валидным.
    timeout-minutes: 360
    env:
      # Часть A — analyzer, dashboard (вкл. подпакет auth), idn,
      # model, monitor: быстрые сюиты, темп ~2.6 с/мутант.
      HALF_PKGS: ./internal/analyzer/... ./internal/dashboard/... ./internal/idn/... ./internal/model/... ./internal/monitor/...
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Подготовить .env
        run: cp .env.example .env

      # Достаточно tools-образа (dev stage): линт/тесты здесь не гоняются,
      # инфраструктура не нужна — юнит-тесты мутационного охвата герметичны.
      - name: Собрать tools-образ (с кэшем слоёв)
        run: $COMPOSE build tools

      - name: Мутационное тестирование
        # Потолок шага ниже потолка джоба (360): при срезе по шаговому
        # потолку always()-выгрузка ниже выполняется штатно, а вот
        # убийство джоба по джобовому потолку выгрузку не гарантирует.
        timeout-minutes: 340
        env:
          # Входы — через env, не интерполяцией ${{ }} в тело скрипта
          # (защита от инъекций в run).
          DISPATCH_PKGS: ${{ inputs.pkgs }}
          MIN_SCORE: ${{ inputs.min_score || '0.98' }}
          TEST_TIMEOUT: ${{ inputs.timeout || '60' }}
        run: |
          # Ручной точечный прогон (задан pkgs): назначенный набор
          # заменяет часть A; части B и C скипаются (if их джобов).
          pkgs="$HALF_PKGS"
          if [ -n "$DISPATCH_PKGS" ]; then
            # Белый список символов: значение дальше попадает в рецепт
            # make в одинарных кавычках — кавычка/;/$ в нём ломали бы
            # команду (значение задаёт человек с write-доступом, но
            # защита в глубину дешевле разбора).
            case "$DISPATCH_PKGS" in
              *[!A-Za-z0-9./_\ -]*)
                echo "ОШИБКА: недопустимые символы в pkgs (допустимы буквы/цифры и ./_ и пробел): $DISPATCH_PKGS" >&2
                exit 2 ;;
            esac
            pkgs="$DISPATCH_PKGS"
          fi
          make mutate COMPOSE="$COMPOSE" PKGS="$pkgs" \
            MUTATION_MIN_SCORE="$MIN_SCORE" \
            MUTATE_TIMEOUT="$TEST_TIMEOUT"

      # Отчёты полезны и при падении (разбор выживших), и при успехе
      # (динамика score); mutate.log дублирует консоль рана.
      - name: Выгрузить отчёты в artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-a-${{ github.run_id }}
          retention-days: 14
          path: var/mutation/

  mutate-b:
    name: mutation testing (часть B)
    # Точечный ручной прогон (задан pkgs) выполняет один джоб A с этим
    # набором; еженедельный и полный ручной гоняют все три части.
    # Условие явное по событию: на schedule inputs-контекст пуст,
    # сравнение с '' работает, но неявно — читаемость важнее.
    if: github.event_name != 'workflow_dispatch' || inputs.pkgs == ''
    runs-on: ubuntu-24.04
    # 6 ч — платформенный максимум hosted-джоба; часть B — queue
    # (замер 09.11.2026: 770 мутантов за ~77 мин, ~6 с/мутант) +
    # rules/scheduler/status (в CI не гонялись — предположительно
    # быстрые сюиты, оценка по темпу queue ещё ~1–2 ч). Итог —
    # оценка ~2–3 ч, в потолке с запасом; уточнить первым прогоном.
    timeout-minutes: 360
    env:
      # Часть B — queue, rules, scheduler, status (быстрые тестовые
      # сюиты); render вынесен в отдельный джоб C.
      HALF_PKGS: ./internal/queue/... ./internal/rules/... ./internal/scheduler/... ./internal/status/...
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Подготовить .env
        run: cp .env.example .env

      # Достаточно tools-образа (dev stage): линт/тесты здесь не гоняются,
      # инфраструктура не нужна — юнит-тесты мутационного охвата герметичны.
      - name: Собрать tools-образ (с кэшем слоёв)
        run: $COMPOSE build tools

      - name: Мутационное тестирование
        # Потолок шага ниже потолка джоба (360) — чтобы always()-выгрузка
        # успела положить отчёты при срезе (как у джоба A, см. там).
        timeout-minutes: 340
        env:
          MIN_SCORE: ${{ inputs.min_score || '0.98' }}
          TEST_TIMEOUT: ${{ inputs.timeout || '60' }}
        run: |
          make mutate COMPOSE="$COMPOSE" PKGS="$HALF_PKGS" \
            MUTATION_MIN_SCORE="$MIN_SCORE" \
            MUTATE_TIMEOUT="$TEST_TIMEOUT"

      # Отчёты полезны и при падении (разбор выживших), и при успехе
      # (динамика score); mutate.log дублирует консоль рана.
      - name: Выгрузить отчёты в artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-b-${{ github.run_id }}
          retention-days: 14
          path: var/mutation/

  mutate-c:
    name: mutation testing (часть C)
    # Как у B: точечный ручной pkgs — только джоб A, C скипается;
    # еженедельный и полный ручной гоняют все три части.
    if: github.event_name != 'workflow_dispatch' || inputs.pkgs == ''
    runs-on: ubuntu-24.04
    # 6 ч — платформенный максимум hosted-джоба; часть C — render один:
    # медленный тестовый сюит даёт ~29 с/мутант (замер 09.11.2026:
    # 544 мутанта за 265 мин ≈ 70–85% пакета, полный пакет
    # ~5.2–6.3 ч). Пессимистичный край задевает шаговый потолок 340
    # (срез на ~90% пакета) — даже тогда информативнее прежней
    # половины B, отчёты сохранит always()-выгрузка; дальнейший
    # рычаг — ускорение тест-сюита render (вне этой задачи).
    # В прежней половине B вместе с queue не влезал в потолок 6 ч.
    timeout-minutes: 360
    env:
      # Часть C — render: по числу мутантов пакет средний, но по
      # времени тяжелейший — отдельный джоб.
      HALF_PKGS: ./internal/render/...
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Подготовить .env
        run: cp .env.example .env

      # Достаточно tools-образа (dev stage): линт/тесты здесь не гоняются,
      # инфраструктура не нужна — юнит-тесты мутационного охвата герметичны.
      - name: Собрать tools-образ (с кэшем слоёв)
        run: $COMPOSE build tools

      - name: Мутационное тестирование
        # Потолок шага ниже потолка джоба (360) — чтобы always()-выгрузка
        # успела положить отчёты при срезе (как у джоба A, см. там).
        timeout-minutes: 340
        env:
          MIN_SCORE: ${{ inputs.min_score || '0.98' }}
          TEST_TIMEOUT: ${{ inputs.timeout || '60' }}
        run: |
          make mutate COMPOSE="$COMPOSE" PKGS="$HALF_PKGS" \
            MUTATION_MIN_SCORE="$MIN_SCORE" \
            MUTATE_TIMEOUT="$TEST_TIMEOUT"

      # Отчёты полезны и при падении (разбор выживших), и при успехе
      # (динамика score); mutate.log дублирует консоль рана.
      - name: Выгрузить отчёты в artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-c-${{ github.run_id }}
          retention-days: 14
          path: var/mutation/
