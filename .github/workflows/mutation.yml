name: mutation

# Mutation testing (go-mutesting) — a heavy check, not part of the CI of
# every push: a weekly run on master (Sunday evening Moscow time) plus a
# manual trigger.
#
# The full coverage runs in THREE PARALLEL JOBS (parts A, B, C): a hosted
# runner is significantly slower than local hardware, and the full coverage
# sequentially is ~9.5–11.5 h by measurements — it does not fit into the
# platform job cap of 6 h (360 min — the maximum). The parts are balanced
# by MEASURED TIME, not by mutant count or LOC: the pace is set by the
# package's test suite and differs severalfold (queue ~6 s/mutant, render
# ~29 s/mutant). The record of run 42595221462 from Nov 9, 2026 (the then
# split into two halves): half A finished the mutation step in ~2h15m,
# while half B (then queue+render+rules+scheduler+status) was cut off by
# the 340 min step timeout — queue took ~77 min (770 mutants), render went
# at a pace of ~29 s/mutant (265 min — only ~70–85% of the package, i.e.
# the full package ~5.2–6.3 h), rules/scheduler/status never started; the
# full B set is ≥7 h, the 6 h cap is unreachable no matter what. Therefore
# render got a separate job C. Estimates: A ~2h15m (measured), B ~2–3 h
# (rules/scheduler/status never ran in CI — an estimate, to be refined by
# the first run), C ~5.2–6.3 h — even the pessimistic edge of C is more
# informative than the old half B (cut off at ~70–85% of render with three
# packages not started).
# The threshold and coverage are configured via inputs; the reports go to
# the run artifact.
on:
  workflow_dispatch:
    inputs:
      pkgs:
        description: 'Targeted coverage: space-separated ./-patterns (empty — full coverage, all three jobs; do not paste the full package list here — one job would be cut off at the 6 h cap)'
        required: false
        default: ''
      min_score:
        description: 'Minimum mutation score (0..1)'
        required: false
        default: '0.98'
      timeout:
        description: 'go test timeout per mutant, s'
        required: false
        default: '60'
  schedule:
    - cron: '0 17 * * 0'  # Sunday 20:00 MSK (UTC+3, no DST)

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

env:
  # As in ci.yml: the same compose files + type=gha layer caching
  COMPOSE: docker compose --project-directory . -f deploy/docker/compose.yaml -f deploy/docker/compose.ci.yaml --env-file .env

jobs:
  # Three explicit jobs, not a matrix: the parts have different sets and
  # different weights, B and C have their own skip condition (a manual
  # targeted pkgs run), and a matrix's fail-fast would cancel the
  # neighboring parts when one part fails. The threshold gate is per part:
  # stricter than the global weighted 0.98 (the latter would allow a skew —
  # a perfect part compensating for another part failing below the
  # threshold); a deliberate decision.
  mutate-a:
    name: mutation testing (part A)
    runs-on: ubuntu-24.04
    # 6 h — the platform maximum for a hosted job; part A — the Nov 9, 2026
    # measurement: the mutation step ~2h15m; > 3 h of headroom for the image
    # build and the slow runner. The set is unchanged since the old half A
    # — the measurement stays valid.
    timeout-minutes: 360
    env:
      # Part A — analyzer, dashboard (incl. the auth subpackage), idn,
      # model, monitor: fast suites, ~2.6 s/mutant.
      HALF_PKGS: ./internal/analyzer/... ./internal/dashboard/... ./internal/idn/... ./internal/model/... ./internal/monitor/...
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Prepare .env
        run: cp .env.example .env

      # The tools image (dev stage) is enough: lint/tests do not run here,
      # no infrastructure is needed — the unit tests of the mutation
      # coverage are hermetic.
      - name: Build the tools image (with layer cache)
        run: $COMPOSE build tools

      - name: Mutation testing
        # The step cap is below the job cap (360): when cut off at the step
        # cap, the always() upload below still runs normally, while killing
        # the job at the job cap does not guarantee the upload.
        timeout-minutes: 340
        env:
          # Inputs go through env, not ${{ }} interpolation into the script
          # body (injection protection for run).
          DISPATCH_PKGS: ${{ inputs.pkgs }}
          MIN_SCORE: ${{ inputs.min_score || '0.98' }}
          TEST_TIMEOUT: ${{ inputs.timeout || '60' }}
        run: |
          # A manual targeted run (pkgs given): the specified set replaces
          # part A; parts B and C are skipped (by their jobs' if).
          pkgs="$HALF_PKGS"
          if [ -n "$DISPATCH_PKGS" ]; then
            # An allowlist of characters: the value later lands in the make
            # recipe inside single quotes — a quote/;/$ in it would break
            # the command (the value is set by a person with write access,
            # but defense in depth is cheaper than parsing).
            case "$DISPATCH_PKGS" in
              *[!A-Za-z0-9./_\ -]*)
                echo "ОШИБКА: недопустимые символы в pkgs (допустимы буквы/цифры и ./_ и пробел): $DISPATCH_PKGS" >&2
                exit 2 ;;
            esac
            pkgs="$DISPATCH_PKGS"
          fi
          make mutate COMPOSE="$COMPOSE" PKGS="$pkgs" \
            MUTATION_MIN_SCORE="$MIN_SCORE" \
            MUTATE_TIMEOUT="$TEST_TIMEOUT"

      # The reports are useful both on failure (analyzing the survivors) and
      # on success (score dynamics); mutate.log mirrors the run console.
      - name: Upload reports to an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-a-${{ github.run_id }}
          retention-days: 14
          path: var/mutation/

  mutate-b:
    name: mutation testing (part B)
    # A manual targeted run (pkgs given) executes the single job A with that
    # set; the weekly and the full manual runs drive all three parts.
    # The condition is explicit about the event: on schedule the inputs
    # context is empty, comparing with '' works, but implicitly —
    # readability wins.
    if: github.event_name != 'workflow_dispatch' || inputs.pkgs == ''
    runs-on: ubuntu-24.04
    # 6 h — the platform maximum for a hosted job; part B — queue (the
    # Nov 9, 2026 measurement: 770 mutants in ~77 min, ~6 s/mutant) +
    # rules/scheduler/status (never ran in CI — presumably fast suites,
    # estimating by the queue pace another ~1–2 h). The total — an estimate
    # of ~2–3 h, within the cap with headroom; to be refined by the first
    # run.
    timeout-minutes: 360
    env:
      # Part B — queue, rules, scheduler, status (fast test suites);
      # render is split out into a separate job C.
      HALF_PKGS: ./internal/queue/... ./internal/rules/... ./internal/scheduler/... ./internal/status/...
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Prepare .env
        run: cp .env.example .env

      # The tools image (dev stage) is enough: lint/tests do not run here,
      # no infrastructure is needed — the unit tests of the mutation
      # coverage are hermetic.
      - name: Build the tools image (with layer cache)
        run: $COMPOSE build tools

      - name: Mutation testing
        # The step cap is below the job cap (360) — so the always() upload
        # has time to put the reports in place when cut off (like job A,
        # see there).
        timeout-minutes: 340
        env:
          MIN_SCORE: ${{ inputs.min_score || '0.98' }}
          TEST_TIMEOUT: ${{ inputs.timeout || '60' }}
        run: |
          make mutate COMPOSE="$COMPOSE" PKGS="$HALF_PKGS" \
            MUTATION_MIN_SCORE="$MIN_SCORE" \
            MUTATE_TIMEOUT="$TEST_TIMEOUT"

      # The reports are useful both on failure (analyzing the survivors) and
      # on success (score dynamics); mutate.log mirrors the run console.
      - name: Upload reports to an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-b-${{ github.run_id }}
          retention-days: 14
          path: var/mutation/

  mutate-c:
    name: mutation testing (part C)
    # Like B: a manual targeted pkgs — only job A, C is skipped;
    # the weekly and the full manual runs drive all three parts.
    if: github.event_name != 'workflow_dispatch' || inputs.pkgs == ''
    runs-on: ubuntu-24.04
    # 6 h — the platform maximum for a hosted job; part C — render alone:
    # the slow test suite gives ~29 s/mutant (the Nov 9, 2026 measurement:
    # 544 mutants in 265 min ≈ 70–85% of the package, the full package
    # ~5.2–6.3 h). The pessimistic edge brushes the 340 step cap (cut off
    # at ~90% of the package) — even then it is more informative than the
    # old half B, the always() upload will keep the reports; the further
    # lever is speeding up the render test suite (outside this task).
    # In the old half B render did not fit into the 6 h cap together with
    # queue.
    timeout-minutes: 360
    env:
      # Part C — render: average by mutant count, but the heaviest by
      # time — a separate job.
      HALF_PKGS: ./internal/render/...
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Prepare .env
        run: cp .env.example .env

      # The tools image (dev stage) is enough: lint/tests do not run here,
      # no infrastructure is needed — the unit tests of the mutation
      # coverage are hermetic.
      - name: Build the tools image (with layer cache)
        run: $COMPOSE build tools

      - name: Mutation testing
        # The step cap is below the job cap (360) — so the always() upload
        # has time to put the reports in place when cut off (like job A,
        # see there).
        timeout-minutes: 340
        env:
          MIN_SCORE: ${{ inputs.min_score || '0.98' }}
          TEST_TIMEOUT: ${{ inputs.timeout || '60' }}
        run: |
          make mutate COMPOSE="$COMPOSE" PKGS="$HALF_PKGS" \
            MUTATION_MIN_SCORE="$MIN_SCORE" \
            MUTATE_TIMEOUT="$TEST_TIMEOUT"

      # The reports are useful both on failure (analyzing the survivors) and
      # on success (score dynamics); mutate.log mirrors the run console.
      - name: Upload reports to an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report-c-${{ github.run_id }}
          retention-days: 14
          path: var/mutation/
