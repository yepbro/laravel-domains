# Dependabot: GitHub Actions and Go dependency updates.
# Dependabot does not track base docker image versions: they are pinned
# via ARG in the Dockerfiles and by variables in .env.example (see deploy/docker/).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Only direct dependencies: indirect ones come along with them.
    # The go directive must not be bumped: the Go version is pinned wholesale
    # in .env (GO_VERSION) and in the Dockerfiles.
    allow:
      - dependency-type: direct
    groups:
      go-dependencies:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
