# Конфиг go-mutesting для make mutate (docs/mutation-testing.md).
# Формат — форк avito-tech/go-mutesting (config.yml.dist в его репозитории).
#
# Файлы без соседнего *_test.go не мутируются: убить мутанта без тестов
# невозможно — такие файлы дали бы бесконечный поток «выживших».
# Файлы, чей тест под build-тегом (например, интеграционным), — по той же
# причине: go test в мутационном прогоне их не исполняет.
skip_without_test: true
skip_with_build_tags: true
silent_mode: false
# HTML-отчёт по выжившим мутантам (рядом всегда пишется report.json).
html_output: true
