# go-mutesting config for make mutate (docs/mutation-testing.md).
# The format is a fork of avito-tech/go-mutesting (config.yml.dist in its repo).
#
# Files without a sibling *_test.go are not mutated: killing a mutant without
# tests is impossible — such files would produce an endless stream of
# "survivors". Files whose tests live under a build tag (for example, an
# integration one) are skipped for the same reason: go test in a mutation
# run does not execute them.
skip_without_test: true
skip_with_build_tags: true
silent_mode: false
# HTML report on the surviving mutants (report.json is always written alongside).
html_output: true
