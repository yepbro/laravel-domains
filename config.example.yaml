# Пример конфигурации сервисов Domain Crawler (ТЗ 5.10 основного ТЗ).
# Скопируйте в config.yaml рядом с бинарниками (или укажите путь
# переменной окружения CRAWLER_CONFIG):
#
#   cp config.example.yaml config.yaml
#
# Приоритет значений: переменные окружения > этот файл > значения по
# умолчанию. Полный список переменных и правила валидации — docs/configuration.md.

postgres:
  dsn: "postgres://crawler:PASSWORD@127.0.0.1:5432/crawler?sslmode=disable"
  # pool_size задаётся НА ОДИН сервис, а рекомендация ТЗ (20–50) — бюджет
  # СУММАРНО на все: 8 сервисов × 5 + dashboard (2 — задаёт его юнит;
  # глобальная переменная ниже его переопределит) + crawlerctl (2) +
  # админ ≈ 44–46 при max_connections=50 (3 слота резервирует superuser)
  # — docs/db.md, «Бюджет соединений». Менять — только с пересчётом суммы.
  pool_size: 5

redis:
  addr: "127.0.0.1:6379"
  # maxlen — явный предел длины всех стримов (XADD MAXLEN ~);
  # 0 — пределы по стримам по умолчанию, пересчитаны по замерам T-141
  # под бюджет Redis ≤ 0,5 ГБ (docs/redis.md §3.1): q:dns 250 пачек
  # (запись ≈ 64 КиБ на 1000 доменов, замер), штучные
  # q:http/q:render/q:analyze 150 000 (записи 0,3–0,7 КиБ), q:dead
  # 10 000 (записи без payload, байтовый потолок единицы МБ)
  maxlen: 0
  max_attempts: 3                   # доставок задачи до перевода в q:dead (ТЗ 4.2)
  claim_min_idle: "10m"             # простой pending-записи до возврата клеймом XAUTOCLAIM (окно удержания воркера)
  # Темп возврата зависших (T-153): RecoverLoop клеймит recover_batch
  # записей за проход раз в recover_interval (полная пачка — без паузы);
  # время самовосстановления PEL ≈ размер PEL / (batch/interval).
  # Инвариант: batch × худшее время записи этапа (рендер, timeout 25 с)
  # < claim_min_idle, иначе хвост пачки перклеймится и жжёт попытки;
  # дефолт 64: типовой рендер ~5 с × 64 ≈ 5,3 мин < 10 мин (запас ×1,9).
  # Поднимая batch (до 256 в инцидентах), пропорционально поднимайте
  # claim_min_idle — docs/configuration.md, раздел redis.
  recover_batch: 64
  recover_interval: "30s"           # период опроса зависших при неполной пачке (1s..1h)
  trim_interval: "1m"               # период XTRIM MINID: освобождение подтверждённого префикса стримов (T-141; 1s..24h)
  # consumer_idle — порог неактивности консьюмера группы для чистки
  # (T-155): после рестартов воркеров их pid-консьюмеры остаются в группах
  # навсегда; цикл scheduler удаляет XGROUP DELCONSUMER строго пустых
  # (pending = 0) и неактивных дольше порога — тем же темпом, что
  # trim_interval. Консьюмеры с pending не трогаются никогда
  # (DELCONSUMER с pending теряет их PEL — недоставка навсегда).
  consumer_idle: "2h"               # порог неактивности пустого консьюмера до удаления из группы (1m..30d)

ingest:
  dir: "/data/incoming"              # наблюдаемая папка: <зона>/add|delete/*.txt и архивы
  batch_size: 50000                  # строк на одну пачку COPY
  stable_seconds: 10                 # размер/mtime файла должны быть стабильны
  scan_interval: "30s"               # полный обход папки как страховка fsnotify
  max_error_ratio: 0.1               # доля отклонённых строк, выше которой файл ошибочен
  # Лимиты приёма архивов (.zip/.tar/.tar.gz/.tgz/.gz, T-133) — защита от
  # zip-бомб; превышение — архив целиком в failed/ с лог-отчётом.
  archive_max_uncompressed: "8GiB"   # потолок суммарного несжатого объёма членов
                                     # (несжатая зона .com ≈ 1,5 ГБ — с запасом)
  archive_max_files: 1000            # потолок числа записей архива

scheduler:
  recheck_interval: "4380h"          # ≈ 6 месяцев (done → pending)
  batch_size: 1000                  # норматив ТЗ 1000–10000; 1000 = замеренная пачка ≈ 64 КиБ (бюджет Redis, T-141)
  queue_high_watermark: 100000       # backpressure: выше порога задачи не публикуются
  lease: "30m"                       # срок аренды queued-домена
  temp_error_retry_after: "24h"      # повтор temp_error
  temp_error_max_retries: 3          # максимум повторов подряд, далее итоговый статус
  # Период gauge глубины backlog (GROUP BY check_state по всем живым
  # доменам, T-077). Дефолт 5 минут (T-161): на 47 млн строк (замер §12
  # docs/load-measurements.md) проход 17+ с каждые 30 с — одна из трёх
  # главных статей CPU postgres; gauge дашборда допускает пятиминутную
  # свежесть. Коридор 30s..1h; 30–60 с коридора ТЗ 5.9 — для малых
  # корпусов.
  backlog_interval: "5m"
  # Веса зон кругового выбора (ТЗ 5.3: «веса зон — опционально»): имя зоны
  # (punycode, как в справочнике zones; IDN — xn--p1ai) → вес 1..1000;
  # доля зоны в пачке пропорциональна весу. Отсутствие карты — равный
  # круговой порядок. Имени может не быть в справочнике (зону создаёт
  # ingest первым файлом) — Warn, зона проверяется с весом 1.
  # zone_weights:
  #   com: 5
  #   xn--p1ai: 2

dns:
  resolvers: ["127.0.0.1:53"]        # локальный unbound
  fallback_resolvers: ["1.1.1.1:53", "9.9.9.9:53"]   # резерв: переключение на каждый обмен при транспортном отказе локального (T-107)
  concurrency: 2000                  # потолок одновременных обменов (лимитёр T-035)
  max_qps: 10000                     # средний темп; всплески до concurrency подряд
  ipv6: true                         # false — AAAA отвечаются локально (пустой NOERROR, без сети)
  timeout: "2s"                      # таймаут одной UDP-попытки (internal/dnsclient)
  tcp_timeout: "5s"                  # таймаут TCP-fallback при усечении (TC=1)
  retries: 2                         # повторы сверх первой попытки (таймаут/сеть)
  retry_delay: "200ms"               # пауза между попытками
  udp_pool_size: 2000                # пул UDP-сокетов; обычно = concurrency

http:
  concurrency: 2000                  # транспорт: глобальный потолок одновременных соединений (T-049)
  per_ip_limit: 4                    # рекомендация ТЗ: 3–4 соединения на IP
  connect_timeout: "5s"
  tls_handshake_timeout: "5s"          # TLS-рукопожатие (таблица лимитов ТЗ 5.5)
  header_timeout: "10s"
  total_timeout: "20s"
  max_redirects: 8
  max_body_bytes: 2097152            # 2 MiB
  min_body_speed: 2048               # мин. скорость тела после первого байта, байт/с — тарпиты (ТЗ 5.5)
  max_rps: 1000                      # глобальный темп запросов (RPS); всплески до concurrency
  block_internal_addrs: false        # SSRF: не ходить по редиректам на внутренние адреса (loopback/RFC1918/link-local); для Internet-боевой эксплуатации включить
  user_agent: "DomainCrawler/1.0 (+https://example.example/contact; admin@example.example)"  # честный UA с контактами — обязателен; подставьте реальные контакты оператора (ТЗ §9)
  # Задачный параллелизм цикла http-worker (T-139; не транспорт!):
  # потребление q:http скользящее — следующее чтение при освобождении
  # слота задачи, окно чтения параллелизм не ограничивает. Дефолт 192
  # (T-157; прежний 256 — замеры T-092/§11: 47.6 дом/с): сутки на 256 —
  # два фатала юнита (§12: 05:48 OOM-kill, 09:17 пик 900.5 MiB =
  # MemoryMax; MemoryHigh 850M — 120 095 reclaim-событий), 192 слота
  # устойчивы (этап 22: 860–893 MiB, oom=0, NRestarts=0; скорость
  # ≈17–19 дом/с). Временно до T-163 (стриминг тел — ниже память
  # слота), после — вернуть 256 по замеру;
  # память = task_concurrency × пиковая память задачи (тела
  # записей-оригиналов, каждое ≤ max_body_bytes, + буферы) ≈3.34 MiB
  # на слот → 256 → anon ≈855 MiB при MemoryMax юнита http-worker 900M;
  # поднимайте task_concurrency только с пересчётом этого бюджета.
  task_concurrency: 192              # одновременных задач q:http (доменов) в цикле воркера
  task_consume: 16                   # записей за одно чтение: пачка XREADGROUP + буфер предвыборки; столько же неудач подряд — порог предохранителя паузы
  task_per_domain: 8                 # параллельных проверок (субдомен × протокол) внутри задачи домена

render:
  # remote_url — расширение dev-окружения: внешний Chromium по CDP.
  # В боевом режиме воркер запускает браузер сам, оставьте пустым.
  remote_url: ""
  # Параллельные страницы Chromium (слоты пула). Дефолт 8 (T-169) —
  # осознанное превышение рекомендации ТЗ 5.6 (2–4) по замеру: спрос при
  # свободном гейте ≈1,2 стр/с (замер §12, docs/load-measurements.md),
  # ёмкость 4 контекстов ≈0,8 стр/с (5,1 с/страница, T-092 §4) — дренаж
  # q:render сравнялся с притоком, лаг ~99 тыс. у watermark 100К не таял;
  # 8 ≈ 1,6 стр/с — выше спроса (прецедент 3→4 — T-142). Память Chromium
  # растёт сублинейно: RSS при 4 контекстах ~550 МБ, порог перезапуска
  # restart_memory_bytes 1,5 ГиБ и cgroup ≈2 ГБ (ТЗ 3.2); после деплоя —
  # повторный замер, при систематическом проживании RSS у порога — второй
  # Chromium (:9223) и второй render-worker (deploy.md §2.2).
  contexts: 8
  timeout: "25s"
  # Тарпит-бюджет рендера (T-148): сколько доставок задачи могут завершиться
  # таймаутом страницы (timeout), прежде чем запись финализируется БЕЗ
  # рендера — итогом остаётся сырой HTML HTTP-фазы (rendered = false),
  # запись уходит в q:analyze, доставка подтверждается. Тяжёлая страница
  # не падает в q:dead и не жжёт попытки как случайная ошибка; q:dead —
  # только инфраструктурным ошибкам (БД, браузер, публикация). Обязан
  # быть не выше redis.max_attempts (проверяется валидацией).
  timeout_attempts: 2
  restart_every_pages: 500
  # Порог перезапуска браузера по памяти: суммарный RSS процессов Chromium
  # (боевой режим) ≥ порога → перезапуск до cgroup-OOM; 0 — отключить.
  # Ниже лимита контейнера (бюджет Chromium ≈ 2 ГБ, ТЗ 3.2). При 8
  # контекстах порог не поднимается (T-169): запас 512 МиБ покрывает рост
  # RSS страниц в полёте между проверками (раз в задачу); проживание у
  # порога — насыщение одного Chromium (ответ — второй Chromium :9223,
  # deploy.md §2.2, не подъём порога).
  restart_memory_bytes: "1536MiB"

content:
  dir: "/data/content"                # пак-файлы pack-NNNNNN.pack (docs/content.md)
  pack_size: "512MB"                 # порог ротации пака; рекомендация ТЗ: 512 МБ–1 ГБ
  max_store_bytes: 2097152           # лимит одного контента; рекомендация ТЗ: 1–2 МБ
  zstd_dictionary: "/data/content/dict.zst"   # crawlerctl dict train; пусто — без словаря
  disk_free_percent: 5               # порог свободного места каталога контента, %:
                                     # ниже — пауза записи контента + алерт (ТЗ 8)
  # Retention контента и трим jsonb не-находок (T-166): записи старше окна,
  # не Laravel-находки и не ждущие рендера теряют content_hash и тяжёлые
  # jsonb; паспорт строки остаётся (docs/content.md). Стационарный объём
  # контента = суточный приток × окно (при 20 GiB/сут 6 ч ≈ 5 GiB).
  retention: "6h"                    # окно жизни контента не-находок; 0 — выключено
  retention_interval: "1h"           # период проходов цикла (место возвращает
                                     # часовая компактификация паков T-045)
  retention_batch: 10000             # строк в пачке-транзакции; вилка 10–50 тыс.
  retention_analyze_watermark: 0     # порог интерлока: глубина q:analyze ≥ порога —
                                     # анализатор не успевает, проход пропускается;
                                     # 0 — общий scheduler.queue_high_watermark

analyzer:
  rules_dir: "/etc/crawler/rules"    # YAML-правила Laravel (ТЗ 5.8)
  laravel_min_score: 0.6             # порог is_laravel, диапазон (0, 1]

subdomains:                          # начальное наполнение таблицы subdomains;
  - ""                               # "" — апекс домена; максимум 63 (dns_mask)
  - "www"
  - "admin"
  - "crm"
  - "api"
  - "app"

monitor:
  # Loopback: метрики и пробы (livez/healthz) не выставляются на внешние
  # интерфейсы (ТЗ §9);
  # «:9100» (все интерфейсы) — только внутри docker-сети (config.dev.yaml).
  listen: "127.0.0.1:9100"
  # Период пересчёта счётчиков зон и цикла алертов. Дефолт 5 минут
  # (T-161, замер §12: UPDATE-агрегат по 47 млн строк — статья CPU
  # postgres; пятиминутная свежесть счётчиков достаточна); коридор
  # 30s..1h, 30–60 с коридора ТЗ 5.9 — для малых корпусов (dev-конфиг
  # docker держит 60s).
  zone_stats_interval: "5m"
  # Зонд алерта мусорных content_hash (T-099): /metrics сервиса ingest
  # (loopback по METRICS_ADDR юнита); пустая строка — алерт «не измеряется».
  ingest_metrics_url: "http://127.0.0.1:9101/metrics"

web:
  # Публичный лендинг (этап 13, T-121): публичный порт системы для
  # посетителей — наружу публикует reverse-proxy с TLS (deploy/nginx/ —
  # первый образец, T-124), сам сервис держит loopback; метрики web —
  # на METRICS_ADDR (127.0.0.1:9107). listen — [host]:port или
  # абсолютный путь unix-сокета (вариант деплоя за nginx).
  # Операторский дашборд — отдельный слушатель dashboard.listen (ТЗД).
  listen: "127.0.0.1:8080"
  rate_limit: 4                      # живых проверок формы с IP в минуту (T-123)
  timeout: "60s"                     # потолок живой проверки: DNS→HTTP→рендер→анализ

dashboard:
  # Операторский дашборд конвейера (ТЗД): публичный адрес страниц и API.
  # Дефолт — loopback: публикация наружу — reverse-proxy с TLS (ТЗД §9.1),
  # не сам сервис; метрики дашборда — на METRICS_ADDR (127.0.0.1:9108).
  listen: "127.0.0.1:8090"
  refresh: "5s"                      # период сборки снимка, коридор 1s..5m (ТЗД §8.3)
  # TTL кэша тяжёлых агрегатов сводки (зоны/темп/статусы — полные
  # проходы domains, T-161): в окне TTL проходы refresh не повторяют
  # агрегат; дефолт 60 с — нижняя граница коридора 1m..5m постановки
  # (при refresh 5 с — один полный проход domains в минуту вместо
  # двенадцати). Лёгкие секции (последние находки, журнал ingest)
  # остаются живыми каждый проход.
  status_cache_ttl: "1m"
  # Креды оператора (HTTP Basic): обязательны для запуска cmd/dashboard
  # (ТЗД §7.7), остальные сервисы секцию игнорируют. password_hash
  # генерируется командой crawlerctl dashboard-secret (пароль — аргумент
  # или stdin); открытый пароль в конфиге и окружении запрещён (ТЗД §7.2).
  # username: "admin"
  # password_hash: "pbkdf2-sha256$600000$…$…"
  # Пробы живости сервисов для секции здоровья (ТЗД §5.8): имя → базовый
  # URL метрик (каркас отдаёт /livez); в systemd-деплое — loopback-адреса
  # метрик юнитов (полный список — docs/deploy.md), в docker-сети — имя
  # сервиса и его METRICS_PORT (deploy/docker/config.dev.yaml).
  # Пустая карта — секция «н/д».
  # probes:
  #   dns-worker: "http://127.0.0.1:9103"
  #   http-worker: "http://127.0.0.1:9104"

log:
  level: "info"                      # уровень логирования сервисов: debug|info|warn|error
