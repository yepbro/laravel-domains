# Пример конфигурации сервисов Domain Crawler (ТЗ 5.10 основного ТЗ).
# Скопируйте в config.yaml рядом с бинарниками (или укажите путь
# переменной окружения CRAWLER_CONFIG):
#
#   cp config.example.yaml config.yaml
#
# Приоритет значений: переменные окружения > этот файл > значения по
# умолчанию. Полный список переменных и правила валидации — docs/configuration.md.

postgres:
  dsn: "postgres://crawler:PASSWORD@127.0.0.1:5432/crawler?sslmode=disable"
  # pool_size задаётся НА ОДИН сервис, а рекомендация ТЗ (20–50) — бюджет
  # СУММАРНО на все: 8 сервисов × 5 + dashboard (2 — задаёт его юнит;
  # глобальная переменная ниже его переопределит) + crawlerctl (2) +
  # админ ≈ 44–46 при max_connections=50 (3 слота резервирует superuser)
  # — docs/db.md, «Бюджет соединений». Менять — только с пересчётом суммы.
  pool_size: 5

redis:
  addr: "127.0.0.1:6379"
  # maxlen — явный предел длины всех стримов (XADD MAXLEN ~);
  # 0 — пределы по стримам по умолчанию, пересчитаны по замерам T-141
  # под бюджет Redis ≤ 0,5 ГБ (docs/redis.md §3.1): q:dns 250 пачек
  # (запись ≈ 64 КиБ на 1000 доменов, замер), штучные
  # q:http/q:render/q:analyze 150 000 (записи 0,3–0,7 КиБ), q:dead
  # 10 000 (записи без payload, байтовый потолок единицы МБ)
  maxlen: 0
  max_attempts: 3                   # доставок задачи до перевода в q:dead (ТЗ 4.2)
  claim_min_idle: "10m"             # простой pending-записи до возврата клеймом XAUTOCLAIM (окно удержания воркера)
  # Темп возврата зависших (T-153): RecoverLoop клеймит recover_batch
  # записей за проход раз в recover_interval (полная пачка — без паузы);
  # время самовосстановления PEL ≈ размер PEL / (batch/interval).
  # Инвариант: batch × худшее время записи этапа (рендер, timeout 15 с)
  # < claim_min_idle, иначе хвост пачки перклеймится и жжёт попытки;
  # дефолт 64: типовой рендер ~5 с × 64 ≈ 5,3 мин < 10 мин (запас ×1,9).
  # Поднимая batch (до 256 в инцидентах), пропорционально поднимайте
  # claim_min_idle — docs/configuration.md, раздел redis.
  recover_batch: 64
  recover_interval: "30s"           # период опроса зависших при неполной пачке (1s..1h)
  trim_interval: "1m"               # период XTRIM MINID: освобождение подтверждённого префикса стримов (T-141; 1s..24h)
  # consumer_idle — порог неактивности консьюмера группы для чистки
  # (T-155): после рестартов воркеров их pid-консьюмеры остаются в группах
  # навсегда; цикл scheduler удаляет XGROUP DELCONSUMER строго пустых
  # (pending = 0) и неактивных дольше порога — тем же темпом, что
  # trim_interval. Консьюмеры с pending не трогаются никогда
  # (DELCONSUMER с pending теряет их PEL — недоставка навсегда).
  consumer_idle: "2h"               # порог неактивности пустого консьюмера до удаления из группы (1m..30d)

ingest:
  dir: "/data/incoming"              # наблюдаемая папка: <зона>/add|delete/*.txt и архивы
  batch_size: 50000                  # строк на одну пачку COPY
  stable_seconds: 10                 # размер/mtime файла должны быть стабильны
  scan_interval: "30s"               # полный обход папки как страховка fsnotify
  max_error_ratio: 0.1               # доля отклонённых строк, выше которой файл ошибочен
  # Лимиты приёма архивов (.zip/.tar/.tar.gz/.tgz/.gz, T-133) — защита от
  # zip-бомб; превышение — архив целиком в failed/ с лог-отчётом.
  archive_max_uncompressed: "8GiB"   # потолок суммарного несжатого объёма членов
                                     # (несжатая зона .com ≈ 1,5 ГБ — с запасом)
  archive_max_files: 1000            # потолок числа записей архива

scheduler:
  recheck_interval: "4380h"          # ≈ 6 месяцев (done → pending)
  batch_size: 1000                  # норматив ТЗ 1000–10000; 1000 = замеренная пачка ≈ 64 КиБ (бюджет Redis, T-141)
  queue_high_watermark: 100000       # backpressure: выше порога задачи не публикуются (ворота ёмкости q:render — отдельный render.queue_high_watermark, T-174)
  lease: "30m"                       # срок аренды queued-домена
  temp_error_retry_after: "24h"      # повтор temp_error
  temp_error_max_retries: 3          # максимум повторов подряд, далее итоговый статус
  # Период gauge глубины backlog (T-077): суммы инкрементальных
  # счётчиков зон (T-178) — чтение справочника, миллисекунды; период
  # задаёт свежесть gauge дашборда, не нагрузку. Дефолт 5 минут,
  # коридор 30s..1h; 30–60 с коридора ТЗ 5.9 — для малых корпусов.
  backlog_interval: "5m"
  # Веса зон кругового выбора (ТЗ 5.3: «веса зон — опционально»): имя зоны
  # (punycode, как в справочнике zones; IDN — xn--p1ai) → вес 1..1000;
  # доля зоны в пачке пропорциональна весу. Отсутствие карты — равный
  # круговой порядок. Имени может не быть в справочнике (зону создаёт
  # ingest первым файлом) — Warn, зона проверяется с весом 1.
  # zone_weights:
  #   com: 5
  #   xn--p1ai: 2

dns:
  resolvers: ["127.0.0.1:53"]        # локальный unbound
  fallback_resolvers: ["1.1.1.1:53", "9.9.9.9:53"]   # резерв: переключение на каждый обмен при транспортном отказе локального (T-107)
  concurrency: 2000                  # потолок одновременных обменов (лимитёр T-035)
  max_qps: 10000                     # средний темп; всплески до concurrency подряд
  ipv6: true                         # false — AAAA отвечаются локально (пустой NOERROR, без сети)
  timeout: "2s"                      # таймаут одной UDP-попытки (internal/dnsclient)
  tcp_timeout: "5s"                  # таймаут TCP-fallback при усечении (TC=1)
  retries: 2                         # повторы сверх первой попытки (таймаут/сеть)
  retry_delay: "200ms"               # пауза между попытками
  udp_pool_size: 2000                # пул UDP-сокетов; обычно = concurrency

http:
  concurrency: 2000                  # транспорт: глобальный потолок одновременных соединений (T-049)
  per_ip_limit: 4                    # рекомендация ТЗ: 3–4 соединения на IP
  # Повышенные лимиты per-IP для префиксов парковщиков (T-165): карта
  # «CIDR → лимит», матчинг диалимого IP по самому длинному совпавшему
  # префиксу (longest-prefix); одна сеть дважды не валидна
  # («195.208.0.0/16» и «195.208.9.9/16» — одна сеть). Мотивация:
  # head-of-line парковочных IP (T-092 §3) — миллионы доменов com/xyz
  # на IP парковщиков, per_ip_limit 4 при FIFO растягивает задачи к 20 с.
  # Материал для выбора префиксов — гистограмма ожидания слота
  # crawler_http_per_ip_wait_seconds (:9104): доля ожиданий > 2 с
  # (корзина le=2) ≥ 5% на смеси боя — вот когда override оправдан.
  # Лимиты 1..64 (диапазон per_ip_limit), параллелизм в любом случае
  # ограничен http.concurrency. Отсутствие карты — один per_ip_limit
  # на все IP (прежнее поведение). Env:
  #   CRAWLER_HTTP_PER_IP_OVERRIDES=195.208.0.0/16=12,2a02:6b8::/32=8
  # per_ip_overrides:
  #   "195.208.0.0/16": 12
  #   "2a02:6b8::/32": 8
  connect_timeout: "5s"
  tls_handshake_timeout: "5s"          # TLS-рукопожатие (таблица лимитов ТЗ 5.5)
  header_timeout: "10s"
  total_timeout: "20s"
  max_redirects: 8
  max_body_bytes: 2097152            # 2 MiB
  min_body_speed: 2048               # мин. скорость тела после первого байта, байт/с — тарпиты (ТЗ 5.5)
  max_rps: 1000                      # глобальный темп запросов (RPS); всплески до concurrency
  block_internal_addrs: false        # SSRF: не ходить по редиректам на внутренние адреса (loopback/RFC1918/link-local); для Internet-боевой эксплуатации включить
  user_agent: "DomainCrawler/1.0 (+https://example.example/contact; admin@example.example)"  # честный UA с контактами — обязателен; подставьте реальные контакты оператора (ТЗ §9)
  # Задачный параллелизм цикла http-worker (T-139; не транспорт!):
  # потребление q:http скользящее — следующее чтение при освобождении
  # слота задачи, окно чтения параллелизм не ограничивает. Дефолт 192
  # (T-157; прежний 256 — замеры T-092/§11: 47.6 дом/с): сутки на 256 —
  # два фатала юнита (§12: 05:48 OOM-kill, 09:17 пик 900.5 MiB =
  # MemoryMax; MemoryHigh 850M — 120 095 reclaim-событий), 192 слота
  # устойчивы (пропитка волны 21: 860–893 MiB, oom=0, NRestarts=0;
  # скорость ≈17–19 дом/с). Замеры сделаны до раннего Put T-147 (тела
  # больше не удерживаются до конца задачи); T-163 добавил метрики
  # замера слота (crawler_http_tasks_inflight, crawler_http_body_bytes_
  # inflight, crawler_http_body_bytes на :9104) и мягкий потолок кучи
  # (mem_limit ниже) — возврат 256 по замеру сэмплером после деплоя;
  # память = task_concurrency × (метаданные задачи + транзитные буферы
  # ≤ task_per_domain × max_body_bytes), поднимайте task_concurrency
  # только с пересчётом этого бюджета.
  task_concurrency: 192              # одновременных задач q:http (доменов) в цикле воркера
  task_consume: 16                   # записей за одно чтение: пачка XREADGROUP + буфер предвыборки; столько же неудач подряд — порог предохранителя паузы
  task_per_domain: 8                 # параллельных проверок (субдомен × протокол) внутри задачи домена
  # Dead-host cutoff (T-164): apex и www, не прошедшие connect-фазу
  # (connection refused или connect-таймаут по ОБОИМ протоколам),
  # завершают задачу без проверки остальных субдоменов — мёртвые хосты
  # массовых зон перестают жечь слоты таймаутным хвостом (замер §12
  # docs/load-measurements.md: mean 11.5 с при транспорте 0.54 с/запрос,
  # 60% задач в бакете 10–30 с). Записи пропущенных субдоменов — по §8
  # («нет ответа»: записей нет), признак — бит dead_host_cutoff в
  # domains.flags и метрики crawler_http_dead_host_cutoff_* (:9104) — по
  # ним строится контрольная выборка ложных cutoff (критерий < 1%).
  # Дефолт true: сигнатура строгая (оба главных хоста × оба протокола ×
  # только connect-фаза); connect-таймауты дают temp_error и перепроверку
  # T-031 (ложный cutoff самозалечивается). false — прежнее поведение.
  dead_host_cutoff: true
  # Мягкий потолок памяти Go-рантайма http-worker (T-163,
  # debug.SetMemoryLimit): у порога GC сам возвращает страницы ОС —
  # вместо reclaim-штормов ядра на MemoryHigh и OOM-kill на MemoryMax
  # (фаталы T-157). Page cache записи паков в учёт не входит — держите
  # ниже MemoryHigh юнита с запасом (дефолт 768 MiB против 850M/900M;
  # юнит — deploy/systemd/crawler-http-worker.service). Живая куча выше
  # потолка не роняет процесс: GC до 50% CPU (замедление, не смерть).
  # 0 — выключено.
  mem_limit: "768MiB"                  # мягкий потолок кучи Go-рантайма http-worker

render:
  # remote_url — расширение dev-окружения: внешний Chromium по CDP.
  # В боевом режиме воркер запускает браузер сам, оставьте пустым.
  remote_url: ""
  # Параллельные страницы Chromium (слоты пула). Значение привязано к
  # железу: замер 24.10 на проде (4 ядра) — 8 контекстов давали load
  # 16.5 и CPU-голод (страницы не успевали — таймауты), 4 — тот же
  # полезный темп (~65 зад/мин) при load ~12.6. 8 (T-169) — для машин
  # с запасом ядер: спрос при свободном гейте ≈1,2 стр/с (замер §12,
  # docs/load-measurements.md), ёмкость 4 контекстов ≈0,8 стр/с
  # (5,1 с/страница, T-092 §4). Память Chromium растёт сублинейно:
  # RSS при 4 контекстах ~550 МБ, порог перезапуска
  # restart_memory_bytes 1,5 ГиБ и cgroup ≈2 ГБ (ТЗ 3.2); потолок
  # одного Chromium — второй Chromium (:9223) и второй render-worker
  # (deploy.md §2.2).
  contexts: 4
  # Ступень 2 T-169 (значение прода с 23.10): хвост успешных рендеров
  # >15 с — 13% (<20% критерия, гистограмма :9105); тарпит-финализация
  # теперь timeout_attempts × 15 с. 25 с — если хвост тяжелее критерия
  # и редкие сверхтяжёлые страницы важнее коротких тарпитов.
  timeout: "15s"
  # Тарпит-бюджет рендера (T-148): сколько доставок задачи могут завершиться
  # таймаутом страницы (timeout), прежде чем запись финализируется БЕЗ
  # рендера — итогом остаётся сырой HTML HTTP-фазы (rendered = false),
  # запись уходит в q:analyze, доставка подтверждается. Тяжёлая страница
  # не падает в q:dead и не жжёт попытки как случайная ошибка; q:dead —
  # только инфраструктурным ошибкам (БД, браузер, публикация). Обязан
  # быть не выше redis.max_attempts (проверяется валидацией).
  # С 24.10 на проде 1: при 2 тарпит-запись между попытками ждала
  # claim_min_idle 10 мин (XAUTOCLAIM), сжигая слот-время воркера на
  # перепопытки; 1 — финализация с первого таймаута. 2 — если тяжёлым
  # страницам нужен шанс на повторе в изменившихся условиях.
  timeout_attempts: 1
  restart_every_pages: 500
  # Порог перезапуска браузера по памяти: суммарный RSS процессов Chromium
  # (боевой режим) ≥ порога → перезапуск до cgroup-OOM; 0 — отключить.
  # Ниже лимита контейнера (бюджет Chromium ≈ 2 ГБ, ТЗ 3.2). При 8
  # контекстах порог не поднимается (T-169): запас 512 МиБ покрывает рост
  # RSS страниц в полёте между проверками (раз в задачу); проживание у
  # порога — насыщение одного Chromium (ответ — второй Chromium :9223,
  # deploy.md §2.2, не подъём порога).
  restart_memory_bytes: "1536MiB"
  # Ворота ёмкости q:render (T-174): глубина стрима (backlog группы
  # потребления) ≥ порога — SPA-записи не публикуются, домен получает
  # флаг render_pending той же транзакцией результата (доработается
  # проходом позже — задачи не теряются); ниже порога — публикация как
  # обычно. Отдельный порог, а не общий scheduler.queue_high_watermark:
  # при клампе T-168 (min(lag, XLEN)+pending) общий порог 100 тыс.
  # держал ворота открытыми при лаге 98,4 тыс. — приток равнялся
  # потреблению (равновесие 24.10), дренаж долга нулевой. Дефолт
  # 10 тыс. ≈ 2 ч буфера потребления (замер 24.10: ≈5,1 тыс. задач/ч):
  # закрывает ворота на текущем долге и возвращает гистерезис
  # «дренируем — впускаем». Эффективное значение — с клампом
  # min(watermark, MAXLEN/2), как у гейта публикации (при дефолте не
  # активен: 10 тыс. < 75 тыс.). 0 — общий
  # scheduler.queue_high_watermark.
  queue_high_watermark: 10000
  # Приоритет дренажа рендер-долга (T-184, решение (а) замера T-176):
  # имена зон (punycode, как в справочнике zones), чей долг
  # (флаг render_pending) проход доработки обслуживает по остаточному
  # принципу — пачка прохода собирается сначала доменами остальных зон
  # (высокий DOM-вклад рендера), долг перечисленных зон добирается при
  # их исчерпании; записи не теряются, зоны списка дорабатываются
  # последними. Ворота q:render дозируют публикации — приоритет
  # распоряжается освободившейся ёмкостью. Пустой список (умолчание) —
  # прежний порядок без фильтра зон (T-181). Наблюдаемость — поле
  # deprioritized строки «проход доработки рендера» журнала http-worker.
  # Прод (замер T-176): парковочные .рф — 98–99% состоявшихся рендеров
  # с выходом 0,5% находок:
  # requeue_deprioritized_zones:
  #   - "xn--p1ai"

content:
  dir: "/data/content"                # пак-файлы pack-NNNNNN.pack (docs/content.md)
  pack_size: "512MB"                 # порог ротации пака; рекомендация ТЗ: 512 МБ–1 ГБ
  max_store_bytes: 2097152           # лимит одного контента; рекомендация ТЗ: 1–2 МБ
  zstd_dictionary: "/data/content/dict.zst"   # crawlerctl dict train; пусто — без словаря
  disk_free_percent: 5               # порог свободного места каталога контента, %:
                                     # ниже — пауза записи контента + алерт (ТЗ 8)
  # Retention контента и трим jsonb не-находок (T-166): записи старше окна,
  # не Laravel-находки и не ждущие рендера теряют content_hash и тяжёлые
  # jsonb; паспорт строки остаётся (docs/content.md). Стационарный объём
  # контента = суточный приток × окно (при 20 GiB/сут 6 ч ≈ 5 GiB).
  retention: "6h"                    # окно жизни контента не-находок; 0 — выключено
  retention_interval: "1h"           # период проходов цикла (место возвращает
                                     # часовая компактификация паков T-045)
  retention_batch: 10000             # строк в пачке-транзакции; вилка 10–50 тыс.
  retention_analyze_watermark: 0     # порог интерлока: глубина q:analyze ≥ порога —
                                     # анализатор не успевает, проход пропускается;
                                     # 0 — общий scheduler.queue_high_watermark

analyzer:
  rules_dir: "/etc/crawler/rules"    # YAML-правила Laravel (ТЗ 5.8)
  laravel_min_score: 0.6             # порог is_laravel, диапазон (0, 1]

subdomains:                          # начальное наполнение таблицы subdomains;
  - ""                               # "" — апекс домена; максимум 63 (dns_mask)
  - "www"
  - "admin"
  - "crm"
  - "api"
  - "app"

monitor:
  # Loopback: метрики и пробы (livez/healthz) не выставляются на внешние
  # интерфейсы (ТЗ §9);
  # «:9100» (все интерфейсы) — только внутри docker-сети (config.dev.yaml).
  listen: "127.0.0.1:9100"
  # Период реконсиляции инкрементальных счётчиков конвейера и цикла
  # алертов (T-178): один совмещённый проход (колонки зон + строки
  # crawler_counters) — единственный полный проход domains в
  # стационаре; между проходами счётчики ведут дельты переходов.
  # Дефолт 5 минут (T-161, замер §12: десятки секунд на 47 млн строк;
  # пятиминутная свежесть достаточна, дрейф в стационаре обязан быть
  # нулевым — по замеру дрейфа можно разредить до 15–30 мин);
  # коридор 30s..1h, 30–60 с коридора ТЗ 5.9 — для малых корпусов
  # (dev-конфиг docker держит 60s).
  zone_stats_interval: "5m"
  # Отчёт системной нагрузки оператору (T-173): раз в период — снимок
  # в Telegram (та же доставка, что у алертов) и журнал monitor:
  # CPU/PSI/load, топ процессов (htop-вид: CPU и RSS по имени), RAM/swap,
  # свободное место каталога контента, глубина очередей q:* и темп их
  # потребления. Дефолт 10 минут; 0 — выключить; коридор 1m..1h.
  load_report_interval: "10m"
  # Медленные запросы PostgreSQL (T-177): цикл опрашивает pg_stat_activity,
  # выполняемые дольше порога клиентские операторы уходят в Telegram той же
  # доставкой, что алерты и отчёт нагрузки (дебаунс pid+query_start — каждый
  # оператор один раз; собственные агрегаты monitor исключены
  # application_name пула), дублируются Warn в журнал и метрики
  # crawler_pg_slow_queries*. Полный посмертный след — журнал сервера
  # PostgreSQL (log_min_duration_statement=3s, боевой конфиг T-086).
  # Порог по умолчанию 3 с — как у лога сервера; коридор 1s..1h;
  # интервал 10 с (снимок дешёвый), 0 — выключить, коридор 5s..10m.
  slow_query_interval: "10s"
  slow_query_min_duration: "3s"
  # Зонд алерта мусорных content_hash (T-099): /metrics сервиса ingest
  # (loopback по METRICS_ADDR юнита); пустая строка — алерт «не измеряется».
  ingest_metrics_url: "http://127.0.0.1:9101/metrics"
  # Цикл рендер-долга (T-175): раз в период — счётчик доменов с флагом
  # render_pending (crawler_counters, ведут переходы бита) + лаг q:render
  # в gauge crawler_render_pending_domains и строкой сводки в журнал
  # (Debug); та же цифра — строкой в отчёте нагрузки T-173. Дефолт
  # 5 минут (как пересчёт зон: проход дешёвый — Lookup + XLEN, период
  # выбирает свежесть, долг — медленная величина); коридор 30s..1h
  # (по образцу zone_stats_interval). Алерт render_debt ходит проходом
  # алертов (zone_stats_interval), это поле его частоту не задаёт.
  render_debt_interval: "5m"
  # Алерты T-162: недостающие пороги ТЗ 5.9 (замер §12) и доставка
  # оператору. Пороги очередей/процента диска остаются в своих секциях
  # (scheduler.queue_high_watermark, content.disk_free_percent).
  alerts:
    # Доставка переходов алертов (срабатывание 🚨 / снятие ✅ отдельными
    # сообщениями, дубли дебаунсятся) в Telegram тем же ботом/группой,
    # что и извещения CI/CD (§10.4). Секреты не в YAML: monitor берёт
    # TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID из EnvironmentFile юнита
    # (/etc/crawler/crawler.env) — нет любого → доставка выключена,
    # алерты остаются Warn в журнале. Скрипт ставится на хост руками
    # (docs/operations.md §4.3: деплой везёт только бинарники).
    telegram: true
    telegram_script: "/opt/crawler/bin/telegram-notify.sh"
    # Абсолютный минимум свободного места каталога контента (Warn) и
    # эскалация (отдельный алерт): процентный порог на томе 79 ГБ
    # поздний — 10 % = 8 ГБ ≈ 5 ч до заполнения при темпе ≈36 GiB/сут
    # (замер §12); 15/10 GiB дают запас на разбор независимо от тома.
    disk_free_min_bytes: "15GiB"
    disk_free_crit_bytes: "10GiB"
    # Замороженная очередь: last-delivered-id группы стрима не движется
    # при глубине > 0 (сигнатура отравленной задачи T-159 — потребитель
    # не читает); живая группа двигает ID каждые секунды.
    queue_freeze_window: "15m"
    # Голод CPU по PSI some (avg300): выше порога устойчиво окно —
    # разовые шпильки (деплой, ретро-пачки) алертом не считаются.
    psi_cpu_percent: 90
    psi_cpu_window: "30m"
    # Троттлинг MemoryHigh: проходов алертов подряд с ростом счётчика
    # memory.events high юнита (предвестник фаталов http-worker T-157);
    # 2 × 5 мин = 10 мин устойчивого reclaim-давления.
    mem_high_passes: 2
    # Накопление рендер-долга (T-175): долг (флаги render_pending по
    # счётчику + лаг q:render) выше порога И растёт N проходов подряд —
    # приток SPA обгоняет дренаж (алерт queue_frozen такой случай не
    # ловит: доставки идут). 50 тыс. — ниже долга морозки 24.10
    # (443 тыс., найден ручным SQL), выше фона локальных переполнений
    # (тысячи, гасятся проходом доработки за минуты). Сработавший алерт
    # держится до дренажа ниже 90 % порога (гистерезис: колебания лага
    # при стационарном долге не качают эпизод 🚨/✅; стагнация без роста
    # оператора не будит — видна строкой отчёта нагрузки и gauge).
    render_debt_domains: 50000
    # 2 × 5 мин = 10 мин непрерывного роста (по образцу mem_high_passes;
    # проход серии — период цикла алертов zone_stats_interval):
    # разовый скачок волны SPA — штатное переполнение, устойчивый рост —
    # стационарное накопление.
    render_debt_passes: 2

web:
  # Публичный лендинг (этап 13, T-121): публичный порт системы для
  # посетителей — наружу публикует reverse-proxy с TLS (deploy/nginx/ —
  # первый образец, T-124), сам сервис держит loopback; метрики web —
  # на METRICS_ADDR (127.0.0.1:9107). listen — [host]:port или
  # абсолютный путь unix-сокета (вариант деплоя за nginx).
  # Операторский дашборд — отдельный слушатель dashboard.listen (ТЗД).
  listen: "127.0.0.1:8080"
  rate_limit: 4                      # живых проверок формы с IP в минуту (T-123)
  timeout: "60s"                     # потолок живой проверки: DNS→HTTP→рендер→анализ

dashboard:
  # Операторский дашборд конвейера (ТЗД): публичный адрес страниц и API.
  # Дефолт — loopback: публикация наружу — reverse-proxy с TLS (ТЗД §9.1),
  # не сам сервис; метрики дашборда — на METRICS_ADDR (127.0.0.1:9108).
  listen: "127.0.0.1:8090"
  refresh: "5s"                      # период сборки снимка, коридор 1s..5m (ТЗД §8.3)
  # TTL кэша тяжёлых агрегатов сводки (зоны/темп/статусы — полные
  # проходы domains, T-161): в окне TTL проходы refresh не повторяют
  # агрегат; дефолт 60 с — нижняя граница коридора 1m..5m постановки
  # (при refresh 5 с — один полный проход domains в минуту вместо
  # двенадцати). Лёгкие секции (последние находки, журнал ingest)
  # остаются живыми каждый проход.
  status_cache_ttl: "1m"
  # Креды оператора (HTTP Basic): обязательны для запуска cmd/dashboard
  # (ТЗД §7.7), остальные сервисы секцию игнорируют. password_hash
  # генерируется командой crawlerctl dashboard-secret (пароль — аргумент
  # или stdin); открытый пароль в конфиге и окружении запрещён (ТЗД §7.2).
  # username: "admin"
  # password_hash: "pbkdf2-sha256$600000$…$…"
  # Пробы живости сервисов для секции здоровья (ТЗД §5.8): имя → базовый
  # URL метрик (каркас отдаёт /livez); в systemd-деплое — loopback-адреса
  # метрик юнитов (полный список — docs/deploy.md), в docker-сети — имя
  # сервиса и его METRICS_PORT (deploy/docker/config.dev.yaml).
  # Пустая карта — секция «н/д».
  # probes:
  #   dns-worker: "http://127.0.0.1:9103"
  #   http-worker: "http://127.0.0.1:9104"

log:
  level: "info"                      # уровень логирования сервисов: debug|info|warn|error
