# The production Laravel detection rule set (spec §5.8; the is_laravel
# threshold — score >= 0.6, the analyzer.laravel_min_score config, §13.1).
# All firings (any rule) are written to laravel_findings, so weak signs
# deliberately get a low weight: on their own they stay below the threshold
# and do not reach laravel_domains.
#
# The weight (0..1] — the "strength" of a sign: the rarer it is outside
# Laravel, the higher. Independent signs accumulate — noisy-OR: 1 − Π(1 − wᵢ)
# (spec §5.8); the 0.6 threshold is reached by 1–2 strong signs or a
# combination of weak ones.
#
# T-116 calibration (a cross-check against larasites, 2026-10-19): a stateless
# API (an api subdomain without a session on the front page) is detected by
# the XSRF-TOKEN cookie pair + the encrypted envelope — 0.25 + 0.5 → 0.625
# ≥ 0.6; for that the weight of cookie_encrypted_payload was raised from 0.45
# (the pair gave 0.5875 — the site dropped out of laravel_domains). Noisy
# combinations without the encrypted cookie stay below the threshold: the
# Rails pair csrf-meta + *_session — 0.32; the CodeIgniter triple
# ci_session + csrf-meta + the _token form — 0.49. The 0.6 threshold did not
# change.
#
# T-134 calibration (a cross-check against larasites, 2026-10-19): Laravel
# CMSs set their own session names (verified against the sources): October —
# october_session (config/session.php), Winter — winter_session
# (str_slug(APP_NAME,'winter').'._session'), Bagisto —
# Str::slug(APP_NAME).'_session' per the skeleton. The pair "a custom session
# name + the encrypted envelope" without XSRF-TOKEN was caught only by the
# generic *_session suffix: 0.15 + 0.5 → 0.575 < 0.6 — a miss the T-116
# calibration did not close. The cookie_cms_session rule (0.35, the level of
# laravel_session — the names are Laravel-ecosystem, unlike the suffix, which
# collides with ci_session): 0.35 + 0.5 → 0.675 ≥ 0.6. The composition —
# only names verified against the sources (the botble/pyrocms/asgard
# candidates were not confirmed — not included; statamic keeps
# laravel_session). Double counting with the suffix rule is consistent with
# the laravel_session behavior (it matches both). The __Secure-/__Host-
# prefixes (October ≥1.1 adds them automatically on https) are covered in
# both rules.
#
# The ver_min/ver_max version bounds — per the documentation and the history
# of the Laravel skeleton (laravel.com/docs, github.com/laravel/laravel):
#   * Vite — the main build since Laravel 9.19.0 (June 2022,
#     laravel-vite-plugin); Vite can also be wired manually to any version,
#     the bound is indicative, like all the set's bounds;
#   * Laravel Mix — the default build until 9.19 (Mix itself — since Laravel
#     5.4, before that Elixir); Mix is installed on new versions too — ver_max
#     is indicative;
#   * the classic welcome page (the position-ref style) — Laravel 5.3–7.x,
#     replaced by the Tailwind version in 8.0 (September 2020).
# The intersection of hit-rule ranges and the conflict flag (an empty
# intersection) are computed by the engine (spec §5.8).
#
# The sample corpus for checks — testdata/laravel-samples (make test-rules and
# the internal/rules/laravel_test.go test): the expected composition of hit
# rules, is_laravel and the version range are pinned in each sample's meta.yaml.

rules:
  # ------------------------------------------------------------ cookies
  # Laravel encrypts the values of all cookies (EncryptCookies): the value is
  # base64 JSON {"iv":..., "tag":..., "value":...}, i.e. it starts with eyJpdiI6.
  # XSRF-TOKEN is set by VerifyCsrfToken; the default session name is
  # laravel_session (Str::slug(APP_NAME)+'_session', Laravel 5+).
  - id: cookie_xsrf_token
    description: XSRF-TOKEN cookie (VerifyCsrfToken; the name also occurs outside Laravel — medium weight)
    target: cookie_name
    match: "XSRF-TOKEN"
    weight: 0.25

  - id: cookie_laravel_session
    description: laravel_session cookie — the default session name (Laravel 4+)
    target: cookie_name
    match: "laravel_session"
    weight: 0.35

  - id: cookie_cms_session
    description: Session cookie of a Laravel CMS with its own name — october/winter/bagisto _session (verified against the CMS sources; __Secure-/__Host- prefixes — October ≥1.1 adds them automatically on https)
    target: cookie_name
    regex: '^(?:__Secure-|__Host-)?(?:october|winter|bagisto)_session$'
    weight: 0.35

  - id: cookie_session_suffix
    description: <app_name>_session cookie, optionally with the __Secure-/__Host- prefix (weak sign — ci_session in CodeIgniter, _<app>_session in Rails)
    target: cookie_name
    regex: '^(?:__Secure-|__Host-)?[a-z0-9_\-]+_session$'
    weight: 0.15

  - id: cookie_encrypted_payload
    description: Encrypted Laravel cookie value (base64 of {"iv":…} — EncryptCookies; the eyJpdiI6 prefix does not occur outside Laravel)
    target: cookie_value
    regex: '^eyJpdiI6'
    weight: 0.5

  - id: cookie_remember_guard
    description: remember_<guard>_<sha1> cookie — "remember me" (SessionGuard; does not occur outside Laravel)
    target: cookie_name
    regex: '^remember_[a-z0-9]+_[0-9a-f]{32,40}$'
    weight: 0.35

  # ------------------------------------------------------------ headers
  # The PHP built-in server (php -S; php artisan serve — the framework's
  # command since Laravel 5.7) — practically the only server sending the Host
  # header in the RESPONSE. A weak "dev box" sign: php -S suits non-Laravel
  # apps too. Ordinary PHP hostings (X-Powered-By, Server: PHP/…) are not
  # taken — that is a sign of PHP in general, not Laravel, and would be noise
  # on every WordPress.
  - id: header_php_cli_server
    description: Host header in a response — PHP built-in server (php artisan serve)
    target: header_name
    match: "Host"
    weight: 0.2

  # ------------------------------------------------------------ meta
  - id: meta_csrf_token
    description: csrf-token meta (weak sign — Rails and Symfony templates generate the same meta tags)
    target: meta
    regex: 'name=["'']csrf-token["'']'
    weight: 0.2

  # ------------------------------------------------------------ HTML: forms
  - id: form_csrf_input
    description: Hidden _token field — csrf_field() output (Symfony writes form[_token], CakePHP — _csrfToken)
    target: html
    regex: '<input[^>]+name="_token"'
    weight: 0.25

  # ------------------------------------------------------------ HTML: builds
  - id: vite_assets
    description: Vite build — the laravel-vite-plugin default (/build/assets/ + an 8-character hash)
    target: html
    regex: '/build/assets/[^"'']+-[A-Za-z0-9_-]{8}\.(js|css)'
    weight: 0.2
    ver_min: "9.19"

  - id: vite_dev_client
    description: Vite dev server (@vite/client under npm run dev; Vite itself is not Laravel-only)
    target: html
    regex: '@vite/client'
    weight: 0.1
    ver_min: "9.19"

  - id: mix_assets
    description: Laravel Mix build (?id= with 20 hex chars from mix-manifest.json)
    target: html
    regex: '\.(css|js)\?id=[0-9a-f]{20}'
    weight: 0.15
    ver_max: "9.x"

  # ------------------------------------------------------------ HTML: stack
  - id: inertia
    description: Inertia.js (the data-page attribute; a Laravel-first ecosystem, but there are adapters for Rails too)
    target: html
    regex: 'data-page=["'']'
    weight: 0.2

  - id: livewire_attrs
    description: Livewire — wire:* attributes (Livewire runs only on top of Laravel)
    target: html
    regex: '\swire:[a-z]+'
    weight: 0.5

  - id: livewire_script
    description: Livewire — the livewire*.js client script
    target: html
    regex: 'livewire[^"'']{0,40}\.js'
    weight: 0.25

  - id: ziggy_routes
    description: Ziggy — Laravel routes in JS (const Ziggy = ...; a package of the Laravel ecosystem)
    target: html
    regex: 'const Ziggy\s*='
    weight: 0.35

  - id: sanctum_csrf_cookie
    description: Sanctum SPA authentication (the /sanctum/csrf-cookie request in an inline script)
    target: html
    regex: '/sanctum/csrf-cookie'
    weight: 0.3

  - id: laravel_debugbar
    description: Laravel Debugbar (barryvdh; bare phpdebugbar is rare outside Laravel)
    target: html
    regex: 'phpdebugbar|laravel-debugbar'
    weight: 0.3

  - id: window_laravel
    description: window.Laravel = {...} — the default Laravel layouts (5.3+; does not occur outside Laravel)
    target: html
    regex: 'window\.Laravel\s*='
    weight: 0.4

  - id: json_message_key
    description: JSON response {"message":"…"} — Laravel error handling (API routes/JSON requests; in larasites it was harvested by an active 404 probe — here passively, T-117)
    target: html
    regex: '\{"message":"[^"]{1,120}"\}'
    weight: 0.25

  # --------------------------------------- HTML: default pages/views
  - id: welcome_classic
    description: Classic Laravel 5.3–7.x welcome page (position-ref / title m-b-md)
    target: html
    regex: 'position-ref full-height|title m-b-md'
    weight: 0.45
    ver_min: "5.3"
    ver_max: "7.x"

  - id: laravel_docs_link
    description: A link to https://laravel.com/docs (Laravel welcome pages; sometimes reviews and blogs)
    target: html
    regex: 'https://laravel\.com/docs'
    weight: 0.3

  - id: pagination_aria
    description: Default pagination — the Tailwind look (aria-label="Pagination Navigation")
    target: html
    regex: 'aria-label="Pagination Navigation"'
    weight: 0.25
