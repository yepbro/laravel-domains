# Рабочий набор правил поиска Laravel (ТЗ §5.8; порог is_laravel — score >= 0.6,
# конфиг analyzer.laravel_min_score, §13.1). Все срабатывания (любое правило)
# пишутся в laravel_findings, поэтому слабые признаки сознательно получают низкий
# вес: поодиночке они остаются ниже порога и не попадают в laravel_domains.
#
# Вес (0..1] — «сила» признака: чем реже он встречается вне Laravel, тем выше.
# Накопление независимых признаков — noisy-OR: 1 − Π(1 − wᵢ) (ТЗ §5.8), порог
# 0.6 достигается 1–2 сильными признаками либо сочетанием слабых.
#
# Калибровка T-116 (сверка с larasites 2026-10-19): stateless API (api-субдомен
# без сессии на главной) детектируется парой кук XSRF-TOKEN + шифрованный
# конверт — 0.25 + 0.5 → 0.625 ≥ 0.6; для этого вес cookie_encrypted_payload
# поднят с 0.45 (пара давала 0.5875 — сайт выпадал из laravel_domains).
# Шумовые сочетания без шифрованной куки остаются ниже порога: Rails-пара
# csrf-meta + *_session — 0.32; CodeIgniter-тройка ci_session + csrf-meta +
# форма _token — 0.49. Порог 0.6 не менялся.
#
# Калибровка T-134 (сверка с larasites, 2026-10-19): CMS на Laravel ставят
# собственные имена сессии (проверено по исходникам): October — october_session
# (config/session.php), Winter — winter_session (str_slug(APP_NAME,'winter')
# .'_session'), Bagisto — Str::slug(APP_NAME).'_session' по скелету. Пару
# «кастомное имя сессии + шифро-конверт» без XSRF-TOKEN ловил только
# генерический суффикс *_session: 0.15 + 0.5 → 0.575 < 0.6 — пропуск, который
# не закрыла калибровка T-116. Правило cookie_cms_session (0.35, уровень
# laravel_session — имена Laravel-экосистемны, в отличие от суффикса,
# совпадающего с ci_session): 0.35 + 0.5 → 0.675 ≥ 0.6. Состав — только
# имена, проверяемые по исходникам (кандидаты botble/pyrocms/asgard не
# подтверждены — не включены; statamic оставляет laravel_session). Двойной
# учёт с суффиксным правилом консистентен с поведением laravel_session
# (совпадает с обоими). Префиксы __Secure-/__Host- (October ≥1.1 добавляет
# автоматически на https) учтены в обоих правилах.
#
# Версионные границы ver_min/ver_max — по документации и истории каркаса Laravel
# (laravel.com/docs, github.com/laravel/laravel):
#   * Vite — основная сборка начиная с Laravel 9.19.0 (июнь 2022,
#     laravel-vite-plugin); Vite можно подключить и вручную на любую версию,
#     граница индикативная, как и все границы набора;
#   * Laravel Mix — сборка по умолчанию до 9.19 (сам Mix — с Laravel 5.4, до
#     этого Elixir); Mix ставится и на новые версии — ver_max индикативный;
#   * классическая welcome-страница (стиль position-ref) — Laravel 5.3–7.x,
#     в 8.0 (сентябрь 2020) заменена на Tailwind-версию.
# Пересечение диапазонов сработавших правил и фиксацию конфликта (пустое
# пересечение) считает движок (ТЗ §5.8).
#
# Корпус образцов для проверки — testdata/laravel-samples (make test-rules и
# тест internal/rules/laravel_test.go): ожидаемый состав сработавших правил,
# is_laravel и диапазон версий фиксируются в meta.yaml каждого образца.

rules:
  # ------------------------------------------------------------ cookies
  # Laravel шифрует значения всех кук (EncryptCookies): значение — base64
  # JSON {"iv":..., "tag":..., "value":...}, т.е. начинается с eyJpdiI6.
  # XSRF-TOKEN выставляет VerifyCsrfToken, имя сессии по умолчанию —
  # laravel_session (Str::slug(APP_NAME)+'_session', Laravel 5+).
  - id: cookie_xsrf_token
    description: XSRF-TOKEN cookie (VerifyCsrfToken; the name also occurs outside Laravel — medium weight)
    target: cookie_name
    match: "XSRF-TOKEN"
    weight: 0.25

  - id: cookie_laravel_session
    description: laravel_session cookie — the default session name (Laravel 4+)
    target: cookie_name
    match: "laravel_session"
    weight: 0.35

  - id: cookie_cms_session
    description: Session cookie of a Laravel CMS with its own name — october/winter/bagisto _session (verified against the CMS sources; __Secure-/__Host- prefixes — October ≥1.1 adds them automatically on https)
    target: cookie_name
    regex: '^(?:__Secure-|__Host-)?(?:october|winter|bagisto)_session$'
    weight: 0.35

  - id: cookie_session_suffix
    description: <app_name>_session cookie, optionally with the __Secure-/__Host- prefix (weak sign — ci_session in CodeIgniter, _<app>_session in Rails)
    target: cookie_name
    regex: '^(?:__Secure-|__Host-)?[a-z0-9_\-]+_session$'
    weight: 0.15

  - id: cookie_encrypted_payload
    description: Encrypted Laravel cookie value (base64 of {"iv":…} — EncryptCookies; the eyJpdiI6 prefix does not occur outside Laravel)
    target: cookie_value
    regex: '^eyJpdiI6'
    weight: 0.5

  - id: cookie_remember_guard
    description: remember_<guard>_<sha1> cookie — "remember me" (SessionGuard; does not occur outside Laravel)
    target: cookie_name
    regex: '^remember_[a-z0-9]+_[0-9a-f]{32,40}$'
    weight: 0.35

  # ------------------------------------------------------------ headers
  # PHP built-in server (php -S; php artisan serve — команда фреймворка с
  # Laravel 5.7) — практически единственный сервер, шлющий заголовок Host в
  # ОТВЕТЕ. Слабый признак «dev-бокса»: php -S годится и для не-Laravel
  # приложений. Обычные PHP-хостинги (X-Powered-By, Server: PHP/…) не берём —
  # это признак PHP вообще, а не Laravel, и шумел бы на каждом WordPress.
  - id: header_php_cli_server
    description: Host header in a response — PHP built-in server (php artisan serve)
    target: header_name
    match: "Host"
    weight: 0.2

  # ------------------------------------------------------------ meta
  - id: meta_csrf_token
    description: csrf-token meta (weak sign — Rails and Symfony templates generate the same meta tags)
    target: meta
    regex: 'name=["'']csrf-token["'']'
    weight: 0.2

  # ------------------------------------------------------------ HTML: формы
  - id: form_csrf_input
    description: Hidden _token field — csrf_field() output (Symfony writes form[_token], CakePHP — _csrfToken)
    target: html
    regex: '<input[^>]+name="_token"'
    weight: 0.25

  # ------------------------------------------------------------ HTML: сборка
  - id: vite_assets
    description: Vite build — the laravel-vite-plugin default (/build/assets/ + an 8-character hash)
    target: html
    regex: '/build/assets/[^"'']+-[A-Za-z0-9_-]{8}\.(js|css)'
    weight: 0.2
    ver_min: "9.19"

  - id: vite_dev_client
    description: Vite dev server (@vite/client under npm run dev; Vite itself is not Laravel-only)
    target: html
    regex: '@vite/client'
    weight: 0.1
    ver_min: "9.19"

  - id: mix_assets
    description: Laravel Mix build (?id= with 20 hex chars from mix-manifest.json)
    target: html
    regex: '\.(css|js)\?id=[0-9a-f]{20}'
    weight: 0.15
    ver_max: "9.x"

  # ------------------------------------------------------------ HTML: стек
  - id: inertia
    description: Inertia.js (the data-page attribute; a Laravel-first ecosystem, but there are adapters for Rails too)
    target: html
    regex: 'data-page=["'']'
    weight: 0.2

  - id: livewire_attrs
    description: Livewire — wire:* attributes (Livewire runs only on top of Laravel)
    target: html
    regex: '\swire:[a-z]+'
    weight: 0.5

  - id: livewire_script
    description: Livewire — the livewire*.js client script
    target: html
    regex: 'livewire[^"'']{0,40}\.js'
    weight: 0.25

  - id: ziggy_routes
    description: Ziggy — Laravel routes in JS (const Ziggy = ...; a package of the Laravel ecosystem)
    target: html
    regex: 'const Ziggy\s*='
    weight: 0.35

  - id: sanctum_csrf_cookie
    description: Sanctum SPA authentication (the /sanctum/csrf-cookie request in an inline script)
    target: html
    regex: '/sanctum/csrf-cookie'
    weight: 0.3

  - id: laravel_debugbar
    description: Laravel Debugbar (barryvdh; bare phpdebugbar is rare outside Laravel)
    target: html
    regex: 'phpdebugbar|laravel-debugbar'
    weight: 0.3

  - id: window_laravel
    description: window.Laravel = {...} — the default Laravel layouts (5.3+; does not occur outside Laravel)
    target: html
    regex: 'window\.Laravel\s*='
    weight: 0.4

  - id: json_message_key
    description: JSON response {"message":"…"} — Laravel error handling (API routes/JSON requests; in larasites it was harvested by an active 404 probe — here passively, T-117)
    target: html
    regex: '\{"message":"[^"]{1,120}"\}'
    weight: 0.25

  # --------------------------------------- HTML: страницы/виды по умолчанию
  - id: welcome_classic
    description: Classic Laravel 5.3–7.x welcome page (position-ref / title m-b-md)
    target: html
    regex: 'position-ref full-height|title m-b-md'
    weight: 0.45
    ver_min: "5.3"
    ver_max: "7.x"

  - id: laravel_docs_link
    description: A link to https://laravel.com/docs (Laravel welcome pages; sometimes reviews and blogs)
    target: html
    regex: 'https://laravel\.com/docs'
    weight: 0.3

  - id: pagination_aria
    description: Default pagination — the Tailwind look (aria-label="Pagination Navigation")
    target: html
    regex: 'aria-label="Pagination Navigation"'
    weight: 0.25
