# Hot-reload (air) configuration for the Go services.
#
# __SERVICE__ is replaced with the service name (ingest, scheduler, ...) by the
# deploy/docker/scripts/air-entrypoint.sh script at container startup, so a
# single file serves all Compose services.
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/__SERVICE__ ./cmd/__SERVICE__"
bin = "./tmp/__SERVICE__"
# Rebuild only on Go code changes. The rules/ directory is excluded:
# Laravel rules are reloaded via SIGHUP (make rules-reload), without a restart.
include_ext = ["go"]
exclude_dir = ["tmp", "var", "bin", "deploy", "docs", "testdata", "migrations", "rules", "tasks", ".git", ".github", ".idea", ".vscode"]
exclude_regex = ["_test\\.go$"]
delay = 1000
stop_on_root_error = true
send_interrupt = true
kill_delay = "5s"

[log]
time = true
main_only = false

[misc]
clean_on_exit = true
